# Step 0 of the review-and-land bot: prove the model gateway works from a runner.
#
# THIS FILE IS TEMPORARY. It exists to answer four questions that cannot be
# answered from the LAN, and is deleted once its answers are written into
# docs/superpowers/specs/2026-08-11-claude-review-and-land-bot-design.md:
#
#   1. Does the key authenticate from an Azure runner, not merely from here?
#   2. Does `claude-opus-5` resolve through the gateway under a real agent session?
#   3. Does /v1/messages/count_tokens answer, rather than 404?
#   4. Do cross-border latency and the Opus quota tolerate a real review?
#
# All model traffic goes through the Sub2API gateway at api.tc-imba.com rather
# than api.anthropic.com. Two things about that were established by probing it
# on 2026-08-11 and are load-bearing here:
#
#   ANTHROPIC_BASE_URL must carry NO trailing slash. With one, the request path
#   becomes //v1/messages, which the gateway answers with its own single-page-app
#   HTML and a 200 -- so the failure surfaces as a JSON parse error nowhere near
#   its cause, rather than as an HTTP error.
#
#   It is read from the `env` CONTEXT (action.yml sets
#   ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}), so it has to be set at
#   workflow or job level. Setting it on the `uses:` step does not populate that
#   context and the override is silently lost.
#
# Run it from the Actions tab. Nothing here touches the repository.

name: Check the model gateway (temporary)

on:
  # GitHub offers a workflow_dispatch entry only for the DEFAULT branch, so on its
  # own this check could not run until it had landed -- the wrong order for the
  # check that is supposed to gate landing. The pull_request trigger is how it
  # runs first, scoped to this one file so it fires on no other pull request.
  # Secrets are available because the branch is in this repository, not a fork.
  pull_request:
    paths:
      - .github/workflows/claude-gateway-check.yml
  workflow_dispatch:

permissions:
  contents: read

# Workflow level, deliberately -- see the header.
env:
  ANTHROPIC_BASE_URL: https://api.tc-imba.com
  MODEL: claude-opus-5

jobs:
  gateway:
    runs-on: ubuntu-latest
    name: gateway

    steps:
      - name: Check the key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add the Sub2API gateway key as a repository secret."
            exit 1
          fi

      # Raw HTTP first, so that a failure in the action below can be attributed
      # to the action rather than to the gateway. Times are reported because
      # question 4 is about latency from Azure to Shanghai, which no amount of
      # local probing answers.
      - name: Probe /v1/messages directly
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # --fail is deliberately NOT used: a non-2xx body is the most useful
          # thing on screen, and `set -e` plus the explicit check below covers it.
          code=$(curl -sS -o "$RUNNER_TEMP/messages.json" -w '%{http_code}' \
            --max-time 120 \
            -X POST "$ANTHROPIC_BASE_URL/v1/messages" \
            -H 'content-type: application/json' \
            -H 'anthropic-version: 2023-06-01' \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -d "{\"model\":\"$MODEL\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: pong\"}]}")
          echo "HTTP $code"
          # The key is never in the response, so printing the body is safe.
          cat "$RUNNER_TEMP/messages.json"; echo
          if [ "$code" != "200" ]; then
            echo "::error::Gateway returned HTTP $code for model $MODEL."
            exit 1
          fi
          # Echoing the model back proves the gateway resolved the alias rather
          # than quietly substituting something else.
          echo "resolved model: $(jq -r '.model // "ABSENT"' "$RUNNER_TEMP/messages.json")"
          echo "stop_reason:    $(jq -r '.stop_reason // "ABSENT"' "$RUNNER_TEMP/messages.json")"

      - name: Probe /v1/messages/count_tokens directly
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/count.json" -w '%{http_code}' \
            --max-time 60 \
            -X POST "$ANTHROPIC_BASE_URL/v1/messages/count_tokens" \
            -H 'content-type: application/json' \
            -H 'anthropic-version: 2023-06-01' \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
          echo "HTTP $code"
          cat "$RUNNER_TEMP/count.json"; echo
          # Not fatal. Claude Code uses this for budgeting; a gateway that lacks
          # it may still drive a session, so this reports rather than fails and
          # the result is recorded in the spec either way.
          if [ "$code" != "200" ]; then
            echo "::warning::count_tokens returned HTTP $code. Record this in the spec -- the agent may misjudge its context budget."
          fi

      # Round-trip latency across ten calls. One sample says nothing about
      # whether a multi-turn review is going to be painful.
      - name: Measure round-trip latency
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            curl -sS -o /dev/null -w "  call $i: %{time_total}s (connect %{time_connect}s, tls %{time_appconnect}s)\n" \
              --max-time 120 \
              -X POST "$ANTHROPIC_BASE_URL/v1/messages" \
              -H 'content-type: application/json' \
              -H 'anthropic-version: 2023-06-01' \
              -H "x-api-key: $ANTHROPIC_API_KEY" \
              -d "{\"model\":\"$MODEL\",\"max_tokens\":8,\"messages\":[{\"role\":\"user\",\"content\":\"ok\"}]}"
          done

      - name: Checkout
        uses: actions/checkout@v4

      # The real question: not "does the endpoint answer curl" but "does an
      # agent session survive it". The action drives many turns with tool use
      # and prompt caching, any of which a gateway can mishandle.
      - name: Run a real agent session through the gateway
        id: agent
        uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1.0.190
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Multi-turn and tool-using on purpose. A single-turn reply would not
          # exercise the paths a review actually takes.
          prompt: |
            Do these three things, then stop.

            1. Run `git log --oneline -3` and report what it printed.
            2. Read .github/workflows/ci.yml and state in one sentence what its `go` job does.
            3. Print the line GATEWAY_OK followed by the model id you are running as.

            Do not modify any file. Do not create commits, branches, comments or
            pull requests.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Bash(git log:*),Read"
          track_progress: false
          show_full_output: true

      - name: Report the verdict
        if: always()
        env:
          CONCLUSION: ${{ steps.agent.outputs.conclusion }}
        run: |
          set -euo pipefail
          echo "agent conclusion: ${CONCLUSION:-<none>}"
          {
            echo "### Gateway check"
            echo
            echo "- endpoint: \`$ANTHROPIC_BASE_URL\`"
            echo "- model requested: \`$MODEL\`"
            echo "- agent conclusion: \`${CONCLUSION:-<none>}\`"
            echo
            echo "Record these in \`docs/superpowers/specs/2026-08-11-claude-review-and-land-bot-design.md\` §9, then delete this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${CONCLUSION:-}" != "success" ]; then
            echo "::error::The agent session did not succeed. The rest of the bot is not worth wiring until it does."
            exit 1
          fi

# Lands a pull request by fast-forwarding master onto its head, on request.
#
# Why fast-forward rather than one of GitHub's merge buttons: every changelog.json
# entry pins a full 40-char commit SHA, so any method that REWRITES a commit
# orphans those SHAs -- the JSON still validates, `pnpm test` still passes, and the
# compare links point at commits that live only in refs/pull/N/head. "Rebase and
# merge" rewrites every commit (and lands them unsigned, since GitHub has neither
# our key nor authorship); "Squash and merge" replaces them with one new commit.
# Both are disabled in repository settings. A merge commit is SHA-safe and stays
# enabled as the fallback, but it adds a bubble to a history we keep linear.
#
# A fast-forward rewrites nothing, so SHAs and signatures both survive untouched.
#
# This workflow deliberately CANNOT rebase. When the branch is behind master it
# refuses and asks for a rebase, because rebasing here would rewrite the very
# commits this exists to preserve, and the runner has no signing key to re-sign
# them with. "Already rebased" is the precondition, not something we fix for you.
#
# Note also why the ruleset on master does NOT require linear history: GitHub
# requires squash or rebase merging to be enabled whenever that rule is on, which
# would put a SHA-rewriting button back on the pull request page. The ruleset
# blocks force pushes and deletions only.
#
# Preconditions, all of them refusals rather than fixes: the requester may push;
# the pull request is open against master; CI passed on the head commit; master is
# already an ancestor of the head; there are no merge commits; every commit is
# verified; and changelog:verify passes.
#
# WHERE THE LOGIC LIVES
#
# In .github/scripts/ff-*.sh, not in this file. Anything inside a `run:` block is
# untestable by construction -- four of the five defects the sibling review bot
# shipped with were shell bugs of exactly that kind, each found by running it in
# production and reading the logs. Every rule above is therefore a script that
# .github/scripts/tests/run.sh calls with arguments and asserts on, and this file
# is plumbing: check out, set env, call the script, post the comment. The
# explanatory comments moved with the code they explain.
#
# THE REVIEW BOT
#
# claude.yml may request a land on its own behalf, and its `/fast-forward` comment
# carries `<!-- claude-land chain=<id> attempt=<n> -->`. Two things follow.
#
#   The bot is authorised by LOGIN (vars.CLAUDE_BOT_LOGIN), never by the presence
#   of that marker -- a marker is just text anyone can paste, and trusting it
#   would be a way past the permission gate.
#
#   When a bot-initiated attempt is refused, the reason is addressed `@claude` and
#   posted with FAST_FORWARD_TOKEN, so claude.yml re-enters and can repair the
#   cause. A GITHUB_TOKEN comment triggers nothing, which is exactly why the reply
#   needs the PAT.
#
# Secrets and variables:
#   FAST_FORWARD_TOKEN  fine-grained PAT on arkive-games/arkive. Needs
#                       Contents:Write for the push, and Pull-requests:Write so a
#                       refusal can wake the review bot.
#                       The default GITHUB_TOKEN cannot be used: pushes made with
#                       it do not trigger other workflows, so the EdgeOne deploy
#                       would never run for a landed pull request.
#   vars.CLAUDE_BOT_LOGIN  login of the review bot App, e.g. `arkive-bot[bot]`.
#                       Unset means no bot is recognised, which is the safe
#                       default and leaves this workflow behaving exactly as it
#                       did before the bot existed.

name: Fast-forward a pull request

on:
  issue_comment:
    types: [created]
  # Escape hatch for when the comment trigger is not usable (a run that needs
  # re-driving). `edited` is deliberately not a trigger: an old comment must not
  # be editable into a merge command.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to fast-forward"
        required: true

# `pull-requests`/`issues: write` are for this workflow's own reply comments; a
# comment on a pull request goes through the issues API, so both are needed. The
# push to master does NOT use this token -- see FAST_FORWARD_TOKEN above.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  fast-forward:
    # The comment must BEGIN with the command, so quoting it in prose ("comment
    # /fast-forward when ready") cannot land a pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/fast-forward'))

    runs-on: ubuntu-latest

    # master must never be advanced by two runs at once. Queue rather than cancel:
    # a queued run has pushed nothing, so waiting is always safe.
    concurrency:
      group: fast-forward-master
      cancel-in-progress: false

    # Quoted: an unquoted `#` after a space would start a YAML comment.
    name: "PR #${{ github.event.issue.number || inputs.pr }}"

    env:
      PR: ${{ github.event.issue.number || inputs.pr }}
      REPO: ${{ github.repository }}

    steps:
      # First, because every other step calls one of these scripts -- including
      # the last one, which reports the result even when the run failed.
      #
      # Sparse: the gate is a handful of shell files, and the point of asking the
      # CI API before cloning is that a red pull request should be refused without
      # paying for a full checkout. This costs a shallow fetch of one directory.
      #
      # `ref` is left at the default, which for issue_comment and
      # workflow_dispatch is the default branch. That matters: the checkout of the
      # pull request head further down brings the CONTRIBUTOR's files, and the
      # gate must never be judged by the branch it is judging.
      #
      # `path` keeps this in its own git directory, so the sparse cone set here
      # cannot still be in effect for the full checkout below -- which needs
      # frontend/ to exist.
      - name: Check out the gate scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: .gate-checkout
          persist-credentials: false

      # Out of the workspace, because actions/checkout cleans it -- the pull
      # request checkout below would otherwise delete the scripts mid-run.
      - name: Stage the gate scripts outside the workspace
        run: |
          set -euo pipefail
          cp -R .gate-checkout/.github/scripts "$RUNNER_TEMP/ff-scripts"
          chmod +x "$RUNNER_TEMP"/ff-scripts/*.sh

      # Checked before anything reads the pull request: with no token the run
      # would do all the work and then die on a git auth error that says nothing
      # about which secret is missing.
      - name: Check the push token is configured
        env:
          FAST_FORWARD_TOKEN: ${{ secrets.FAST_FORWARD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FAST_FORWARD_TOKEN:-}" ]; then
            echo "::error::FAST_FORWARD_TOKEN is not set. Add a fine-grained PAT with Contents:Write on arkive-games/arkive. The default GITHUB_TOKEN cannot be used: pushes made with it do not trigger the EdgeOne deploy."
            exit 1
          fi

      - name: Check the requester may push
        id: requester
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTER: ${{ github.event.comment.user.login || github.actor }}
          BOT_LOGIN: ${{ vars.CLAUDE_BOT_LOGIN }}
          # Through env, never inline: the body is attacker-controlled and an
          # inline expansion into a run: block is shell injection.
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ff-scripts/ff-requester.sh"

      # Every refusal from here on writes its reason to $RUNNER_TEMP/refusal.md
      # (the default in ff-common.sh) and the last step posts it. Not the
      # workspace: actions/checkout cleans that, which would delete a reason
      # written before it. Not a job-level `env` either -- the `runner` context is
      # unavailable there, which is why the scripts default the path themselves.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ff-scripts/ff-resolve-pr.sh"

      # Placed before the checkout because it is one API call, and a red pull
      # request should be refused before cloning the repository.
      - name: Wait for CI to pass on the head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          TIMEOUT_SECONDS: 600
          POLL_SECONDS: 20
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ff-scripts/ff-ci-wait.sh"

      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          # refs/pull/N/head resolves for fork pull requests too, whose commits
          # are on no branch of this repository.
          ref: refs/pull/${{ env.PR }}/head
          # The ancestry, merge-commit and changelog checks below all walk real
          # history; a shallow clone would fail them for the wrong reason.
          fetch-depth: 0
          # Load-bearing. Left at its default (true), checkout writes
          #   http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>
          # into the local config, and that header applies to EVERY github.com URL --
          # overriding the userinfo in the push URL below. So the push authenticated as
          # github-actions[bot] no matter what FAST_FORWARD_TOKEN held, and died with
          # "Permission to arkive-games/arkive.git denied to github-actions[bot]" while
          # the secret was correctly configured, which points the blame in exactly the
          # wrong direction. Nothing here needs the persisted credential: the repo is
          # public, so `git fetch origin master` works unauthenticated, and the push
          # carries its own token.
          persist-credentials: false

      - name: Setup Node
        # changelog-verify.mjs imports only node builtins, so it needs a Node but
        # no `pnpm install`. Pinned to 22 to match the other workflows.
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the branch is already rebased on master
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          # FETCH_HEAD, not origin/master: `git fetch origin master` updates no
          # remote-tracking ref, and checkout fetched only refs/pull/N/head.
          git fetch --quiet origin master
          "$RUNNER_TEMP/ff-scripts/ff-branch-state.sh" . FETCH_HEAD "$HEAD_SHA"

      - name: Check every commit is verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ff-scripts/ff-verified-commits.sh"

      - name: Check the changelog pins nothing this would orphan
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ff-scripts/ff-changelog-verify.sh" frontend

      - name: Fast-forward master
        id: push
        env:
          FAST_FORWARD_TOKEN: ${{ secrets.FAST_FORWARD_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          # Pushing the SHA rather than the branch name: the ref just verified is
          # exactly the ref that lands, even if the branch moved during the run.
          git push "https://x-access-token:$FAST_FORWARD_TOKEN@github.com/$REPO.git" \
            "$HEAD_SHA:refs/heads/master"
          echo "master is now $HEAD_SHA"

      # Same-repo branches only: a fork's branch is not ours to delete. Worth
      # doing because GitHub's delete-on-merge never fires for a pushed
      # fast-forward, so worktree branches would otherwise accumulate.
      - name: Delete the merged branch
        if: steps.push.outcome == 'success' && steps.pr.outputs.fork == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FAST_FORWARD_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF"

      - name: Report the result
        if: always()
        env:
          # A refusal addressed to the bot must WAKE the bot, and a comment
          # authored by GITHUB_TOKEN triggers no workflow. So a retry reply goes
          # out as FAST_FORWARD_TOKEN, which is a PAT and does trigger. Everything
          # else stays github-actions[bot], which is the better author for a
          # comment nobody needs to act on.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_TOKEN: ${{ secrets.FAST_FORWARD_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PUSHED: ${{ steps.push.outcome }}
          CHAIN: ${{ steps.requester.outputs.chain }}
          ATTEMPT: ${{ steps.requester.outputs.attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          retry=$("$RUNNER_TEMP/ff-scripts/ff-comment-body.sh" "$body")

          if [ "$retry" = true ]; then
            if [ -n "${RETRY_TOKEN:-}" ]; then
              GH_TOKEN="$RETRY_TOKEN" gh pr comment "$PR" --repo "$REPO" --body-file "$body"
              exit 0
            fi
            echo "::warning::FAST_FORWARD_TOKEN is unset, so this refusal cannot wake the bot. Posting it as github-actions[bot]; the chain stops here."
          fi
          gh pr comment "$PR" --repo "$REPO" --body-file "$body"

# Reviews a pull request on request, repairs what stops it landing, and asks
# fast-forward.yml to land it.
#
# Comment `@claude` on a pull request to review it. Comment `@claude fix` to
# additionally let it implement its own findings. The comment must BEGIN with
# `@claude`, so quoting the trigger in prose ("ask @claude to look") cannot start
# a run -- the same rule fast-forward.yml uses for `/fast-forward`.
#
# WHAT THE MODEL IS NOT GIVEN
#
#   It cannot push, comment, fetch, or rebase. It reads, it edits, it commits
#   locally; deterministic steps do everything else. Specifically:
#
#     no Bash(git push:*)   -- the push is an explicit step, to one branch ref
#     no Bash(gh:*)         -- every comment is posted by a step below
#     no Bash(git rebase:*) -- `git rebase --exec <cmd>` runs arbitrary commands,
#                              which would hand back everything the rest of this
#                              list takes away. The rebase is done in bash before
#                              the agent starts, and a conflict is reported rather
#                              than resolved.
#     no WebFetch/WebSearch -- nothing here needs the network.
#
#   And it may not edit the pipeline, under EITHER verb: .github/**, .claude/**,
#   .apm/**, CLAUDE.md, AGENTS.md, apm.yml. `@claude fix` is consent to change the
#   code under review, not the machinery reviewing it. .claude/** is the sharpest
#   of those and the least obvious -- hooks there RUN COMMANDS, so a settings edit
#   landing on master is remote code execution on every later checkout.
#
#   This matters because `contents: write` on GitHub cannot be scoped to a single
#   branch: a token that can push a pull request branch can also push master. The
#   ruleset on master (spec §8) is the enforcement; this list is what means the
#   enforcement is never tested in anger.
#
# THE RETRY CHAIN AND ITS BUDGET
#
#   Claude's `/fast-forward` comment carries `<!-- claude-land chain=<id> -->`,
#   where <id> is the comment id of the HUMAN `@claude` that began the chain. When
#   fast-forward.yml refuses such an attempt it replies addressed `@claude`, which
#   re-enters this workflow so the refusal can be repaired rather than merely read.
#
#   The budget is COUNTED AND PARSED, whichever is higher, and stops above
#   MAX_ATTEMPTS. Each source fixes the other's failure:
#
#     counting markers cannot be reset by writing `attempt=1`, but it UNDERCOUNTS
#     -- the comments-list API lags its own writes. Measured on PR #22: a marker
#     12 seconds old was still absent from the list, so attempt 2 called itself
#     attempt 1 and the chain would have run four times against a budget of three.
#
#     the number carried in the marker cannot lag, because it arrives in the event
#     payload -- but on its own it is a counter a writer could pin at 1.
#
#   Lag pushes only the count down; a forged marker only spends budget faster. To
#   under-report, both would have to be wrong at once, in opposite directions. An
#   unbounded loop here spends real money at the gateway (~$4 a cycle), so the
#   bound must not rest on one source.
#
# Secrets and variables:
#   CLAUDE_APP_ID, CLAUDE_APP_PRIVATE_KEY  the bot App. Its installation token
#                       pushes the branch and posts comments. Comments made with
#                       GITHUB_TOKEN do not trigger other workflows, so the
#                       default token cannot close the chain.
#   ANTHROPIC_API_KEY   the Sub2API gateway key (see ANTHROPIC_BASE_URL below).
#   BOT_SSH_SIGNING_KEY private half of an SSH signing key registered as a SIGNING
#                       key on the repository owner's account. A GitHub App cannot
#                       hold one -- signing keys are a user setting -- so a rebase
#                       is signed with the owner's key while the App does the
#                       pushing. Push identity and signing identity are
#                       independent. See the spec, §5.
#   vars.BOT_GIT_NAME, vars.BOT_GIT_EMAIL  committer identity. The email must be
#                       one the signing key's account has VERIFIED, or GitHub
#                       will not mark the commits verified and fast-forward.yml
#                       will refuse them.

name: Claude review and land

on:
  issue_comment:
    types: [created]

# The App token does the writing; these cover the fallback reads and this
# workflow's own failure notice. A comment on a pull request goes through the
# issues API, so both issues and pull-requests are needed.
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # Workflow level, deliberately: claude-code-action reads this from the `env`
  # CONTEXT, so setting it on the `uses:` step silently loses the override. Must
  # carry NO trailing slash -- with one, the gateway answers //v1/messages with
  # its own single-page-app HTML and a 200, which surfaces as a parse error far
  # from its cause.
  ANTHROPIC_BASE_URL: https://api.tc-imba.com
  MAX_ATTEMPTS: 3

jobs:
  preflight:
    # Cheap gate first, so an unrelated comment costs no runner time.
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@claude')

    runs-on: ubuntu-latest
    name: "preflight #${{ github.event.issue.number }}"

    outputs:
      go: ${{ steps.gate.outputs.go }}
      verb: ${{ steps.gate.outputs.verb }}
      chain: ${{ steps.gate.outputs.chain }}
      attempt: ${{ steps.gate.outputs.attempt }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head: ${{ steps.pr.outputs.head }}
      fork: ${{ steps.pr.outputs.fork }}
      base: ${{ steps.pr.outputs.base }}

    steps:
      - name: Mint an App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      # Checkout first: the gate is a script now, not an embedded block, which is
      # how its authorisation and budget rules became assertable. See
      # .github/scripts/tests/test-claude-gate.sh -- 24 assertions including the
      # one that matters most, that a stranger pasting a chain marker into a
      # comment is still refused.
      - name: Checkout the scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The gate needs every comment on the pull request, both to count chain
      # markers and (below) to find the previous review. Fetched once, here.
      - name: Fetch the comment thread
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq_fmt='.[] | "<<<comment \(.user.login) \(.created_at)>>>", .body'
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq "$jq_fmt" \
            > "$RUNNER_TEMP/comments.txt"
          echo "thread is $(wc -l < "$RUNNER_TEMP/comments.txt") lines"

      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, never inline: the body is attacker-controlled on a public
          # repository and an inline ${{ }} expansion into a run: block is shell
          # injection.
          BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Resolved here rather than in the script, so the script stays pure and
          # every branch of it is testable without a network. Not
          # author_association: that reports MEMBER/CONTRIBUTOR from org and commit
          # history, neither of which is push access.
          PERMISSION=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission 2>/dev/null || echo none)
          export PERMISSION COMMENTS_FILE="$RUNNER_TEMP/comments.txt"
          echo "$COMMENTER has '$PERMISSION' permission"

          .github/scripts/claude-gate.sh | tee "$RUNNER_TEMP/gate.txt"
          grep -E '^(go|verb|chain|attempt)=' "$RUNNER_TEMP/gate.txt" >> "$GITHUB_OUTPUT"

          # The budget notice is the one refusal worth saying out loud: silence
          # would read as the bot ignoring a request it actually declined.
          if grep -q '^exhausted=true' "$RUNNER_TEMP/gate.txt"; then
            body="$RUNNER_TEMP/exhausted.md"
            {
              echo "Stopping: this request has used its $MAX_ATTEMPTS repair attempts and \`master\` still will not take the branch."
              echo
              echo "The refusals above say why. Landing it needs a person now."
            } > "$body"
            gh pr comment "$PR" --repo "$REPO" --body-file "$body"
          fi

      - name: Resolve the pull request
        id: pr
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" \
            --json state,baseRefName,headRefName,headRefOid,isCrossRepository \
            > "$RUNNER_TEMP/pr.json"
          state=$(jq -r .state "$RUNNER_TEMP/pr.json")
          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR is $state."
            exit 1
          fi
          {
            echo "head=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")"
            echo "head_ref=$(jq -r .headRefName "$RUNNER_TEMP/pr.json")"
            echo "fork=$(jq -r .isCrossRepository "$RUNNER_TEMP/pr.json")"
            echo "base=$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

  run:
    needs: preflight
    if: needs.preflight.outputs.go == 'true'

    runs-on: ubuntu-latest
    name: "${{ needs.preflight.outputs.verb }} #${{ github.event.issue.number }} (attempt ${{ needs.preflight.outputs.attempt }})"

    # One run per pull request. Two agents editing the same branch would race on
    # the force-push; queueing is safe because a queued run has pushed nothing.
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false

    env:
      PR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      VERB: ${{ needs.preflight.outputs.verb }}
      CHAIN: ${{ needs.preflight.outputs.chain }}
      ATTEMPT: ${{ needs.preflight.outputs.attempt }}
      HEAD_REF: ${{ needs.preflight.outputs.head_ref }}
      IS_FORK: ${{ needs.preflight.outputs.fork }}
      BASE_REF: ${{ needs.preflight.outputs.base }}

    steps:
      - name: Mint an App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      # First thing after the token, deliberately BEFORE the checkout, the pnpm
      # install and the rebase -- those are a minute or two on their own, and a
      # full review is ~10 minutes. Until something is posted the pull request
      # looks untouched, so the author cannot tell a run that is working from one
      # that never triggered, and re-comments `@claude` -- which spends a second
      # attempt out of three and queues a second run on the same branch.
      #
      # This comment is EDITED by "Post the review" below rather than joined by a
      # second one; the id it captures is what makes that possible. Posted with
      # the App token like every other comment here: a GITHUB_TOKEN comment
      # cannot later be edited by the App, and consistency of author matters more
      # than which token happens to be in scope.
      - name: Say the review has started
        id: progress
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/progress.md"
          {
            printf 'Reviewing this pull request now — verb `%s`, attempt %s of %s.\n' \
              "$VERB" "$ATTEMPT" "$MAX_ATTEMPTS"
            printf '\nA review takes several minutes. The findings replace this comment when the run finishes, so there is nothing to wait on here and nothing is pushed before then.\n'
            printf '\n<sub>[review run](%s) · in progress</sub>\n' "$RUN_URL"
          } > "$body"

          # `-F body=@file` and not `-f`: only the typed field (`--field`) expands
          # a leading `@` into a file read, and only a file avoids passing a
          # multi-line body through argv. `gh pr comment` is not used because it
          # prints a URL and returns no id, and the id is the point of this step.
          #
          # Never fatal. This is a courtesy notice; failing the run over it would
          # cost the review it was announcing.
          id=$(gh api --method POST "repos/$REPO/issues/$PR/comments" \
                 -F body=@"$body" --jq .id) || {
            echo "::warning::Could not post the progress comment. The review will post a fresh comment instead."
            id=""
          }
          echo "comment_id=$id" >> "$GITHUB_OUTPUT"
          echo "progress comment id: ${id:-<none>}"

      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          # A fork's branch is not ours to push, so it is checked out by the pull
          # ref and reviewed read-only. A same-repo branch is checked out BY NAME
          # so the later push has a branch to update.
          ref: ${{ needs.preflight.outputs.fork == 'true' && format('refs/pull/{0}/head', github.event.issue.number) || needs.preflight.outputs.head_ref }}
          # The rebase and changelog:verify both walk real history.
          fetch-depth: 0
          # Load-bearing, for the reason fast-forward.yml documents at length:
          # left at its default, checkout writes an AUTHORIZATION header into the
          # local config that applies to EVERY github.com URL and overrides the
          # userinfo in an explicit push URL. The push below carries its own token.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # A GitHub App cannot hold an SSH signing key -- signing keys are a user
      # setting -- so commits are signed with a key on the owner's account while
      # the App does the pushing.
      #
      # The allowed-signers file is not optional: without it git cannot VERIFY an
      # SSH signature locally, so `%G?` reports E/N even for a correctly signed
      # commit, and the check before the push would reject its own work.
      - name: Configure git identity and signing
        env:
          SIGNING_KEY: ${{ secrets.BOT_SSH_SIGNING_KEY }}
          BOT_NAME: ${{ vars.BOT_GIT_NAME }}
          BOT_EMAIL: ${{ vars.BOT_GIT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::BOT_SSH_SIGNING_KEY is not set. A rebase would produce unverified commits, which fast-forward.yml refuses."
            exit 1
          fi
          if [ -z "${BOT_EMAIL:-}" ] || [ -z "${BOT_NAME:-}" ]; then
            echo "::error::vars.BOT_GIT_NAME and vars.BOT_GIT_EMAIL must both be set. The email must be verified on the account holding the signing key, or GitHub will not mark the commits verified."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SIGNING_KEY" > ~/.ssh/bot_signing
          chmod 600 ~/.ssh/bot_signing
          ssh-keygen -y -f ~/.ssh/bot_signing > ~/.ssh/bot_signing.pub
          printf '%s %s\n' "$BOT_EMAIL" "$(cat ~/.ssh/bot_signing.pub)" > ~/.ssh/allowed_signers

          git config user.name  "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/bot_signing
          git config gpg.ssh.allowedSignersFile ~/.ssh/allowed_signers
          git config commit.gpgsign true
          # commit.gpgsign does NOT cover commits a rebase rewrites.
          git config rebase.gpgSign true

          # Prove the whole chain works now, rather than discovering at the push
          # gate that the key was malformed or the email unverified.
          git commit --allow-empty -m "signing probe" --quiet
          probe=$(git log -1 --format='%G?')
          echo "signing probe: $probe ($(git log -1 --format='%GS'))"
          git reset --hard HEAD~1 --quiet
          if [ "$probe" != "G" ]; then
            echo "::error::Local signature verification returned '$probe', not 'G'. The signing key or allowed-signers setup is wrong."
            exit 1
          fi

      # `git fetch origin <branch>` updates NO remote-tracking ref -- the trap
      # fast-forward.yml documents. Checkout fetched one ref, so origin/<base> may
      # not exist at all. Fetch it explicitly.
      - name: Fetch the base branch
        run: |
          set -euo pipefail
          git fetch --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          echo "origin/$BASE_REF is $(git rev-parse "origin/$BASE_REF")"

      # Deterministic, and before the agent, so `git rebase` never has to be in
      # its toolset. A conflict is reported, never guessed at.
      - name: Rebase onto the base branch
        id: rebase
        if: env.IS_FORK == 'false'
        run: |
          set -euo pipefail
          rebased=false
          conflict=false
          if git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "Already rebased on origin/$BASE_REF."
          else
            behind=$(git rev-list --count "HEAD..origin/$BASE_REF")
            echo "Branch is $behind commit(s) behind origin/$BASE_REF; rebasing."
            if git rebase "origin/$BASE_REF"; then
              rebased=true
              echo "Rebased cleanly onto $(git rev-parse --short "origin/$BASE_REF")."
            else
              git rebase --abort || true
              conflict=true
              echo "::warning::The rebase conflicts. Reporting it rather than resolving it."
            fi
          fi
          # One write per key -- see the note in the preflight gate.
          {
            echo "rebased=$rebased"
            echo "conflict=$conflict"
          } >> "$GITHUB_OUTPUT"

      # The baseline the verb guard measures against: everything after this point
      # that is authored by the bot is the agent's own work.
      - name: Record the pre-agent state
        id: before
        run: |
          set -euo pipefail
          # The TREE, not just the commit. The autosquash rebase below rewrites the
          # whole branch, after which $BEFORE is not even an ancestor of HEAD and
          # any `$BEFORE..HEAD` range silently means something else. A tree id is
          # content, so it survives every rewrite and answers the only question the
          # guard actually asks: which files did the agent change?
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            # The identity of what this branch CONTRIBUTES, which is not the same
            # as its tree: a rebase moves the tree every time master moves, so a
            # tree comparison would almost never match. The three-dot diff is
            # against the merge base, so it is stable across a rebase that changes
            # nothing of substance -- exactly the case worth not paying to review.
            echo "delta=$(git diff "origin/$BASE_REF...HEAD" | git hash-object --stdin)"
          } >> "$GITHUB_OUTPUT"
          echo "pre-agent HEAD is $(git rev-parse HEAD)"

      # Everything the agent is told about the world outside its checkout is
      # gathered here, because it cannot look: it has no gh and no network.
      - name: Gather CI status and the previous review
        id: context
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ needs.preflight.outputs.head }}
          DELTA: ${{ steps.before.outputs.delta }}
        run: |
          set -euo pipefail
          jq_fmt='.[] | "<<<comment \(.user.login) \(.created_at)>>>", .body'
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq "$jq_fmt" \
            > "$RUNNER_TEMP/comments.txt"

          # T1: what CI already proved. The bot cannot see CI, so it re-derives
          # build/type/test breakage from source and gets it confidently wrong --
          # it blocked PR #22 on a missing `resolveJsonModule` that CI had just
          # proven unnecessary, citing four sibling apps that set the flag
          # redundantly. Telling it the verdict removes the whole class.
          ci=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA" \
                 --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status)/\(.conclusion // "pending")"' \
               2>/dev/null || echo "unknown/unknown")
          echo "ci=$ci" >> "$GITHUB_OUTPUT"
          echo "CI on $HEAD_SHA: $ci"

          # T1: the previous review, so a fresh pass does not rediscover the same
          # findings from scratch. Three passes over PR #22 each re-derived the
          # same seven non-blocking notes.
          awk '/^<<<comment .*\[bot\] /{keep=1} /^<<<comment /{if (!match($0, /\[bot\] /)) keep=0} keep' \
            "$RUNNER_TEMP/comments.txt" > "$RUNNER_TEMP/previous-reviews.md" || true
          echo "previous review material: $(wc -l < "$RUNNER_TEMP/previous-reviews.md") lines"

          # T1: has anything about the change actually moved since it was judged?
          DELTA="$DELTA" COMMENTS_FILE="$RUNNER_TEMP/comments.txt" \
            .github/scripts/claude-should-review.sh | tee "$RUNNER_TEMP/should.txt"
          grep -E '^(skip|previous_verdict)=' "$RUNNER_TEMP/should.txt" >> "$GITHUB_OUTPUT"

      # Skipped entirely when the branch's contribution has not moved since it was
      # last judged. A review is ~$4 and ten minutes, and the retry chain used to
      # spend both re-reviewing an identical diff because the gate had refused for
      # "CI is still queued" -- a timing problem answered at full price.
      - name: Review, and re-point what the rebase orphaned
        id: agent
        if: steps.context.outputs.skip != 'true'
        uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1.0.190
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          track_progress: false
          # See the header for what is deliberately absent. `git add`/`git commit`
          # are safe (no --exec equivalent); `git rebase` and `git push` are not.
          #
          # The inline-comment tool IS granted: a wall of seven prose findings is
          # hard to act on, and anchoring each to its line is the difference
          # between a review someone works through and one they skim. It posts
          # only review comments on this pull request -- it is not general gh.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git add:*),Bash(git commit:*),Bash(pnpm changelog:verify),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review pull request #${{ github.event.issue.number }} of ${{ github.repository }}.

            - branch: `${{ needs.preflight.outputs.head_ref }}` → `${{ needs.preflight.outputs.base }}`
            - verb: **${{ needs.preflight.outputs.verb }}**
            - attempt ${{ needs.preflight.outputs.attempt }} of ${{ env.MAX_ATTEMPTS }}
            - from a fork: ${{ needs.preflight.outputs.fork }}
            - rebased by the workflow just now: ${{ steps.rebase.outputs.rebased }}
            - rebase hit a conflict and was aborted: ${{ steps.rebase.outputs.conflict }}

            Read CLAUDE.md first. It is the standard you are reviewing against.

            ## What CI already proved: `${{ steps.context.outputs.ci }}`

            `ci.yml` runs, on this exact head commit: `pnpm test` (the whole unit
            suite), `eslint` for every app, `tsc -b && vite build` for every app,
            and the repository invariant checks (`check:engine-gl`, `check:shell`,
            `memory:keys:check`, `changelog:verify`).

            **If CI concluded `success`, nothing those commands would have caught
            can be a blocking finding.** Not a type error, not a failing test, not
            a lint violation, not a build break, not an unreachable changelog SHA.
            You cannot run them here, and a confident argument from reading the
            source does not outrank a green run of the actual command.

            This is not hypothetical: a previous pass blocked this bot's own work
            over a missing `resolveJsonModule`, reasoning from four sibling apps
            that set the flag — they set it redundantly, `moduleResolution:
            "bundler"` already implies it, and CI had gone green on that very
            commit. If you believe CI is wrong, say so as a non-blocking note and
            explain how to reproduce; do not hold the pull request on it.

            Findings CI cannot see — logic that is wrong but type-checks, a
            security or data-loss risk, a broken invariant no script encodes, a
            spec violation, dead e2e tests CI does not run — are exactly what you
            are here for, and they block normally.

            ## What was already said

            `${{ runner.temp }}/previous-reviews.md` holds this bot's earlier
            comments on this pull request, if any. Read it before you start.

            - Do not re-derive findings that are already there. If one is still
              open, say so in one line under a **Still open** heading and move on.
            - If a human replied dismissing a finding, it is dismissed. Do not
              raise it again.
            - Put genuinely new findings under **New since the last review**.

            A reviewer who rediscovers the same seven notes every pass is noise,
            and the author stops reading. Three earlier passes over this pull
            request did exactly that.

            ## Produce exactly two files

            Both are required. Both live outside the repository, so they can never
            end up in a commit.

            - `${{ runner.temp }}/review.md` — your review, GitHub-flavoured
              markdown, posted verbatim as a pull request comment. Write it for the
              author. No preamble, no "here is my review", no restating the task.
            - `${{ runner.temp }}/verdict.txt` — one line, exactly `LAND` or `HOLD`.

            ## LAND or HOLD

            `LAND` means nothing you found blocks the change. `HOLD` means
            something does.

            A finding **blocks** if it is a correctness defect, a security or
            data-loss risk, or a violation of a stated repository invariant — a
            shared package reaching for `localStorage` or `fetch`, an unregistered
            persistence key, a hard-coded pixel size where a Tailwind scale step
            belongs, a changelog entry for internal-only work or a missing one for
            a user-visible change, a route added without its `edgeone.json` rules,
            non-English text in repository content.

            A finding **does not block** if it is a style preference, a naming
            opinion, "this could be simpler", or speculative. Report those and
            still write `LAND`.

            Write `HOLD` if the rebase conflicted, or if you are unsure whether
            something blocks. A needless hand-back costs one comment; the opposite
            mistake puts a defect on `${{ needs.preflight.outputs.base }}` with no
            reviewer.

            ## What you may change

            Run `pnpm changelog:verify` from `frontend/`. A rebase rewrites commits
            and orphans any `changelog.json` entry that pinned one — the JSON stays
            valid and the tests keep passing while the compare link 404s. Re-point
            every entry it reports at the rewritten commit, by editing the file:
            match each entry to its commit by the change it describes, using
            `git log` to find the new SHA.

            **Commit that as a fixup, not as a new commit:**

            ```
            git add <the changelog files>
            git commit --fixup=<sha of the commit that OWNS the entry>
            ```

            The owning commit is the one whose change the entry describes — usually
            the commit whose SHA you just re-pointed it at. A later step folds the
            fixup into it automatically.

            Do not write a separate "re-point after the rebase" commit. One is
            created per bot run, so they accumulate: this pull request collected
            two before the fixup rule existed. The entry belongs *in* the commit it
            describes.

            ${{ needs.preflight.outputs.verb == 'fix' && 'Beyond that, you may edit code to implement your own findings, because a human asked you to with `@claude fix`. Commit each logical fix separately, message in this repository''s `type(scope):` style.' || 'Beyond that, change NOTHING. Do not edit code even to fix something you found — reporting it is the whole job, and a later step fails the run if you touch anything but `changelog.json`.' }}

            **Never edit any of these, under any verb.** A later step fails the run
            and pushes nothing if you do, so an edit here costs the whole review:

            - `.github/**` — workflows, including the one running you
            - `.claude/**` — hooks here execute commands
            - `.apm/**`, `CLAUDE.md`, `AGENTS.md`, `apm.yml` — agent instructions

            If a finding is *about* one of these, that is fine and useful: describe
            the change in review.md and let a person make it. You are not allowed
            to edit the machinery that reviews and lands code, because that
            machinery is what makes your own output safe to trust.

            You cannot push, comment, or open a pull request, and you should not
            try: later steps do that. Leave your commits local.

            ## Reviewing

            Read the diff, not just the file list:
            `git diff origin/${{ needs.preflight.outputs.base }}...HEAD`.

            Judge it against CLAUDE.md and the specifications it points at. Be
            specific — name the file and line, say what breaks and on what input.
            A finding nobody can act on is not worth posting.

      # Deterministic, because the instruction above lives in a prompt and prompts
      # are advisory. Authorship is the discriminator: a rebase preserves the
      # original author, so anything authored by the bot is the agent's own work.
      # claude-code-action commits under ITS OWN identity --
      # `claude[bot] <41898282+claude[bot]@users.noreply.github.com>` -- overriding
      # the git config set above. Two things broke because of that, and both were
      # silent:
      #
      #   GitHub looks for the signing key on the COMMITTER's account. Our key is
      #   on the owner's, so agent commits came out `verified=false`
      #   (reason=unknown_key) and fast-forward.yml would refuse the branch. They
      #   were signed; they were just signed by somebody GitHub could not tie to
      #   the committer.
      #
      #   Worse, the guard below identified the agent's work by author, so it
      #   matched NOTHING and passed every run while reporting "no file changes" --
      #   the protected-path rule was inert from the day it was written. Measured
      #   on PR #22, run 31523363499.
      #
      # --force-rebase recreates every commit in the range, which resets the
      # committer to this runner's config and re-signs with the bot key
      # (rebase.gpgSign). The AUTHOR is deliberately left as claude[bot]: the agent
      # did write it, and GitHub verifies against the committer -- proven by
      # 087e3175 on that same branch, authored by claude[bot], committed by the
      # bot identity, verified=true.
      # This step also folds in `fixup!` commits, which is how a re-pointed
      # changelog SHA gets back into the commit that OWNS the entry instead of
      # trailing behind it. A separate "re-point after the rebase" commit is not
      # just untidy -- it accumulates one per bot run, and PR #22 collected two
      # before this was noticed. The agent decides WHICH commit to amend, because
      # that is judgement; the rewrite is mechanical and happens here, so
      # `git rebase` still never enters the model's toolset.
      #
      # --autosquash only takes effect under -i, and GIT_SEQUENCE_EDITOR=true
      # accepts the generated todo list unedited, which is how it runs headless.
      # Rebasing from the BASE rather than from $BEFORE is required: a fixup
      # targets one of the branch's own commits, which is older than $BEFORE.
      # All three of these were embedded shell and are now scripts with tests --
      # .github/scripts/tests/test-claude-{normalise,guard,signature}.sh, 84
      # assertions between them. Each replaced a rule that had already shipped
      # broken: an autosquash that orphaned the changelog SHA it had just
      # re-pointed, a guard that matched nothing and passed every run, and a
      # signature check that rejected commits GitHub called valid.
      - name: Normalise the agent's commits and fold in fixups
        if: steps.agent.outcome == 'success'
        env:
          BOT_NAME: ${{ vars.BOT_GIT_NAME }}
        run: .github/scripts/claude-normalise.sh "origin/$BASE_REF" "${{ steps.before.outputs.sha }}"

      - name: Check what the agent changed
        if: steps.agent.outcome == 'success'
        env:
          BEFORE_TREE: ${{ steps.before.outputs.tree }}
        run: |
          set -euo pipefail
          # Content, not commits, and not authorship. Diffing the pre-agent TREE
          # against HEAD names exactly the files the agent changed: no identity
          # can fool it, and it survives the rebase that rewrites every commit.
          # The version that filtered a commit range by author is why this rule
          # was inert in production -- the agent commits as claude[bot], never the
          # configured identity, so the filter matched nothing.
          if git diff --name-only "$BEFORE_TREE" HEAD              | .github/scripts/claude-guard.sh "$VERB" > "$RUNNER_TEMP/guard.txt" 2>&1; then
            cat "$RUNNER_TEMP/guard.txt"
          else
            cp "$RUNNER_TEMP/guard.txt" "$RUNNER_TEMP/guard-failure.md"
            cat "$RUNNER_TEMP/guard-failure.md"
            exit 1
          fi

      # Also on the skip path: the rebase above runs before the agent, so a run
      # that bought no review can still have rewritten -- and re-signed -- every
      # commit on the branch.
      - name: Check the bot's own commits are signed before pushing
        if: >-
          (steps.agent.outcome == 'success' || steps.context.outputs.skip == 'true')
          && env.IS_FORK == 'false'
        run: |
          set -euo pipefail
          git log --format='%H%x09%G?%x09%cn' "origin/$BASE_REF..HEAD"             | .github/scripts/claude-signature.sh "${{ vars.BOT_GIT_NAME }}"

      # Same reason as the signature check: a skipped review does not mean an
      # unchanged branch. The step itself no-ops when HEAD has not moved.
      - name: Push the repaired branch
        id: push
        if: >-
          (steps.agent.outcome == 'success' || steps.context.outputs.skip == 'true')
          && env.IS_FORK == 'false'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          STARTED_AT: ${{ needs.preflight.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$STARTED_AT" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Branch unchanged; nothing to push."
            exit 0
          fi
          # Lease against the SHA the pull request had when this run started: if
          # someone pushed while the agent worked, this refuses rather than
          # discarding their commit.
          git push --force-with-lease="refs/heads/$HEAD_REF:$STARTED_AT" \
            "https://x-access-token:$TOKEN@github.com/$REPO.git" \
            "HEAD:refs/heads/$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed $(git rev-parse HEAD) to $HEAD_REF"

      # Posted with the App token so that, when the next step carries
      # `/fast-forward`, the gatekeeper actually wakes up. GITHUB_TOKEN comments
      # trigger nothing.
      - name: Post the review
        id: review
        if: always() && needs.preflight.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AGENT: ${{ steps.agent.outcome }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          CONFLICT: ${{ steps.rebase.outputs.conflict }}
          PROGRESS_ID: ${{ steps.progress.outputs.comment_id }}
          SKIPPED: ${{ steps.context.outputs.skip }}
          PREV_VERDICT: ${{ steps.context.outputs.previous_verdict }}
          DELTA: ${{ steps.before.outputs.delta }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"

          # Every path out of this step goes through here, so the run leaves ONE
          # comment: the "review has started" notice above, rewritten in place
          # with the findings. Two comments per attempt would be six on an
          # exhausted chain, and the notice would outlive its own answer.
          #
          # Create is the fallback, never the failure. If the notice was never
          # posted, or was deleted, or the PATCH is refused, the review text is
          # still the payload -- losing it to save a comment would be the wrong
          # trade in every direction.
          publish() {
            if [ -n "${PROGRESS_ID:-}" ] \
               && gh api --method PATCH "repos/$REPO/issues/comments/$PROGRESS_ID" \
                    -F body=@"$1" --jq .html_url; then
              return 0
            fi
            if [ -n "${PROGRESS_ID:-}" ]; then
              echo "::warning::Could not edit comment $PROGRESS_ID; posting the review as a new comment."
            fi
            gh pr comment "$PR" --repo "$REPO" --body-file "$1"
          }

          # The change has not moved since it was judged, so no review was bought.
          # Carry the previous verdict forward and say plainly that nothing was
          # re-examined -- reporting a stale verdict as if it were fresh would be
          # the dishonest way to save $4.
          if [ "$SKIPPED" = "true" ]; then
            verdict="${PREV_VERDICT:-HOLD}"
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            {
              echo "Nothing about this change has moved since the last review, so it was not reviewed again."
              echo
              if [ "$verdict" = "LAND" ]; then
                echo "That review found nothing blocking, so the fast-forward is requested again below."
              else
                echo "That review is still holding — see it above. Push a change, or land it yourself with \`/fast-forward\`."
              fi
              printf '\n%s\n' "<sub>[run]($RUN_URL) · reused the previous verdict · no gateway cost</sub>"
              printf '%s\n' "<!-- claude-reviewed delta=$DELTA verdict=$verdict -->"
            } > "$body"
            publish "$body"
            exit 0
          fi

          if [ "$AGENT" != "success" ]; then
            echo "verdict=HOLD" >> "$GITHUB_OUTPUT"
            printf '%s\n' "The review run failed before it produced a verdict. See [the run log]($RUN_URL)." > "$body"
            publish "$body"
            exit 0
          fi

          if [ -s "$RUNNER_TEMP/review.md" ]; then
            cp "$RUNNER_TEMP/review.md" "$body"
          else
            printf '%s\n' "_The agent produced no review file._" > "$body"
          fi

          verdict=$(head -1 "$RUNNER_TEMP/verdict.txt" 2>/dev/null | tr -d '[:space:]' || true)
          case "$verdict" in
            LAND | HOLD) ;;
            *)
              # Fail closed. An unreadable verdict must never read as approval.
              echo "::warning::Verdict was '$verdict', neither LAND nor HOLD. Treating as HOLD."
              verdict=HOLD
              ;;
          esac
          # A blocked run cannot read as approval whatever the model concluded.
          if [ -s "$RUNNER_TEMP/guard-failure.md" ]; then verdict=HOLD; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "---"
            echo
            if [ -s "$RUNNER_TEMP/guard-failure.md" ]; then
              # Otherwise the author sees a red cross and a review that reads as
              # if it had passed, with nothing saying why nothing happened.
              cat "$RUNNER_TEMP/guard-failure.md"
            elif [ "$verdict" = "LAND" ]; then
              echo "**Nothing blocking.** Requesting the fast-forward below."
            else
              echo "**Holding.** Something above needs a decision before this can land."
              echo
              echo "Reply \`@claude fix\` to have the findings implemented, or land it yourself with \`/fast-forward\`."
            fi
            if [ "$CONFLICT" = "true" ]; then
              echo
              echo "The rebase onto \`$BASE_REF\` conflicts, and this bot does not guess at conflict resolutions. Rebase it by hand."
            elif [ "$PUSHED" = "true" ]; then
              echo
              echo "The branch was rebased and force-pushed, and any \`changelog.json\` entry the rebase orphaned was re-pointed."
            fi
            if [ "$IS_FORK" = "true" ]; then
              echo
              echo "This branch is from a fork, so nothing was repaired automatically — a fork's branch cannot be pushed from here."
            fi
            printf '\n%s\n' "<sub>[review run]($RUN_URL) · attempt $ATTEMPT of $MAX_ATTEMPTS</sub>"
          } >> "$body"

          publish "$body"

      # A separate comment, and it must stay one: fast-forward.yml requires
      # `/fast-forward` at the very START of a body, so it cannot be folded into
      # the edited review comment above -- and the review has to come first.
      - name: Request the fast-forward
        # `steps.push.outcome == 'success'` is load-bearing, not belt-and-braces.
        # The review step runs under always(), so without it a run whose verb
        # guard or signature check FAILED would still reach here with a LAND
        # verdict and ask for a fast-forward of a branch this run refused to push.
        if: >-
          always() && steps.review.outputs.verdict == 'LAND' &&
          steps.push.outcome == 'success' &&
          env.IS_FORK == 'false' && steps.rebase.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/ff.md"
          {
            echo "/fast-forward"
            echo
            echo "Requested by the review above."
            echo
            # Counted by the next run to bound the chain: one marker per attempt.
            # The number is carried too, because the count can lag -- see the
            # budget note in the preflight gate.
            echo "<!-- claude-land chain=$CHAIN attempt=$ATTEMPT -->"
          } > "$body"
          gh pr comment "$PR" --repo "$REPO" --body-file "$body"

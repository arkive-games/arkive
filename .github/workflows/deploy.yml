# Builds the EdgeOne-hosted apps here and uploads each dist with the EdgeOne
# CLI, replacing the platform's own Git-triggered build.
#
# Why not let EdgeOne build: its build settings live in a console nobody reviews,
# so the values drift silently — VITE_API_BASE_URL pointed at the aion2 SITE
# rather than the API until 591daff7 caught it. Building here puts the recipe in
# review, and a direct-upload project consumes none of EdgeOne's 500 builds/month.
# This repo is public, so standard-runner minutes are free: neither meter is
# charged.
#
# The cost is that the target projects must be of the "direct upload" type. The
# CLI refuses to deploy into a Git-connected project and the two types cannot be
# converted, so each project here was recreated rather than reconfigured.

name: Deploy to EdgeOne Pages

on:
  push:
    branches: [master]
    # Nothing outside the frontend can change what gets uploaded, so a tools/ or
    # docs/ commit must not redeploy every production site.
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Unlike the retired GitHub Pages workflow this pushes no branch and needs no
# write scope anywhere.
permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      # Separate sites on separate domains deserve separate fates: one app's
      # broken build must not hold back the others.
      fail-fast: false
      matrix:
        app: [meta, aion2, palworld, vrising, ro3, gmzz]
        include:
          # `project` is the EdgeOne project name. It is spelled out here rather
          # than derived from `app` because `deploy -n` CREATES a project when the
          # name is free — a typo would silently publish to a new empty project
          # instead of failing.
          #
          # `domain` arms the post-deploy check: the host whose live build must
          # match the one just made. Every app now has one, because every
          # `<app>.arkive.games` host is bound to the project this workflow deploys
          # (scripts/edgeone_domains.py, docs/edgeone-custom-domains.md). The old
          # `*.tc-imba.com` hosts are bound to static redirect projects instead.
          #
          # `data_base_url` / `resource_base_url` are the ONLY build-time values
          # these apps still need. Everything else resolves from an in-code
          # production default: the API from packages/auth/src/config.ts, the home
          # link from packages/map-shell/src/arkiveHome.ts, the footer from
          # packages/ui/src/site-footer.tsx, the sibling-site links from
          # apps/meta/src/sites.ts.
          - app: meta
            project: arkive-meta
            domain: arkive.games
            smoke_path: /
          - app: aion2
            project: arkive-aion2
            domain: aion2.arkive.games
            smoke_path: /wiki
            data_base_url: https://data-aion2.arkive.games
            resource_base_url: https://resource-aion2.arkive.games
          - app: palworld
            project: arkive-palworld
            domain: palworld.arkive.games
            smoke_path: /breeding
            data_base_url: https://data-palworld.arkive.games
            resource_base_url: https://resource-palworld.arkive.games
          - app: vrising
            project: arkive-vrising
            domain: vrising.arkive.games
            smoke_path: /changelog
            data_base_url: https://data-vrising.arkive.games
            resource_base_url: https://resource-vrising.arkive.games
          # /changelog is the app's only non-root route, which makes it the only
          # path that can prove edgeone.json travelled with the upload.
          - app: ro3
            project: arkive-ro3
            domain: ro3.arkive.games
            smoke_path: /changelog
            data_base_url: https://data-ro3.arkive.games
            resource_base_url: https://resource-ro3.arkive.games
          # Every gmzz route is a real page rather than a redirect, so any of
          # them proves edgeone.json travelled; /changelog is used for the same
          # reason as vrising's and ro3's, being the route least likely to move.
          - app: gmzz
            project: arkive-gmzz
            domain: gmzz.arkive.games
            smoke_path: /changelog
            data_base_url: https://data-gmzz.arkive.games
            resource_base_url: https://resource-gmzz.arkive.games

    # Two pushes in quick succession must not race the same project. Queue rather
    # than cancel: an interrupted upload is a half-published site.
    concurrency:
      group: edgeone-${{ matrix.app }}
      cancel-in-progress: false

    name: ${{ matrix.app }}

    steps:
      - name: Checkout
        # vite.config.ts stamps the build commit via `git rev-parse HEAD` at
        # config-load time, so this needs a real checkout rather than a tarball.
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Read the version from "packageManager" in the manifest rather than
          # pinning it here, so CI cannot drift from local installs.
          package_json_file: frontend/package.json

      - name: Setup Node
        # Must follow the pnpm setup: `cache: pnpm` shells out to pnpm to locate
        # the store.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check this app's build variables are present
        # An absent matrix key renders as "", and the apps resolve these with `??`
        # rather than truthiness (apps/palworld/src/lib/urls.ts). So an empty value
        # does not fall back to the production host — it makes every data fetch
        # relative to the site's own origin, and the build still SUCCEEDS. Fail
        # here, where it is visible, instead of shipping a site whose data 404s.
        if: matrix.app != 'meta'
        env:
          DATA_BASE_URL: ${{ matrix.data_base_url }}
          RESOURCE_BASE_URL: ${{ matrix.resource_base_url }}
        run: |
          [ -n "$DATA_BASE_URL" ] || { echo "::error::data_base_url is empty for ${{ matrix.app }}"; exit 1; }
          [ -n "$RESOURCE_BASE_URL" ] || { echo "::error::resource_base_url is empty for ${{ matrix.app }}"; exit 1; }

      - name: Build
        working-directory: frontend
        env:
          # Public URLs, so they live in the workflow rather than in repository
          # secrets: a value nobody can read during review is a value nobody
          # notices going stale.
          #
          # VITE_PUBLIC_BASE is deliberately unset. The retired Pages workflow set
          # it to /aion2-interactive-map/; EdgeOne serves each app at its domain
          # root. VITE_TOY is likewise unset — it switches the apps to the hash
          # routing the Bilibili Toy build needs.
          VITE_DATA_BASE_URL: ${{ matrix.data_base_url }}
          VITE_RESOURCE_BASE_URL: ${{ matrix.resource_base_url }}
        run: pnpm --filter ${{ matrix.app }} build

      - name: Add the EdgeOne host config to the upload
        # EdgeOne reads edgeone.json from the ROOT of the uploaded directory, so it
        # has to be copied in beside index.html. It is kept in the app directory
        # rather than apps/<app>/public/ because Vite copies publicDir into every
        # build — including the separate dist-toy build, whose packer deliberately
        # excludes this filename as host config rather than content
        # (frontend/scripts/toy-build.mjs).
        #
        # Meta owns the cross-site font headers; game apps own their router
        # rewrites. A missing game config surfaces as a failed deep-link check.
        working-directory: frontend
        run: |
          src="apps/${{ matrix.app }}/edgeone.json"
          if [ -f "$src" ]; then
            cp "$src" "apps/${{ matrix.app }}/dist/edgeone.json"
            echo "included $src"
          else
            echo "no $src — ${{ matrix.app }} needs no host rules"
          fi

      - name: Prerender the sitemap pages
        # Crawlers that run no JavaScript (Baidu, mostly) read an empty #root
        # otherwise. Snapshots every sitemap page into dist and rewrites the
        # copied edgeone.json to serve them, so it must follow the copy step
        # (frontend/scripts/prerender.mjs).
        #
        # Never blocks the deploy: a failure leaves dist exactly as built, which
        # is the site as it was before this step existed. Pages that could not
        # be snapshotted surface as warnings on the run.
        continue-on-error: true
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          node scripts/prerender.mjs --app ${{ matrix.app }}

      # Run through `pnpm dlx`, never through npm. npm's arborist dies with
      # "Cannot read properties of null (reading 'edgesOut')" before the CLI is
      # ever downloaded, and it has now done so from both directions: `npx`
      # inside frontend/ (2026-09-06 to 2026-09-13, resolving against the tree
      # pnpm builds) and then `npm install --global` from the repository root
      # (2026-10-16 to 2026-10-22, once the runner image's npm moved on). Both
      # outages had a green CI the whole time, because CI never deploys. pnpm
      # is already set up for the build, and `dlx` resolves the package in its
      # own store rather than against any project tree, so there is no tree for
      # arborist to choke on and no second package manager in the deploy path.
      #
      # Still pinned: an unpinned CLI is a floating dependency sitting in the
      # deploy path of every production site.
      - name: Deploy to EdgeOne Pages
        working-directory: frontend
        env:
          # The only secret this workflow needs.
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: >
          pnpm dlx edgeone@1.6.21 makers deploy apps/${{ matrix.app }}/dist
          -n ${{ matrix.project }}
          -t "$EDGEONE_API_TOKEN"
          -e production

      - name: Verify the live site serves this build
        # Requests a DEEP LINK, which has no file behind it, and compares the entry
        # bundle the live site returns against the one just built. That single
        # check proves three things: the upload landed, edgeone.json travelled with
        # it (otherwise the deep link 404s), and the deployed build is this one.
        #
        # The smoke path is a sitemap page, so once prerendered it has a file of
        # its own and would pass whichever rule served it; EdgeOne serves that
        # file even with a query string appended. So when it was prerendered,
        # its live #root must carry the snapshot, and the deep-link proof moves
        # to a URL no file can answer: the first wildcard rule's prefix plus
        # `deploy-check`, which must come back as the empty shell.
        #
        # Inert until `domain` is filled in for the app, which happens once it has
        # actually been cut over to its direct-upload project.
        if: matrix.domain != ''
        working-directory: frontend
        run: |
          entry_of() {
            sed -n 's/.*<script[^>]*type="module"[^>]*src="\([^"]*\)".*/\1/p' | head -1
          }
          dist="apps/${{ matrix.app }}/dist"
          built=$(entry_of < "$dist/index.html")
          [ -n "$built" ] || { echo "::error::no module entry in the built index.html"; exit 1; }
          echo "built entry: $built"

          smoke="${{ matrix.smoke_path }}"
          if [ "$smoke" = "/" ]; then snapshot="$dist/app-shell.html"; else snapshot="$dist${smoke%/}/index.html"; fi
          if [ -f "$snapshot" ]; then prerendered=1; echo "$smoke was prerendered"; else prerendered=""; fi

          empty_root() { grep -q '<div id="root"[^>]*></div>'; }
          url="https://${{ matrix.domain }}$smoke"
          shell_path=""
          if [ -f "$dist/edgeone.json" ]; then
            shell_path=$(node -e '
              const rules = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).rewrites ?? []
              const rule = rules.find((r) => r.source.endsWith("*"))
              if (rule) console.log(rule.source.slice(0, -1) + "deploy-check")
            ' "$dist/edgeone.json")
          fi
          shell_url="${shell_path:+https://${{ matrix.domain }}$shell_path}"
          for attempt in 1 2 3 4 5 6; do
            ok=yes
            page=$(curl -fsS --max-time 20 "$url") || page=""
            live=$(printf '%s' "$page" | entry_of)
            [ "$live" = "$built" ] || ok=""
            if [ -n "$prerendered" ] && printf '%s' "$page" | empty_root; then ok=""; live="$live (empty #root)"; fi
            shell_live="<not checked>"
            if [ -n "$shell_url" ]; then
              shell_page=$(curl -fsS --max-time 20 "$shell_url") || shell_page=""
              shell_live=$(printf '%s' "$shell_page" | entry_of)
              [ "$shell_live" = "$built" ] || ok=""
              if ! printf '%s' "$shell_page" | empty_root; then ok=""; shell_live="$shell_live (not the shell)"; fi
            fi
            if [ -n "$ok" ]; then
              echo "$url serves $built${prerendered:+ prerendered}; ${shell_url:-no wildcard rule} ${shell_url:+serves the shell}"
              exit 0
            fi
            echo "attempt $attempt: live=${live:-<none>} shell=${shell_live:-<none>} expected=$built — waiting for propagation"
            sleep 20
          done
          echo "::error::$url or ${shell_url:-the shell} does not serve this build as expected"
          exit 1

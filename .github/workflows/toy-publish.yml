# Builds an app's Bilibili Toy bundle and pushes it to an EXISTING toy.
#
# Deliberately manual-only. The other workflow deploys on every push to master
# because EdgeOne is our own hosting; this one publishes to a third-party platform
# that puts every submission through human review, so firing it automatically
# would queue reviews nobody asked for.
#
# `toy` has no --token flag and its help lists only --json, which reads as
# "unautomatable". It is not: the binary honours TOY_CLI_SESSION_TOKEN (verified
# against the shipped binary, v0.3.2, by removing ~/.toy/session.json and watching
# `toy mylist` fail without the variable and succeed with it). The session file is
# just {session_token, uid} with no expiry field, so the secret is the 64-char
# session_token copied out of a local `toy login`.
#
# It DOES expire server-side. When this workflow starts failing with
# "登录态已失效" or "尚未登录", the fix is a local `toy login` followed by
# refreshing the secret -- not a change here.
#
# Secrets:
#   TOY_CLI_SESSION_TOKEN  session_token from ~/.toy/session.json (all apps)
#   ARTIFACTS_TOKEN        read access to the private data-/resource- repos,
#                          needed by palworld only (see "bundle vs fetch" below)

name: Publish Bilibili toy

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which toy to publish"
        type: choice
        default: all
        # Only these three have a toy.config.json and an already-published slug.
        # sts2/vrising/lostark are absent on purpose: publishing them would mint a
        # NEW toy, and a slug can never be changed afterwards.
        options: [all, meta, aion2, palworld]
      submit:
        description: "Submit for review (leave off to only upload and get a preview)"
        type: boolean
        default: false

# Read-only: this pushes no branch and needs no write scope.
permissions:
  contents: read

jobs:
  toy:
    runs-on: ubuntu-latest

    strategy:
      # One toy's failure must not cancel the others' uploads.
      fail-fast: false
      matrix:
        # Kept on one line on purpose: a folded block scalar with more-indented
        # continuations preserves the newlines, which corrupts the expression.
        app: ${{ fromJSON(inputs.app == 'all' && '["meta","aion2","palworld"]' || format('["{0}"]', inputs.app)) }}

    # Never let two runs upload to the same toy at once. `cancel-in-progress:
    # false` lets a running upload finish; GitHub still keeps only one job queued
    # behind it, which is fine because a queued job has uploaded nothing yet.
    concurrency:
      group: toy-${{ matrix.app }}
      cancel-in-progress: false

    name: ${{ matrix.app }}${{ inputs.submit && ' (submit)' || ' (preview)' }}

    steps:
      # Submitting three toys for human review from one click is exactly what the
      # header says this workflow exists to avoid, so make the operator name one.
      - name: Refuse a bulk submission
        if: inputs.submit && inputs.app == 'all'
        run: |
          echo "::error::Pick a single app when submitting for review. Each submission is reviewed by a person; 'all' is for previews."
          exit 1

      - name: Checkout
        # vite.config.ts stamps the build commit via `git rev-parse HEAD` at
        # config-load time, so this needs a real checkout, not a tarball.
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Read the version from "packageManager" rather than pinning it here, so
          # CI cannot drift from local installs.
          package_json_file: frontend/package.json

      - name: Setup Node
        # Must follow the pnpm setup: `cache: pnpm` shells out to pnpm for the store.
        # Also must precede every `node` call below, so they run on the pinned 22
        # rather than whatever the runner image ships.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Read toy config
        id: cfg
        working-directory: frontend
        run: |
          set -euo pipefail
          # loadToyConfig validates slug/title/visibility; parsing the JSON here by
          # hand would skip that and let a malformed slug reach a write command.
          read -r slug bundles < <(node -e '
            import("./scripts/toy-lib.mjs").then(({ loadToyConfig, bundlesArtifacts }) => {
              const cfg = loadToyConfig(`apps/${process.argv[1]}`)
              process.stdout.write(`${cfg.slug} ${bundlesArtifacts(cfg)}`)
            }).catch((e) => { console.error(e.message); process.exit(1) })
          ' '${{ matrix.app }}')
          # Delimited, so a value containing a newline cannot forge other outputs.
          { echo "slug<<EOF"; echo "$slug"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "bundles=$bundles" >> "$GITHUB_OUTPUT"
          echo "Resolved slug=$slug, bundles artifacts=$bundles"

      # Checked before the two checkouts below rather than letting them fail: with
      # no token they die inside actions/checkout on a generic git auth error that
      # says nothing about which secret is missing or why this app needs one.
      - name: Check artifact access is configured
        if: steps.cfg.outputs.bundles == 'true'
        env:
          ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACTS_TOKEN:-}" ]; then
            echo "::error::ARTIFACTS_TOKEN is required for ${{ matrix.app }} because its bundle embeds the private artifact repos. Add a fine-grained PAT with Contents:Read on arkive-games/data-${{ matrix.app }} and arkive-games/resource-${{ matrix.app }}. (meta and aion2 need no such token.)"
            exit 1
          fi

      # palworld embeds ~80 MB of derived data and images that live in two private
      # repos outside this monorepo. toy-build resolves them from sibling
      # directories, which the TOY_*_DIR overrides below point at explicitly.
      - name: Checkout data artifacts
        if: steps.cfg.outputs.bundles == 'true'
        uses: actions/checkout@v4
        with:
          repository: arkive-games/data-${{ matrix.app }}
          token: ${{ secrets.ARTIFACTS_TOKEN }}
          path: artifacts/data
      - name: Checkout resource artifacts
        if: steps.cfg.outputs.bundles == 'true'
        uses: actions/checkout@v4
        with:
          repository: arkive-games/resource-${{ matrix.app }}
          token: ${{ secrets.ARTIFACTS_TOKEN }}
          path: artifacts/resource

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install toy CLI
        env:
          # Pinned rather than floating: this CLI gates a public submission, so a
          # new release should be adopted deliberately, not silently mid-run.
          TOY_VERSION: v0.3.2
        run: |
          set -euo pipefail
          # The published install.sh is fetched from an unversioned path and would
          # run unreviewed in a job that goes on to hold two secrets. It only
          # downloads a binary and checks its digest, so do exactly that instead.
          base="https://boss.hdslb.com/toy-cli/toy/releases/${TOY_VERSION}"
          dir="${RUNNER_TEMP}/toy-bin"
          mkdir -p "$dir"
          curl -fsSL "$base/toy_linux_amd64" -o "$dir/toy"
          curl -fsSL "$base/toy_linux_amd64.sha256" -o "$dir/toy.sha256"
          # The published digest file names the release artifact, not our filename.
          expected=$(tr -d '\r\n' < "$dir/toy.sha256" | awk '{print $1}')
          actual=$(sha256sum "$dir/toy" | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "::error::toy ${TOY_VERSION} checksum mismatch (expected $expected, got $actual)"
            exit 1
          fi
          chmod +x "$dir/toy"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Verify session and resolve the toy id
        id: toy
        env:
          TOY_CLI_SESSION_TOKEN: ${{ secrets.TOY_CLI_SESSION_TOKEN }}
          TOY_NO_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          if [ -z "${TOY_CLI_SESSION_TOKEN:-}" ]; then
            echo "::error::TOY_CLI_SESSION_TOKEN is empty. Run \`toy login\` locally and copy session_token from ~/.toy/session.json."
            exit 1
          fi
          # Resolving the id from the live list keeps ids out of the repo, where
          # they would drift. --size beats the default 20: the resolver refuses a
          # truncated page rather than reporting a present toy as missing. A miss
          # is fatal by design -- see toy-resolve-id.mjs.
          id=$(toy mylist --json --size 100 | node frontend/scripts/toy-resolve-id.mjs "${{ steps.cfg.outputs.slug }}")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Publishing to toy id=$id (slug=${{ steps.cfg.outputs.slug }})"

      - name: Build the toy bundle
        env:
          # Explicit overrides beat toy-build's ancestor-directory search, which
          # would not find these under the runner's layout.
          TOY_DATA_DIR: ${{ steps.cfg.outputs.bundles == 'true' && format('{0}/artifacts/data', github.workspace) || '' }}
          TOY_RES_DIR: ${{ steps.cfg.outputs.bundles == 'true' && format('{0}/artifacts/resource', github.workspace) || '' }}
        working-directory: frontend
        run: pnpm toy:build --app ${{ matrix.app }}

      # ONE upload, whichever mode. Uploading for a preview and then again with
      # --yes would send palworld's ~80 MB twice, doubling the exposure to the
      # platform's size and file-count limits -- and it would collapse the
      # preview-then-confirm gate into a single click. `submit` off is the preview
      # run; a person looks at the URL, then dispatches again with it on.
      #
      # No --poster: it means "new cover", and scripts/toy-publish.mjs already
      # settled that the poster is a create-time argument only. All three toys are
      # published with a cover already, and sending one here would overwrite a
      # cover changed in the console -- even on a preview-only run.
      - name: ${{ inputs.submit && 'Submit for review' || 'Upload and get a preview' }}
        env:
          TOY_CLI_SESSION_TOKEN: ${{ secrets.TOY_CLI_SESSION_TOKEN }}
          TOY_NO_UPDATE_CHECK: "1"
          SUBMIT: ${{ inputs.submit }}
        working-directory: frontend
        run: |
          set -euo pipefail
          args=(update '${{ steps.toy.outputs.id }}' "apps/${{ matrix.app }}/dist-toy" --json)
          [ "$SUBMIT" = "true" ] && args+=(--yes)
          out=$(toy "${args[@]}")
          echo "$out"
          # Parse for the summary only, and never fail on it: by the time the CLI
          # has answered, the upload (and the submission, with --yes) has already
          # happened server-side. Failing here would report a successful publish as
          # a failed run.
          node -e '
            let s = ""
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              let d = {}
              try { const j = JSON.parse(s); d = j.data ?? j } catch { /* not JSON */ }
              const lines = ["### ${{ matrix.app }} → ${{ steps.cfg.outputs.slug }}", ""]
              if (d.preview_url) lines.push(`Preview: ${d.preview_url}`)
              if (d.id || d.status) lines.push(`Submitted: id=${d.id ?? "?"} status=${d.status ?? "?"}`)
              if (lines.length === 2) lines.push("(the CLI returned no preview_url or status — see the step log)")
              console.log(lines.join("\n"))
            })
          ' <<<"$out" >> "$GITHUB_STEP_SUMMARY" || true

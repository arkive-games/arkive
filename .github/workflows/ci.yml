# Builds and checks every commit that lands on master and every pull request.
#
# Until now this repo had NO pull-request CI at all: the two other workflows are a
# post-merge deploy and a manual toy publish, so `pnpm test`, `eslint` and
# `tsc -b` only ever ran on someone's machine. A pull request could be landed
# green-looking without any of them having been run.
#
# Deploying stays separate and stays narrow. This workflow runs for every commit;
# deploy.yml keeps its `paths: [frontend/**]` filter, so a tools/, docs/ or
# backend commit is built and checked here without redeploying four production
# sites. Building is cheap and public-repo runner minutes are unmetered; a deploy
# is neither.
#
# What is deliberately NOT here:
#
#   e2e (`pnpm e2e:<app>`) -- the Playwright suites fetch the derived `data/` and
#   `resource/` artifacts over HTTP and drive a dev server against them. Those two
#   repos are private and are not checked out here (only toy-publish.yml pulls
#   them), so the suites would fail on missing fixtures rather than on real
#   regressions. Several also have known failures unrelated to CI.
#
#   `pnpm validate-data` -- same reason: it validates the artifact repos, which
#   are not present.
#
#   the tools/ pytest suite -- it aborts during collection today
#   (apps/palworld/tests/test_encyclopedia.py and apps/sts2/tests/... share a
#   basename, so pytest refuses to import the second and stops), which means zero
#   tools tests run. Fixing that changes test-collection semantics for the whole
#   package and belongs in its own change, not in the commit that adds CI.

name: CI

on:
  push:
    branches: [master]
  # No branch filter: a branch push with an open PR arrives here as
  # `synchronize`, so this covers feature branches without double-running them.
  pull_request:

# Nothing here needs a token beyond reading the repository.
permissions:
  contents: read

# Opposite choice to deploy.yml and toy-publish.yml, on purpose: those queue
# because a half-finished upload is worse than a late one. A build of a commit
# that has already been superseded tells nobody anything, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The review bot's logic lives in .github/scripts/*.sh rather than inside
  # workflow `run:` blocks, precisely so it can be tested. Four of the five
  # defects it shipped with were shell bugs that YAML parsing, eslint and every
  # other check here were structurally incapable of catching -- they were found by
  # running the bot in production and reading the logs. This job is the answer to
  # that. It needs no toolchain, so it costs seconds.
  scripts:
    runs-on: ubuntu-latest
    name: workflow-scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test the workflow scripts
        run: .github/scripts/tests/run.sh

  frontend:
    runs-on: ubuntu-latest
    name: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changelog:verify walks history to prove every pinned release SHA is
          # still reachable; a shallow clone fails it for the wrong reason.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Read the version from "packageManager" rather than pinning it here, so
          # CI cannot drift from local installs.
          package_json_file: frontend/package.json

      - name: Setup Node
        # Must follow the pnpm setup: `cache: pnpm` shells out to pnpm for the store.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run the unit suite
        working-directory: frontend
        run: pnpm test

      # The repo's own invariants, each a one-line script in package.json. They
      # are greps and a history walk, so they cost seconds and catch the classes
      # of mistake review keeps missing: an app-only import creeping into a shared
      # package, an unregistered persistence key, a release entry whose commit a
      # rebase rewrote.
      #
      # `continue-on-error` on this and the three steps after it, with one gate at
      # the end: these four are independent, and failing here used to abort the
      # job before lint and build ever ran. A stale memory-keys.txt would hide
      # every type error on a branch, so a contributor fixed one line, pushed, and
      # only then discovered the real breakage. One run now reports all four.
      - name: Check the repo invariants
        id: invariants
        continue-on-error: true
        working-directory: frontend
        run: |
          set -euo pipefail
          failed=""
          for s in check:engine check:engine-gl check:shell check:api-drift memory:keys:check changelog:verify; do
            echo "--- $s"
            pnpm --silent "$s" || failed="$failed $s"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed invariant check(s):$failed"
            exit 1
          fi

      # `tsc --noEmit` per package, which nothing else in this job reaches. The
      # per-app `build` typechecks an app's own program, and a package's source
      # enters it only by being imported -- so a package's *test* files are
      # typechecked by nobody, because nothing imports a test, and vitest
      # transpiles without checking types. A type error in any
      # `packages/**/*.test.ts` used to land green.
      - name: Typecheck every package
        id: packages
        continue-on-error: true
        working-directory: frontend
        # Filtered to packages: the step is named for them, and an app defining a
        # `check` later would otherwise duplicate what the build step already does.
        run: pnpm --filter "./packages/*" check

      # Every app, not only the four that deploy: sts2 and lostark are built and
      # linted here because they exist in the workspace, and a break in a shared
      # package shows up in whichever app imports it first.
      - name: Lint every app
        id: lint
        continue-on-error: true
        working-directory: frontend
        run: |
          set -euo pipefail
          failed=""
          for app in meta aion2 palworld sts2 vrising lostark; do
            echo "--- lint $app"
            pnpm "lint:$app" || failed="$failed $app"
          done
          if [ -n "$failed" ]; then
            echo "::error::eslint failed for:$failed"
            exit 1
          fi

      # `build` is `tsc -b && vite build`, so this is the typecheck as well. It is
      # also what catches a stale apps/aion2/src/routeTree.gen.ts: the generated
      # route tree is committed, and adding a route without re-running
      # `pnpm --filter aion2 exec tsr generate` fails the build here.
      - name: Build every app
        id: build
        continue-on-error: true
        working-directory: frontend
        run: |
          set -euo pipefail
          for app in meta aion2 palworld sts2 vrising lostark; do
            echo "--- build $app"
            pnpm "build:$app"
          done

      # The gate. Every step above reports, then this fails the job once, naming
      # everything that broke -- so a red run is a complete list rather than the
      # first thing that happened to run.
      - name: Frontend checks passed
        if: always()
        run: |
          set -euo pipefail
          failed=""
          # if/then rather than `[ ... ] && var=`: under `set -e` a false test in
          # an AND-list is the kind of thing that differs between shells, and this
          # step is the one that decides whether the job is red.
          if [ "${{ steps.invariants.outcome }}" = "failure" ]; then failed="$failed repo-invariants"; fi
          if [ "${{ steps.packages.outcome }}" = "failure" ]; then failed="$failed package-typecheck"; fi
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then failed="$failed lint"; fi
          if [ "${{ steps.build.outcome }}" = "failure" ]; then failed="$failed build"; fi
          if [ -n "$failed" ]; then
            echo "::error::Frontend job failed:$failed"
            exit 1
          fi
          echo "invariants, package typecheck, lint and build all passed"

  go:
    runs-on: ubuntu-latest
    name: backend-go

    # Postgres is a service container; MinIO is started as a step instead.
    #
    # A service container takes no `command`, and the MinIO image needs `server
    # /data` to do anything, so declaring it here would start a container that
    # prints its own help and never becomes healthy.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # From go.mod, so the toolchain cannot drift from the module.
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Formatting
        working-directory: backend-go
        # Scoped to the two source trees rather than `.`, so a future vendored or
        # generated directory cannot start failing this.
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: backend-go
        run: go build ./...

      - name: Vet
        working-directory: backend-go
        run: go vet ./...

      # Avatars are served straight from the bucket to browsers, so the storage
      # round-trip test fetches its published URL anonymously. MinIO grants that
      # only with an explicit policy, and it creates no bucket on its own.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is live after ${i}s"
              break
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set ci http://127.0.0.1:9000 minioadmin minioadmin &&
            mc mb --ignore-existing ci/arkive-test &&
            mc anonymous set download ci/arkive-test
          "

      # The database-backed and object-storage tests read their DSN and endpoint
      # from the environment and t.Skipf when it is absent. Supplying both is the
      # point of the services above: a skipped test proves nothing, and every
      # guarantee that matters most here -- that a uid is never reissued, that a
      # superseded avatar is really deleted, that a stored object is anonymously
      # fetchable -- lives in exactly those tests.
      #
      # Tencent COS is deliberately not exercised. It would need a live credential
      # in repository secrets, and it shares this code path with MinIO; the one
      # behavioural difference between them is request addressing, which has unit
      # tests that need no credential.
      - name: Test
        working-directory: backend-go
        env:
          ARKIVE_TEST_POSTGRES_URL: postgres://postgres:pass@localhost:5432/postgres?sslmode=disable
          ARKIVE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ARKIVE_TEST_S3_BUCKET: arkive-test
          ARKIVE_TEST_S3_ACCESS_KEY_ID: minioadmin
          ARKIVE_TEST_S3_SECRET_ACCESS_KEY: minioadmin
          # The SDK forces path style for an IP endpoint regardless, but stating
          # it keeps the intent on the page.
          ARKIVE_TEST_S3_PATH_STYLE: "true"
        run: go test ./... -count=1

      # Everything above still passes if a rename or a container failure silently
      # turns the gated tests back into skips, which is the failure mode this job
      # exists to prevent. So assert they actually ran.
      - name: No gated test was silently skipped
        working-directory: backend-go
        env:
          ARKIVE_TEST_POSTGRES_URL: postgres://postgres:pass@localhost:5432/postgres?sslmode=disable
          ARKIVE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ARKIVE_TEST_S3_BUCKET: arkive-test
          ARKIVE_TEST_S3_ACCESS_KEY_ID: minioadmin
          ARKIVE_TEST_S3_SECRET_ACCESS_KEY: minioadmin
          ARKIVE_TEST_S3_PATH_STYLE: "true"
        run: |
          go test ./internal/core/ -v -count=1 > gated.log 2>&1 || { cat gated.log; exit 1; }
          skipped=$(grep -c '^--- SKIP' gated.log || true)
          passed=$(grep -c '^--- PASS' gated.log || true)
          echo "internal/core: $passed passed, $skipped skipped"
          if [ "$skipped" != "0" ]; then
            echo "a test skipped, so Postgres or MinIO was not reachable:"
            grep -B 2 '^--- SKIP' gated.log
            exit 1
          fi
          # A floor rather than an exact count, so adding tests never fails this
          # while a filter that stops matching everything still does.
          if [ "$passed" -lt 30 ]; then
            echo "only $passed tests ran in internal/core, which is far fewer than expected"
            exit 1
          fi

      # openapi/core.json is generated by asking the real router for it, and the
      # frontend's committed API client is generated from that same file. A route
      # added without regenerating would ship a document that lies about the API,
      # and nothing else would notice. The frontend job's `check:api-drift` closes
      # the other half: this step keeps the document true to the Go code, that one
      # keeps the TypeScript client true to the document.
      - name: Committed OpenAPI document matches the code
        working-directory: backend-go
        run: |
          go run ./cmd/arkive openapi
          if ! git diff --quiet -- openapi/; then
            echo "openapi/ is stale. Run: go run ./cmd/arkive openapi"
            git diff -- openapi/
            exit 1
          fi

      # sqlc models the schema from the migration files, so a migration or query
      # edited without regenerating leaves Go code compiled against a schema that
      # no longer exists.
      - name: Committed sqlc output matches the queries
        working-directory: backend-go
        run: |
          go tool sqlc generate
          if ! git diff --quiet -- internal/core/coredb/; then
            echo "internal/core/coredb/ is stale. Run: go tool sqlc generate"
            git diff -- internal/core/coredb/
            exit 1
          fi

# Production stack for the Go backend.
#
# Deliberately does NOT define a database. The host already runs PostgreSQL for
# the Python service, holding the accounts this service inherits; standing up a
# second instance would mean two copies of the same users diverging. This joins
# that instance's network instead and uses its own `arkive` database, so the two
# services share a server but never a schema.
#
# The API binds to loopback only. nginx terminates TLS for
# api-arkive.tc-imba.com and proxies to it; publishing the port on 0.0.0.0 would
# expose an untrusted plaintext endpoint alongside it.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

name: arkive-backend

services:
  core:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: arkive/backend-go
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-19000}:9000"
    environment:
      DEBUG: "false"
      SERVER_PORT: 9000
      ARKIVE_MODULES: ${ARKIVE_MODULES:-}

      # `postgres` resolves on the shared network below; the credentials are the
      # existing instance's, and ARKIVE_DATABASE is a separate database on it.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:?set POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?set POSTGRES_DATABASE}
      POSTGRES_SSLMODE: disable

      # Startup refuses to continue if either is empty or a placeholder.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?set ALTCHA_HMAC_KEY}

      # Scoped to the parent domain so one sign-in covers the homepage and every
      # game subdomain.
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.tc-imba.com}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: lax

      # Counters and Altcha replay protection. Without these the service falls
      # back to in-process state, which is per-process and lost on restart.
      REDIS_ADDR: ${REDIS_ADDR:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      # Mail. An empty SMTP_HOST keeps the logging mailer rather than failing
      # every reset request.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Arkive}
      RESET_URL_TEMPLATE: ${RESET_URL_TEMPLATE:-}

      # Tencent SES API. Preferred over SMTP, which a personal-tier account
      # cannot use at all. The body lives in an approved template at Tencent.
      SES_SECRET_ID: ${SES_SECRET_ID:-}
      SES_SECRET_KEY: ${SES_SECRET_KEY:-}
      SES_REGION: ${SES_REGION:-ap-guangzhou}
      SES_FROM: ${SES_FROM:-}
      SES_FROM_NAME: ${SES_FROM_NAME:-}
      SES_RESET_TEMPLATE_ID: ${SES_RESET_TEMPLATE_ID:-0}

      FORGOT_PER_HOUR_PER_IP: ${FORGOT_PER_HOUR_PER_IP:-5}
      FORGOT_PER_HOUR_PER_EMAIL: ${FORGOT_PER_HOUR_PER_EMAIL:-3}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      ALLOW_CREDENTIALS: "true"
      # Lets a Bilibili Toy authenticate with a bearer token from an origin that
      # is not on the list, without ever being granted credentials.
      CORS_PUBLIC_FALLBACK: ${CORS_PUBLIC_FALLBACK:-true}

      # Object storage for avatars: Tencent COS here, MinIO in the development
      # stack. Startup refuses to continue without these outside DEBUG, on the
      # same reasoning as the secrets above — a deploy that silently cannot store
      # an avatar would fail only when a user tried to set one.
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT, e.g. https://cos.ap-guangzhou.myqcloud.com}
      S3_REGION: ${S3_REGION:?set S3_REGION, e.g. ap-guangzhou}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET, e.g. arkive-1250000000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID (COS SecretId)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY (COS SecretKey)}
      # COS addresses buckets as <bucket>.cos.<region>.myqcloud.com, so the
      # bucket must NOT travel in the path. MinIO is the opposite; getting this
      # wrong surfaces as a DNS or signature failure rather than a clear error.
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
      # Where browsers fetch avatars, which need not be the endpoint writes go
      # to. Avatars are user-supplied images, so prefer a host outside
      # tc-imba.com: the session cookie above is scoped to the parent domain,
      # and content served from any subdomain of it sits inside that scope.
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}

      AVATAR_UPLOADS_PER_MINUTE: ${AVATAR_UPLOADS_PER_MINUTE:-5}

    networks:
      - shared

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-aion2-interactive-map-backend_aion2-network}

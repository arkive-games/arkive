# Local development and debugging stack for the Go backend.
#
# Differences from the Python service's compose this replaces:
#   - no `core` Python image, no Celery worker, and no Redis. The Go service
#     uses none of them; an unused broker is not carried over for symmetry.
#   - the database is named `arkive`, not `aion2`, because the backend now
#     serves every game rather than one.
#   - data lives in a named volume instead of a ./data bind mount, which avoids
#     the ownership problems a bind mount causes on Windows hosts.
#
# The host ports are deliberately not the defaults: 9000 collides with MinIO on
# a typical dev box, so the API is published on 19000.
#
# DEBUG defaults to true here because this file is the local stack. In that mode
# the service fills in development secrets. Running it anywhere real means
# setting DEBUG=false plus JWT_SECRET_KEY and ALTCHA_HMAC_KEY — startup refuses
# to continue with an empty or placeholder secret.

name: arkive-backend

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-arkive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DATABASE:-arkive}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The service waits on this rather than on a fixed sleep, so migrations
      # never race the first-boot initdb.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-arkive} -d ${POSTGRES_DATABASE:-arkive}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      # 9000 is MinIO's own default and is left as-is here, because the S3
      # endpoint is what a developer pastes into tooling; the console moves to
      # 19001 to sit beside the API's 19000.
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO creates neither the bucket nor a public read policy on its own, and
  # avatars are served straight from the bucket to browsers, so both are set up
  # here. This container exits once done.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-arkive}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET &&
      echo 'bucket ready with anonymous download'
      "

  core:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: arkive/backend-go
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-19000}:9000"
    environment:
      DEBUG: ${DEBUG:-true}
      SERVER_PORT: 9000
      # Empty means every module compiled into the binary. Set one name per
      # process to split the service into per-game deployments.
      ARKIVE_MODULES: ${ARKIVE_MODULES:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-arkive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-arkive}
      POSTGRES_SSLMODE: disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # The API is reached over plain HTTP locally, so a Secure cookie would
      # never be stored by the browser.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # MinIO is reached by service name inside the compose network, but the URL
      # handed to a browser has to work from the host, which is why the write
      # endpoint and the public base are configured separately.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-arkive}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      # MinIO has no wildcard DNS beneath its host name, so the bucket must
      # travel in the path. Tencent COS is the opposite; see the S3 section of
      # the avatar design.
      S3_USE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/arkive}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:

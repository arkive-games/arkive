version: "2"
sql:
  - engine: postgresql
    # sqlc models the schema from the same migration files goose runs, so a
    # query referencing a column that does not exist fails the build rather
    # than a request.
    schema: internal/core/migrations
    queries: db/queries/core
    gen:
      go:
        package: coredb
        out: internal/core/coredb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        # The wire shapes are hand-written in the handler layer, so generated
        # structs carry no JSON tags and cannot leak a column rename into the
        # public API by accident.
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          # Without this a nullable uuid becomes pgtype.UUID, which would leak a
          # driver type into the service layer for every optional foreign key.
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
        # sqlc would title-case these to Uid/SpecialUid. UID is an initialism,
        # and Go spells initialisms in one case throughout an identifier.
        rename:
          uid: UID
          special_uid: SpecialUID
          set_special_uid: SetSpecialUID
          avatar_key: AvatarKey
          post_no: PostNo
          comment_no: CommentNo
          next_comment_no: NextCommentNo
          game_ids: GameIDs
          post_id: PostID
          parent_id: ParentID
          author_id: AuthorID

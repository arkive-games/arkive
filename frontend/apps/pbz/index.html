<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- Machine translation rewrites text nodes into <font> wrappers, which
         detaches the nodes React still holds; the next unmount then throws
         "Failed to execute 'removeChild' on 'Node'". These sites ship their
         own i18n, so opting out costs nothing they do not already provide. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>影之刃零攻略站 | 藏舟 Arkive</title>
    <meta name="description" content="藏舟（Arkive）影之刃零攻略资料站：直接从游戏文件提取的攻略与数据。" />
    <meta property="og:site_name" content="藏舟 Arkive" />
    <meta property="og:title" content="影之刃零攻略站 | 藏舟 Arkive" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- Machine translation rewrites text nodes into <font> wrappers, which
         detaches the nodes React still holds; the next unmount then throws
         "Failed to execute 'removeChild' on 'Node'". These sites ship their
         own i18n, so opting out costs nothing they do not already provide. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>藏舟 Arkive | 万千攻略，藏于一舟</title>
    <meta name="description" content="藏舟游戏攻略网：诡秘之主、永恒之塔2、幻兽帕鲁、V Rising、仙境传说3 的互动地图、资料库与计算工具，一站查齐。" />
    <meta property="og:site_name" content="藏舟 Arkive" />
    <meta property="og:title" content="藏舟 Arkive | 万千攻略，藏于一舟" />
    <meta property="og:description" content="Sail Games With Us. 诡秘之主、永恒之塔2、幻兽帕鲁、V Rising、仙境传说3 的互动地图、资料库与计算工具。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arkive.games/" />
    <link rel="canonical" href="https://arkive.games/" />
    <!-- Search console ownership proofs. Removing one unverifies the site. -->
    <meta name="baidu-site-verification" content="codeva-8DT7tLqTLq" />
    <!-- Tells search engines that 藏舟, Arkive and this domain are one site, so
         either name can surface it as a site-name result. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "藏舟",
        "alternateName": ["Arkive", "藏舟游戏攻略网", "Arkive Games"],
        "url": "https://arkive.games/",
        "inLanguage": ["zh-CN", "zh-TW", "en-US"]
      }
    </script>
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

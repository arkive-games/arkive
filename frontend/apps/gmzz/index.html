<!doctype html>

    <!-- Machine translation rewrites text nodes into <font> wrappers, which

         own i18n, so opting out costs nothing they do not already provide. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:site_name" content="藏舟 Arkive" />
    <meta property="og:title" content="诡秘之主资料库 | 藏舟 Arkive" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

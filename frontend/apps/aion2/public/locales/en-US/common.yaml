introModal:
  version: "Version"
  title: "Welcome to AION2 Interactive Map"
  body: |-
    The website is built and maintained by the **苏烟攻略组 (Suyn AION2 Team)**. We promise that this site will **always remain free**, and all daily operations rely solely on **voluntary donations**. We will never sell, trade, or charge for this website on any platform (such as Goofish, Taobao, TikTok). Please stay alert and beware of scams! If you obtained this website by paying money, please request a **refund** and report the seller. If you encounter impersonators posting fake versions of our content, please help **report** them — thank you!

    The site developer (**tc-imba**) is a firm supporter and contributor to the open-source community. All code and resources of this website are released under the **GNU GPL license**.

    If any individual or organization **violates the GPL license** and redistributes the site's code or resources in any form (free or paid), we will **reserve all rights to pursue legal responsibility**.

    ### Communication & Contact

    - **Aion 2 Discussion Discord:** https://discord.gg/cqn9sKbWPU
    - **Bug reports & marker sharing**: please contact via Discord
    - **Advertisement inquiries**: please contact via Discord

    ### If the map fails to load

    It may be due to high server load.  
    You may switch the top-right **online mode (cloud icon)** to **offline mode**, though offline data updates may be slightly delayed.

    ### Team Members

    **苏烟、双酿(tc-imba)、物语、阡陌夕晨、小海、言本卿、粥棵儿、落花千树、Marry、焦糖云朵大麦茶、煎饺**

    ### Special Thanks to Our Supporters

    **笛声青案梦长安、不知水玄月、次不次薯条ono、饭特稀、澜芳华、阿姐收手吧、魔1–汐见琴音、11111、地对地导弹**

  hint: |-
    Maintaining a game guide website requires a tremendous amount of time and effort. If you wish to support us, you may do so via the Alipay QR code below — your kindness is what keeps this project moving forward ❤
  alert: "This site will **always be free to use**."

  
# Site-info panel (right sidebar / top-bar popover / mobile More sheet).
# `contact.content` keeps its legacy name (it predates this group). This
# locale has no `feedback:` key — the QQ card is zh-only; the Discord
# invite in `contact.content` is this locale's channel instead.
siteInfo:
  tab: "About"
  aboutTitle: "About this site"
  arkiveName: "Arkive"
  gameName: "AION2"
  introTemplate: "This unofficial {game} interactive map and database is built and maintained by {arkive}. All game data is extracted from the game files, and the site will always remain free to use."
  disclaimerTemplate: "This site is not affiliated with, authorized, or endorsed by {developer}. All rights to {game} and related game content belong to {developer}."
  versionTitle: "Version updates"
  viewVersionTemplate: "View version {version}"
  recentUpdatesTitle: "Recent updates"
  noRecentUpdates: "No updates yet."
  contact:
    content: |
      1. **Our Aion 2 Discussion Discord:** https://discord.gg/cqn9sKbWPU
      2. For the latest Aion 2 news and active discussions, check out the Aion 2 Global Discord – **the biggest Aion 2 community** we’re happy to collaborate with: https://discord.gg/aion2global
  feedback:
    title: "Community and feedback"
    label: "Feedback QQ group"
    hint: "The game-specific communities above are kept for player discussion. Use the feedback QQ group below to suggest improvements or report problems."


  gameName: "AION2"
  introTemplate: "이 {game} 비공식 인터랙티브 지도 및 데이터베이스는 {arkive}에서 제작하고 운영합니다. 모든 게임 데이터는 게임 파일에서 추출했으며 언제나 무료로 이용할 수 있습니다."

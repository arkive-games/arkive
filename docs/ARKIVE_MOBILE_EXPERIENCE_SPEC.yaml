schema_version: "2.0.0"
spec_id: "arkive.mobile-experience"
title: "Arkive Mobile Web Experience Specification"
status: "canonical"
last_reviewed: "2026-08-10"

references:
  parent: "docs/ARKIVE_SITE_SPEC.yaml"
  ui_foundations: "docs/ARKIVE_UI_FOUNDATIONS_SPEC.yaml"
  color_system: "docs/ARKIVE_SITE_COLOR_SYSTEM.yaml"
  desktop_map_ui: "docs/ARKIVE_INTERACTIVE_MAP_UI_SPEC.yaml"
  state_memory: "docs/ARKIVE_STATE_MEMORY_SPEC.yaml"
  repository_contract: "CLAUDE.md"
  reading_rule: >-
    Read the parent and UI-foundations specifications first. Read this file for
    composition and interaction below md. Open color, map, or state-memory
    specifications only when that specialist scope is part of the task.

purpose:
  summary: >-
    Define one reusable mobile composition for the portal, game maps,
    encyclopedias, databases, forms, and tools without shrinking desktop UI
    until it becomes unreadable.
  outcomes:
    - "Every destination and essential capability remains reachable on a phone."
    - "Dense game data remains readable without document-level horizontal overflow."
    - "A future game adopts shared mobile shells and patterns through configuration."

scope:
  breakpoint: "Below md, as defined by the UI-foundations specification"
  required_viewports:
    - "320x844 narrow portrait"
    - "390x844 reference portrait"
    - "430x932 wide portrait"
    - "844x390 landscape breakpoint transition"
  included:
    - "Portal, catalogs, forum, account, and scrollable game content"
    - "Interactive maps, search, filters, marker details, settings, and tools"
    - "Safe areas, touch behavior, software keyboard, overflow, and adaptive data presentation"
  excluded:
    - "Native application navigation patterns"
    - "Desktop geometry owned by the desktop map specification"
    - "Global font, spacing, shape, color, and memory rules owned by specialist specifications"

mobile_principles:
  priority_order:
    - "Complete the task"
    - "Read and compare game information"
    - "Reach every control comfortably"
    - "Maintain context while navigating"
    - "Decorate only when it supports identity"
  rules:
    - "Compose for mobile instead of uniformly shrinking desktop layout."
    - "Preserve content and capability unless this file records an explicit mobile exclusion."
    - "Use summary-first disclosure for depth, not smaller type."
    - "Keep the first screen and map center clear of persistent secondary controls."
    - "Use cards only in the roles allowed by the UI-foundations specification."

ownership:
  shared_shell:
    mobile_header: "frontend/packages/map-shell/src/ArkiveMobileHeader.tsx"
    bottom_navigation: "frontend/packages/map-shell/src/ShellBottomNav.tsx"
  shared_interactions:
    search: "frontend/packages/map-shell/src/SearchPanel.tsx"
    marker_detail: "frontend/packages/map-shell/src/MarkerPopupCard.tsx"
    ui_primitives: "frontend/packages/ui/src"
  host_owned:
    - "Primary and secondary route inventory"
    - "Localized route, setting, filter, and action labels"
    - "Supported languages"
    - "Game data, artwork, filter meaning, search meaning, and tool workflows"
  rules:
    - "Fix cross-product behavior at the shared owner."
    - "Promote an app-local pattern before a second game copies it."
    - "Mobile-only composition remains hidden at md and above."

viewport_shell:
  root:
    height: "Use dvh according to the UI-foundations specification."
    overflow: "No document-level horizontal overflow"
    content_scroller: "One vertical scroller between the mobile header and fixed bottom navigation"
  content_pages:
    header: "Use ArkiveMobileHeader; never compress the desktop top bar."
    height: "Use shared_header_height from the UI-foundations specification."
    horizontal_padding: "Use the mobile page gutter from the UI-foundations specification."
    top_spacing: "Use the shared content-page top-space token."
    composition: "Collapse multi-column content to one intentional reading flow."
    header_priority:
      - "Arkive mark and compact localized brand name"
      - "Current page title, allowed to truncate only when the complete title remains available in page content"
      - "One account control or one page action, never both when 320px cannot contain them"
  interactive_maps:
    header: "Omit the mobile header to protect map height."
    sidebar: "Replace the desktop sidebar with a filter bottom sheet."
    search: "Replace desktop floating search with a map action and bottom sheet."
  breakpoint_transition:
    - "Close sheets, dialogs used only for mobile navigation, and mobile-only overlays before desktop composition appears."
    - "Preserve semantic task state through the state-memory contract."
    - "A mobile disclosure preference never hides desktop content."

bottom_navigation:
  height: "Use bottom_navigation_height from the UI-foundations specification."
  composition:
    maximum_visible_slots: 5
    primary_routes: "At most four highest-frequency destinations"
    final_slot: "More"
    labels: "One line at the metadata type role; use the shortest clear localized label"
  route_inventory: >-
    Every desktop destination remains reachable. Secondary routes live in More
    and do not duplicate primary routes.
  active_state: >-
    Use shape, icon, text, and color together. When the current route lives in
    More, only More carries the primary active state.
  more_sheet:
    layout: "Compact route grid followed by settings and site information"
    required:
      - "Every secondary route"
      - "Only languages supported by the host game"
      - "Follow system, light, and dark theme choices"
      - "Site information and feedback when supplied"
    excluded:
      - "Duplicate Arkive branding"
      - "Login or account access"
      - "Map renderer selection"
    behavior:
      - "Reopen on the main pane, not a remembered language sub-page."
      - "Close after navigation and at the desktop breakpoint."
      - "Scroll internally when content exceeds 90dvh."

map_workspace:
  actions:
    placement: "One right-edge vertical stack above bottom navigation and safe area"
    order: "Zoom, search, filters"
    target_size: "Use isolated_map_target from the UI-foundations specification."
    renderer: "Do not expose renderer selection on mobile."
    rule: "Controls never overlap each other, marker details, or bottom navigation."
  search_sheet:
    empty: "Use content height without a decorative blank results area."
    populated: "Grow to an available-height maximum, then scroll internally."
    close: "Remain reachable and never overlap the input."
  filter_sheet:
    maximum_height: "85dvh"
    trigger: "Use routine primary interaction styling, plus a non-color indicator when filters are active."
    content: "Omit empty groups and options that produce no results."
  marker_detail:
    maximum_width: "Viewport width minus twice the mobile page gutter"
    maximum_height: "The smaller of 72dvh and 32rem"
    overflow: "Scroll inside the detail surface"
    content: "Use the desktop map specification's shared marker-detail contract."
  status_overlay:
    color: "Use map_overlay from the color-system specification."
    content: "Keep coordinates and essential status compact and readable over any map imagery."

portal_home:
  first_screen: "Lead with game discovery or a real continuation task, never a marketing hero."
  search: "Use one compact inline search control."
  continue: "Use valid recent activity, not popularity presented as personal history."
  game_media: "Show inspectable game artwork in a stable 16:9 frame."
  participation: "Keep the join section unframed and separate it with one divider."

catalogs_and_lists:
  toolbar:
    default: "Place search and view mode on one row."
    narrow: "Move result count below when the controls cannot preserve their minimum width."
  filters:
    style: "Peer filters use the same geometry and state language."
    active: "Use color plus text, icon, count, or shape to expose an active result scope."
    memory: "Use session context unless the product explicitly offers a saved default."
  grid:
    rule: "Choose columns from the record's minimum readable identity width, not from a universal column count."
    maximum_columns: 3
    fallback: "Reduce columns or use list mode before names, images, or essential metadata become ambiguous."
    stability: "Reserve media ratio, title lines, and metadata tracks to prevent layout shift."
  list:
    rule: "Expose essential fields without document-level horizontal scrolling."
    comparison_exception: "A genuinely comparative table may use a contained horizontal scroller."
  pagination:
    use_when: "Use pagination for long result sets instead of an indefinitely growing page."
    narrow_320: "Previous icon button, current page of total, and Next icon button"
    standard_390_and_up: "Previous, at most three numbered pages, and Next when all controls fit"
    touch: "All controls use the shared minimum touch target."
    behavior:
      - "Reset to page one when query, filters, mode, or data scope changes."
      - "Changing page returns the content scroller to the result heading."
    page_size: "Choose from record density; do not force one value across unlike catalogs."

detail_pages:
  composition: "Identity summary first, then progressive disclosure for depth."
  identity:
    content: "Compact artwork, localized name, game-facing number, and essential badges"
    priority: "Name and identity precede secondary metadata."
    internal_ids: "Hide raw internal ids unless required by the user workflow."
  reading_order:
    - "Description or primary summary"
    - "Base or high-frequency statistics"
    - "Primary capabilities or suitability"
    - "Secondary skills, drops, locations, formulas, and cross-links"
  disclosure:
    per_section: "Long sections expose an expand or collapse action."
    bulk: "Show Expand all and Collapse all only when at least three sections are collapsible."
    default: "Expand the minimum sections needed to identify and evaluate the record."
    memory: "Keep ordinary disclosure in session context. Persist a viewport-scoped preference only when the user explicitly enables Remember disclosure."
    desktop: "Always render complete desktop section content."
  dense_data:
    mobile: "Convert non-comparative desktop tables into stacked records with an identity row and labeled metadata grid."
    desktop: "Retain comparative tables when width permits."
  missing_data: "Omit absent descriptions and untranslated raw keys instead of printing placeholders."

tools_and_calculators:
  workflow: "Selector, input, and result form one continuous framed tool with internal dividers."
  modes: "Use a segmented control for peer workflows and user-facing task language."
  selectors:
    layout: "Keep related selectors in one row only while each remains readable; otherwise use an intentional grid."
    content: "Show localized identity and only metadata needed for the choice."
    popup: "Search and selection share one surface; do not open nested selector dialogs."
  results:
    mobile: "Transform wide output tables into labeled result groups."
    hierarchy: "Lead with the result name and final value, then contributing stages."
    explanation: "Put long formulas and method notes behind disclosure."
    duplication: "Do not repeat the workflow title inside every result record."
  memory: "Use task drafts and explicit New calculation behavior from the state-memory specification."

forms_forum_and_account:
  layout: "Use one reading column with labels above controls and errors below."
  actions: "Keep the active submit or save action reachable when the software keyboard opens."
  draft: "Use the state-memory draft contract for consequential multi-field work."
  validation: "Preserve entered values and move focus to the first invalid field without hiding its message."
  account_access: "Expose account access in the content header, not the More sheet."

overlays_safe_areas_and_input:
  popovers:
    width: "No wider than the viewport minus twice the mobile page gutter"
    height: "Cap to available viewport height and scroll internally"
    stacking: "Render above fixed navigation and nearby content"
  safe_area:
    bottom: "Navigation, floating actions, sheets, and content include env(safe-area-inset-bottom)."
    top: "Standalone mobile headers include env(safe-area-inset-top) when needed."
  keyboard:
    - "Focused input, validation message, and submit action remain reachable."
    - "Do not pin a centered dialog behind the software keyboard."
  hover_conversion: "Desktop hover-only information gains a tap, disclosure, icon action, or sheet on touch."
  back_to_top:
    show: "After the content scroller passes 500px on long pages"
    placement: "Above fixed navigation and safe area"
    reduced_motion: "Use instant scrolling"

text_and_localization:
  typography: "Use roles and font delivery from the UI-foundations specification."
  overflow:
    identity: "Wrap essential identity text before truncating it."
    maximum_default_lines: 2
    fallback: "Use manual horizontal scrolling or disclosure when wrapping cannot preserve meaning."
    marquee: "Do not run automatic marquee on routine mobile content."
  chinese_ui:
    - "Translate user-facing game terms, status effects, units, size codes, and standard labels."
    - "Hide untranslated internal ids and unnecessary raw enum values."
    - "Retain Latin characters only for official brands, legal records, technical identifiers, or game-defined suffixes."
    - "Omit a record whose localized name is missing rather than exposing its English key as the name."

footer:
  version_information: "Do not show site or game version identifiers in the mobile page footer."
  dense_pages: "A route may hide the mobile footer when bottom navigation already provides navigation."
  clearance: "Any remaining footer content clears bottom navigation and safe area."

accessibility:
  mobile_specific:
    - "Navigation, toggles, filters, and disclosures expose state semantically."
    - "Sheets and dialogs have accessible titles, close controls, focus containment, and focus restoration."
    - "Touch order and screen-reader order match the visual reading order."
    - "Landscape transition does not strand focus inside an unmounted mobile overlay."
    - "Pinch zoom and 200 percent text zoom remain usable."

new_game_contract:
  - "Configure at most four primary routes and an exhaustive More inventory."
  - "Provide supported languages and all shared mobile labels."
  - "Adopt shared header, bottom navigation, theme, account, and state-memory adapters."
  - "Provide a mobile presentation for every desktop table wider than the viewport."
  - "For maps, move search and filters into sheets and lift controls above bottom navigation."
  - "Do not copy another game's mobile shell or geometry."

verification:
  static:
    - "Validate every canonical YAML specification."
    - "Run focused shared-component checks and affected application builds."
  browser:
    - "Test 320x844, 390x844, 430x932, and 844x390."
    - "Test light, dark, follow-system, reduced-motion, software-keyboard, and 200 percent zoom behavior."
    - "Test navigation, More, language, theme, account, search, filters, pagination, dialogs, and back-to-top."
    - "Test one short and one data-heavy record for every changed detail or tool pattern."
    - "Confirm documentElement.scrollWidth does not exceed documentElement.clientWidth."
    - "Confirm breakpoint changes close transient UI and preserve semantic task state."
  evidence_policy: "Keep only final review evidence and remove browser artifacts before handoff."

migration_from_1_3:
  - "Read global typography, spacing, shape, control size, responsive, and motion values from the UI-foundations specification."
  - "Replace seven-control narrow pagination with the width-safe responsive contract."
  - >-
    NOT DONE. Replace automatic mobile marquee with wrapping, manual scrolling, or
    disclosure. OverflowMarquee still animates with iterations: Infinity, and
    PalPicker still passes `auto`, so the breeding selector auto-scrolls on phones.
    Left open deliberately: dropping `auto` without a replacement makes a clipped
    label unreachable on touch, where there is no hover to reveal it. Neither
    perpetual animation nor silent truncation is acceptable, so this needs a design
    decision (wrap, or tap-to-expand) rather than a prop change.
  - "Replace hard-coded dark map overlays with the color-system map_overlay token."
  - "Remove duplicated global accessibility and state-memory rules."

maintenance:
  rules:
    - "This file owns only below-md composition and interaction."
    - "Do not copy global token values into this file."
    - "Update last_reviewed when the mobile contract is intentionally reviewed."

schema_version: "3.0.0"
spec_id: "arkive.site-color-system"
title: "Arkive Site-wide Color System"
status: "canonical"
last_reviewed: "2026-10-27"

references:
  parent: "docs/ARKIVE_SITE_SPEC.yaml"
  ui_foundations: "docs/ARKIVE_UI_FOUNDATIONS_SPEC.yaml"
  radix_colors: "https://www.radix-ui.com/colors"
  implementation: "frontend/packages/map-shell/src/arkive-map-theme.css"
  reading_rule: "Read this file only when colors, themes, contrast, or data-visualization color roles are in scope."

purpose:
  summary: >-
    Define one semantic color language for the portal and every game while
    keeping game artwork and game-data colors intact.
  outcomes:
    - "Shared chrome remains recognizably Arkive in every game."
    - "A component consumes a semantic role instead of choosing a palette value."
    - >-
      Text, focus indicators, and the boundaries required to identify a control
      meet their required contrast. Decorative dividers (--border, 1.38:1 light,
      1.66:1 dark) are not control boundaries and are not held to 3:1.

scope:
  applies_to:
    - "Portal and game-product chrome"
    - "Navigation, controls, forms, cards, popovers, sheets, dialogs, and feedback"
    - "Map controls and shared overlays"
  game_owned:
    - "Game artwork and logos"
    - "Map void colors and marker artwork"
    - "Equipment quality, rarity, faction, and other established game-data semantics"

source:
  system: "Radix Colors"
  families:
    neutral: "Gray"
    interactive: "Blue"
    warm_action: "Arkive warm gradient (peach, coral, rose) plus Amber accents"
    orientation: "Amber"
    destructive: "Red"
  rule: >-
    This specification stores only approved semantic values. Do not duplicate
    all Radix scale steps here or in application code. When a new role is
    required, select and verify its value here before implementation.

# Owner decision (2026-10): the site reads warm, young, rounded and lively.
# The warm gradient is Arkive's main call to action; blue stays the colour of
# links and keyboard focus so the warm accent never has to carry state alone.
brand_direction:
  summary: "Neutral surfaces, a warm gradient for the main action, warm amber accents, and blue for links and focus"
  roles:
    neutral: "Owns all large surfaces and most component backgrounds"
    warm_action: "Owns the main call to action of a surface: sign-in, submit, publish, search, and the selected tab capsule of warm views"
    amber: "Owns warm accents: field focus borders, active filter tints, search-term highlights, the voyage line, and warnings"
    blue: "Owns links, keyboard focus rings, and selection inside data tools and maps"
    game_color: "Each game's own colour (sites.ts color and menuTint) may tint that game's own icon, card hover, and menu row"
  rules:
    - "A game colour only ever marks its own game; it never becomes shared chrome."
    - "One warm_action control per compact surface; secondary actions use neutral pills."
    - "Do not put white text or icons on any warm gradient; use the warm-action foreground."

semantic_tokens:
  light:
    background: { value: "#FCFCFC", css: "--background" }
    foreground: { value: "#202020", css: "--foreground" }
    card: { value: "#F9F9F9", css: "--card" }
    card_foreground: { value: "#202020", css: "--card-foreground" }
    popover: { value: "#FCFCFC", css: "--popover" }
    popover_foreground: { value: "#202020", css: "--popover-foreground" }
    primary: { value: "#0090FF", css: "--primary" }
    primary_foreground: { value: "#202020", css: "--primary-foreground" }
    link: { value: "#0D74CE", css_note: "No separate token; use --arkive-nav-active" }
    secondary: { value: "#F0F0F0", css: "--secondary" }
    secondary_foreground: { value: "#202020", css: "--secondary-foreground" }
    muted: { value: "#F0F0F0", css: "--muted" }
    muted_foreground: { value: "#646464", css: "--muted-foreground" }
    hover: { value: "#E8E8E8", css: "--accent" }
    border: { value: "#D9D9D9", css: "--border" }
    input: { value: "#F0F0F0", css: "--input" }
    focus_ring: { value: "#0D74CE", css: "--ring" }
    selected_surface: { value: "#E6F4FE", css: "--arkive-filter-active when no tint, plus non-color indicator" }
    navigation: { value: "#0D74CE", css: "--arkive-nav-active" }
    navigation_foreground: { value: "#FFFFFF", css: "--arkive-nav-on-active" }
    warm_action: { value: "linear-gradient(110deg, #ffd08a, #ffb398 60%, #ffa7be)", css: "--arkive-warm-action" }
    warm_action_foreground: { value: "#40251c", css: "--arkive-warm-action-foreground" }
    warm_accent: { value: "#AB6400", css: "--arkive-nav-accent, --arkive-brand-slogan, --arkive-nav-beacon, --arkive-orange" }
    game_color_tint: { note: "Each game's sites.ts color property tints its own card hover and menu row", css: "--game-color local variable" }
    action: { value: "#CC4E00", css: "--arkive-action" }
    action_foreground: { value: "#FFFFFF", css: "--arkive-action-on" }
    destructive: { value: "#CE2C31", css: "--destructive" }
    destructive_foreground: { value: "#FFFFFF", css: "--destructive-foreground" }
    warning: { value: "#AB6400", css: "--arkive-nav-accent" }
    warning_foreground: { value: "#FFFFFF", css_note: "White on #AB6400 is 4.61:1" }
  dark:
    background: { value: "#111111", css: "--background" }
    foreground: { value: "#EEEEEE", css: "--foreground" }
    card: { value: "#191919", css: "--card" }
    card_foreground: { value: "#EEEEEE", css: "--card-foreground" }
    popover: { value: "#222222", css: "--popover" }
    popover_foreground: { value: "#EEEEEE", css: "--popover-foreground" }
    primary: { value: "#0090FF", css: "--primary" }
    primary_foreground: { value: "#061018", css: "--primary-foreground" }
    link: { value: "#70B8FF", css_note: "No separate token; use --arkive-nav-active" }
    secondary: { value: "#222222", css: "--secondary" }
    secondary_foreground: { value: "#EEEEEE", css: "--secondary-foreground" }
    muted: { value: "#222222", css: "--muted" }
    muted_foreground: { value: "#B4B4B4", css: "--muted-foreground" }
    hover: { value: "#2A2A2A", css: "--accent" }
    border: { value: "#3A3A3A", css: "--border" }
    input: { value: "#222222", css: "--input" }
    focus_ring: { value: "#70B8FF", css: "--ring" }
    selected_surface: { value: "#0D2847", css: "--arkive-filter-active when no tint, plus non-color indicator" }
    navigation: { value: "#0090FF", css: "--arkive-nav-active" }
    navigation_foreground: { value: "#061018", css: "--arkive-nav-on-active" }
    warm_action: { value: "linear-gradient(110deg, #ffd08a, #ffb398 60%, #ffa7be)", css: "--arkive-warm-action (same as light)" }
    warm_action_foreground: { value: "#40251c", css: "--arkive-warm-action-foreground (same as light)" }
    warm_accent: { value: "#FFC53D", css: "--arkive-nav-accent, --arkive-brand-slogan, --arkive-nav-beacon, --arkive-orange" }
    game_color_tint: { note: "Each game's sites.ts color property tints its own card hover and menu row", css: "--game-color local variable" }
    action: { value: "#F76B15", css: "--arkive-action" }
    action_foreground: { value: "#202020", css: "--arkive-action-on" }
    destructive: { value: "#E5484D", css: "--destructive" }
    destructive_foreground: { value: "#111111", css: "--destructive-foreground" }
    warning: { value: "#FFC53D", css: "--arkive-nav-accent" }
    warning_foreground: { value: "#111111", css_note: "#111111 on #FFC53D is 11.96:1" }
  map_overlay:
    surface: "rgba(25, 25, 25, 0.88)"
    foreground: "#EEEEEE"
    border: "rgba(255, 255, 255, 0.18)"
    rule: "Use this theme-independent overlay only when text must remain legible over unpredictable map imagery."

contrast_contract:
  thresholds:
    normal_text: "4.5:1"
    large_text: "3:1"
    interactive_boundary_and_focus: >-
      3:1 against adjacent colors, for meaningful icons, focus indicators, and any
      boundary a user needs in order to identify a control. Not required of
      decorative dividers, or between two adjacent surfaces (--input is a field
      FILL, not a border; its ratio against the page is not a conformance figure).
  verified_pairs:
    light_primary_text: "#202020 on #0090FF, 4.99:1"
    dark_primary_text: "#061018 on #0090FF, 5.87:1"
    light_warm_text: "#40251c on #ffd08a (lightest gradient stop), 9.76:1"
    dark_warm_text: "#40251c on #ffd08a, 9.76:1 (same in both modes)"
    light_action_text: "#FFFFFF on #CC4E00, 4.51:1"
    dark_action_text: "#202020 on #F76B15, 5.48:1"
    light_destructive_text: "#FFFFFF on #CE2C31, 5.21:1"
    dark_destructive_text: "#111111 on #E5484D, 4.82:1"
    light_focus_against_background: "#0D74CE against #FCFCFC, 4.65:1"
    dark_focus_against_background: "#70B8FF against #111111, 8.98:1"
    light_warm_accent_text: "#FFFFFF on #AB6400, 4.61:1"
    dark_warm_accent_text: "#111111 on #FFC53D, 11.96:1"
  rules:
    - "Do not infer contrast from a palette step; verify the actual foreground and background pair."
    - "Muted text still meets normal-text contrast."
    - "Warm-accent and warning colors are not used as small body text without a verified foreground pair."
    - "State differences never rely on color alone."

feedback_and_data_color:
  permitted_families:
    red: "Errors, destructive actions, and failure states"
    green: "Success and confirmed-completion states"
    cyan: "Data visualization when blue is already occupied"
    purple: "Specialized data visualization only"
  rules:
    - "Feedback and data colors are not Arkive brand accents."
    - "Add semantic surface, foreground, border, and icon values together when a new feedback role becomes shared."
    - "Do not use red, green, cyan, or purple as decorative shared surfaces."
    - "A data visualization remains distinguishable without color through labels, patterns, symbols, or direct values."

theme_contract:
  modes:
    - "follow-system"
    - "light"
    - "dark"
  rules:
    - "Set theme at the application root; sections do not independently flip theme."
    - "Both modes preserve hierarchy and game-art legibility."
    - "Transparency and blur always have an opaque semantic fallback."
    - "Theme preference behavior is shared across the portal and games."

component_usage:
  main_call_to_action: "warm_action and warm_action_foreground, on a pill"
  secondary_action: "neutral pill: muted or card surface with foreground text"
  data_tool_primary_action: "primary and primary_foreground inside map and calculator workspaces"
  navigation_and_link: "navigation or link according to whether the role is a surface or text"
  selected_control: "selected_surface or a game_color_tint, plus a non-color state indicator"
  keyboard_focus: "focus_ring"
  field_focus: "On portal forms, a warm_accent border plus an 18% warm_accent halo; in data tools, focus_ring plus a 20% halo"
  game_identity: "game_color_tint on the game's own icon background, card hover, and menu-row hover"
  map_overlay_action: "action and action_foreground, for a solid action button drawn over map or game artwork where a gradient would lose contrast"
  destructive_action: "destructive and destructive_foreground"
  map_status_overlay: "map_overlay"
  rules:
    - "Components consume tokens; application JSX and app-local CSS do not paste these values."
    - "Use one dominant interaction emphasis per compact surface."
    - "Pagination and filter chips stay neutral; only the active state may take a warm or game tint."
    - "A composite field draws focus on its outer container and suppresses a duplicate inner-input outline."
    - "Keyboard focus-visible keeps a visible ring even where a warm field-focus border is shown."

verification:
  - "Validate this YAML file."
  - "Calculate contrast from the shipped CSS values in light and dark mode."
  - "Inspect focus, hover, selected, disabled, warning, destructive, and map-overlay states."
  - "Verify representative game artwork does not reduce shared-control legibility."
  - "Confirm changed UI contains no new app-local shared-chrome color literals."

known_gaps:
  - >-
    Meta CSS (all-games.css, forum.css, tools-page.css) still pastes an orange
    gradient (#ffc061, #f5a524, #ec7a1c) with white text instead of
    --arkive-warm-action. White on those stops is 1.62 to 2.85:1, below 4.5:1.
    Move them to the shared token and foreground.

maintenance:
  rules:
    - "This file is the only canonical owner of shared color roles and values."
    - "Update the semantic token and its contrast evidence together."
    - "Update last_reviewed whenever the palette contract is intentionally reviewed."

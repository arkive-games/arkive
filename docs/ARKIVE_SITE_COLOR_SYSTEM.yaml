extended_semantic_families:
  policy: >-
    Additional Radix families are available only for established semantic
    feedback. They are not Arkive brand colors and must not decorate shared
    navigation or general surfaces.
  permitted:
    red: "Errors, destructive actions, and failure states only"
    green: "Success and confirmed-completion states only"
    cyan: "Specialized data visualization only when blue is already occupied"
    purple: "Specialized data visualization only"
  prohibited:
    - "Using a game key-art color as shared chrome"
    - "Adding another brand accent without updating this specification"
    - "Using semantic red or green as a decorative surface"

usage_rules:
  - "Use semantic tokens in components; never paste scale values into app-local JSX."
  - "Neutral gray owns large surfaces. Blue, amber, and orange remain accents."
  - "Blue identifies navigation, links, selected controls, and primary actions."
  - "Amber identifies orientation, focus, warnings, and beacon-like selection indicators."
  - "Orange is reserved for high-value calls to action and restrained brand warmth."
  - "Do not use both amber and orange as competing accents in the same compact control."
  - "Game artwork and marker artwork may retain source colors."
  - "State differences must never rely on color alone."

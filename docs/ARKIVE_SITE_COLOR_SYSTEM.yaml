schema_version: "1.1.0"
spec_id: "arkive.site-color-system"
title: "Arkive Site-wide Color System"
status: "canonical"
last_reviewed: "2026-08-08"

references:
  parent: "docs/ARKIVE_SITE_SPEC.yaml"
  implementation: "frontend/packages/map-shell/src/arkive-map-theme.css"
  reading_rule: "Read this file only when colors, themes, contrast, or data-visualization color roles are in scope."

scope:
  applies_to:
    - "Arkive home page"
    - "Every game map and encyclopedia"
    - "Shared navigation, sidebars, search, dialogs, cards, and status feedback"
    - "Future Arkive web applications"
  implementation_status: >-
    Implemented across the shared theme, home page, current game applications,
    and both map engines. Game-authored artwork, map void colors, marker art,
    equipment quality colors, and other game-data semantics remain game-owned.

source:
  system: "Radix Colors"
  documentation: "https://www.radix-ui.com/colors"
  rationale:
    - "Radix provides coordinated 12-step scales for light and dark interfaces."
    - "Its dark neutral scale remains truly neutral instead of tinting every surface blue."
    - "Blue, amber, and orange provide clear Arkive navigation, beacon, and action roles."

brand_direction:
  summary: "Neutral black surfaces with blue navigation, amber beacons, and restrained orange action accents."
  core_families:
    neutral: "Radix Gray"
    navigation: "Radix Blue"
    beacon: "Radix Amber"
    action: "Radix Orange"
  signature:
    - "Black sea"
    - "Blue navigation light"
    - "Amber beacon"
    - "Orange action warmth"


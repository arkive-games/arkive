schema_version: "3.0.0"
spec_id: "arkive.site"
title: "Arkive Site Specification"
status: "canonical"
last_reviewed: "2026-10-27"

purpose:
  summary: >-
    Define Arkive's brand identity and the small set of experience rules shared
    by the home page, game maps, encyclopedias, tools, and future web products.
  reading_goal: >-
    Read this file first, then open only the specialist specification required
    by the task. Do not load historical plans to discover current UI rules.

specification_router:
  always_read: "docs/ARKIVE_SITE_SPEC.yaml"
  read_when_needed:
    ui_foundations: "docs/ARKIVE_UI_FOUNDATIONS_SPEC.yaml"
    color_or_theme: "docs/ARKIVE_SITE_COLOR_SYSTEM.yaml"
    interactive_map_desktop_ui: "docs/ARKIVE_INTERACTIVE_MAP_UI_SPEC.yaml"
    mobile_web_experience: "docs/ARKIVE_MOBILE_EXPERIENCE_SPEC.yaml"
    state_memory: "docs/ARKIVE_STATE_MEMORY_SPEC.yaml"
    repository_process_and_data_contract: "CLAUDE.md"
  historical_records:
    paths:
      - "docs/superpowers/plans/"
      - "docs/superpowers/specs/"
    authority: "Historical context only; never overrides a canonical top-level Arkive specification."
  conflict_resolution:
    - "CLAUDE.md owns repository process, architecture, and data-flow rules."
    - "This file owns brand identity and cross-site experience rules."
    - "The UI-foundations specification owns framework-facing design rules, typography, spacing, shape, responsive behavior, motion, layers, and shared component principles."
    - "The color-system specification owns every color value and color role."
    - "The interactive-map specification owns map-only layout and interaction rules."
    - "The state-memory specification owns persistence classes, precedence, retention, clearing, synchronization, and migration."
    - "A specialist specification may add detail within its scope but must not restate a parent rule."

brand_identity:
  brand_key: "Arkive"
  official_site_name:
    zh-CN: "藏舟游戏攻略网"
    zh-TW: "藏舟遊戲攻略網"
    en-US: "Arkive.games"
    ja-JP: "蔵舟ゲーム攻略サイト"
    ko-KR: "창저우 게임 공략 사이트"
  domain:
    display: "Arkive.games"
    canonical_url: "https://arkive.games"
    retired_url: "https://tc-imba.com (every former *.tc-imba.com site host now answers 301 to its arkive.games twin; data-* and resource-* hosts still serve)"
    rule: "Display the Arkive.games domain as the long-term brand domain; keep temporary deployment URLs in environment configuration."
  slogan:
    zh-CN: "万千攻略，藏于一舟"
    en-US: "Sail Games With Us."
  concept_glossary:
    cang:
      source_term: "藏"
      meaning:
        - "Collection"
        - "Discovery"
    zhou:
      source_term: "舟"
      meaning:
        - "Carrying"
        - "Exploration"
        - "Navigation"
    game_guides:
      source_term: "游戏攻略"
      meaning:
        - "Knowledge"
        - "Maps"
        - "Tools"
  interpretation: >-
    Arkive is a welcoming vessel for game knowledge: it collects useful
    discoveries, helps players navigate game worlds, and carries maps, guides,
    and tools in one dependable place.

# Owner decision (2026-10): a comprehensive one-stop guide site, function
# first, that reads warm, young, rounded and lively without letting the chrome
# overpower the game art.
experience_direction:
  summary: "A warm, rounded harbour for game guides: every game and tool one step from the home page, with quiet, dense tools behind it."
  qualities:
    - "Function-first: games and tools reachable from the first screen"
    - "Warm, young, rounded and lively on the portal"
    - "Quiet, work-focused tools and maps"
    - "Game art shown as it is"
    - "Consistent across games"
  avoid:
    - "Generic technology-dashboard styling"
    - "Cold futuristic decoration"
    - "Game-specific chrome that fragments the Arkive identity"
    - "Decorative containers around every content group"
    - "Promotional introductions in place of content"
  mobile_detail: "Detailed mobile composition and geometry are owned by docs/ARKIVE_MOBILE_EXPERIENCE_SPEC.yaml."

product_model:
  home_page:
    role: "The common discovery entrance for every Arkive game and product."
    local_url: "http://localhost:15172"
    navigation:
      - key: "discoverGames"
        label_zh-CN: "发现游戏"
        behavior: "Navigate to the home-page game discovery section."
      - key: "allGames"
        label_zh-CN: "全部游戏"
      - key: "tools"
        label_zh-CN: "工具库"
      - key: "forum"
        label_zh-CN: "论坛"
    unfinished_destination: "Show the localized coming-soon notice; do not navigate to a dead route."
    first_screen: "Every live game and every tool is reachable without scrolling."
    body_order:
      - "Coverflow carousel: one wide banner per game; the centre slide sits flat and its neighbours tilt back; no masks or colour filters"
      - "Rounded game icon row, one icon per live game"
      - "Tool dock: the calculator and planner pages"
      - "Community feed beside the voyage log"
      - "The sea footer"
    excluded: "A body search box, and showcasing a single game"
    footer:
      owner: "frontend/apps/meta/src"
      # Owner decision (2026-10): the footer is a sea whose wave edge the page's
      # voyage line rises into, and it carries only the wordmark, the About and
      # Help links, and the legal line. Browse lives in the header and the
      # homepage's own shortcut row, so the footer does not repeat it.
      surface: "One continuous sea surface with a waved top edge; do not add a separate lower bar."
      desktop_layout: "Three columns: the brand, then the About and Help links, then the legal line."
      colour: "Sea waves in the blue and teal family; never red or purple."
      brand:
        - "The Arkive wordmark only, in Latin script in every locale"
        - "Copyright and filing record together on the legal line"
      navigation:
        about:
          - "About Arkive"
          - "Contact us"
          - "Update history"
        rule: "Every entry is a link to a real destination; an unfinished route is not a valid footer destination."
      help:
        # The settings panel owns theme, language and clear-data on every site,
        # so the footer links to it rather than repeating the controls. Two homes
        # for one control is how the portal and the games drift apart.
        - "Settings, opening the shared settings panel"
      exclusions:
        - "Legal company name"
        - "Fixed ARKIVE.GAMES subtitle"
        - "Decorative cards or heading marks"
        - "Social icons, version identifiers, GitHub icon links, or Made with love copy"
  all_games_page:
    role: "Every live game as a paged grid of cover cards, with search, category filters, recent visits and favorites."
    composition_owner: "docs/ARKIVE_UI_FOUNDATIONS_SPEC.yaml shared_component_contracts.portal_catalog_card"
    future_showcase: "A cover-card showcase tinted by each cover's dominant colour belongs here, not on the home page."
  tools_page:
    role: "Every calculator and planner across games, grouped by game."
    definition: "A tool is a calculator or planner page; wiki and encyclopedia pages are not tools."
  forum_page:
    role: "The shared community: posts tagged with one or more games."
  game_products:
    rule: >-
      A game may provide maps, encyclopedias, tools, routes, languages, data,
      and artwork. It must reuse the cross-site shell and brand identity.
    inventory_owner: "frontend/apps/meta/src/sites.ts (SITES, VISIBLE_SITES)"
    live_order: ["aion2", "palworld", "gmzz", "ro3", "vrising"]
    unlaunched: "sts2 and lostark stay out of the home page, the game menu, All Games and the forum cabins until they open."
    game_colour: "Each game's colour tints only that game's own icon, card hover and menu row."
  game_about:
    scope: "Every current and future game has an About panel with its own version history."
    shared_surface: "Use the shared Arkive About structure and presentation across games."
    history_links:
      - "Link to the open game's complete game-owned version history."
      - "Link to the one platform history owned by the Arkive home application."
    version_history:
      isolation: "Display only updates owned by the game whose About panel is open."
      exclusions:
        - "Updates owned by another game"
        - "Site-wide shared UI changes"
        - "Home page, account, forum, or platform-infrastructure changes"
  platform_history:
    owner: "frontend/apps/meta/src/platform-changelog.json"
    route: "#updates"
    scope: >-
      Record a shared change once when it is owned by the Arkive platform and
      automatically affects multiple game products. List the affected games;
      do not copy the entry into their game histories.
    versioning: "Use release dates and commit SHAs; platform entries never change a game's version number."

global_shell:
  desktop_shared_owner: "frontend/packages/map-shell/src/ArkiveMapTopBar.tsx"
  mobile_shared_owners:
    - "frontend/packages/map-shell/src/ArkiveMobileHeader.tsx"
    - "frontend/packages/map-shell/src/ShellBottomNav.tsx (the phone menu drawer, despite its name)"
  desktop_top_bar:
    portal: "A rounded capsule floating over the Home, All Games, Tools and Forum pages"
    game_pages: "The same bar docked full width"
    parts: "Pill tabs with a springy sliding indicator, round icon buttons, a warm gradient sign-in pill, and a ringed avatar"
  # Owner decision (2026-10): the top bar and footers carry the English "Arkive"
  # wordmark alone; the localized official name and slogan live in page
  # metadata, and the slogan is the All Games search placeholder.
  brand_block:
    content:
      - "The English \"Arkive\" wordmark, in every language"
      - "On game pages, a game chip with the game's icon and localized name"
    visibility: "Always visible whenever the desktop top bar is visible."
    home_link: "Resolve through frontend/packages/map-shell/src/arkiveHome.ts."
  navigation:
    home_page: "Use product_model.home_page.navigation in the listed order."
    account_favorites: "Keep favorites available from the signed-in account center; do not duplicate them in the desktop top navigation."
    game_pages: "Routes and labels are game-owned; geometry and interaction are shared."
    active_state: "Use one shared active indicator and restore it after hover leaves."
    dropdowns: "Open on pointer hover or keyboard focus; do not show a decorative chevron."
  utilities:
    order:
      - "Language"
      - "Theme"
      - "Login"
    language_options: "Game-owned because supported languages differ by game."
    theme_options:
      - "auto"
      - "light"
      - "dark"
    theme_behavior:
      persistence: "One shared preference must follow the user between the portal and every game, including across approved Arkive subdomains."
      auto: "Follow the operating-system color scheme; game maps and artwork must not override it."
    exclusions:
      - "About"
      - "Renderer selection"
      - "App-local search"
      - "Unapproved utility controls"
  footer_surfaces:
    portal_home: "Use product_model.home_page.footer only on the true portal discovery home view."
    standard_page: "Use the shared compact SiteFooter on scrollable portal and game content pages."
    fullscreen_map: "Render no page footer and no filing or legal text inside the full-screen map workspace."
    legal_record:
      portal_home: "Show the filing record in the home footer when the current host owns that filing; omit it from third-party toy hosts."
      standard_page: "The compact footer may show the host filing record under the same ownership rule."
      fullscreen_map: "Never place the filing record in the map status overlay or another map control."

shared_foundations:
  ui:
    owner: "docs/ARKIVE_UI_FOUNDATIONS_SPEC.yaml"
    rule: >-
      Use the shared framework, typography, spacing, shape, responsive, motion,
      layer, icon, and component rules. Specialist specifications compose these
      foundations but never copy or redefine their values.
  color:
    owner: "docs/ARKIVE_SITE_COLOR_SYSTEM.yaml"
    rule: "Use semantic tokens; never copy palette values into another specification."
  state_memory:
    owner: "docs/ARKIVE_STATE_MEMORY_SPEC.yaml"
    rule: >-
      Desktop, mobile, the portal, and every game use one semantic memory
      contract. Game applications declare owned records but never redefine
      storage tiers, precedence, retention, clearing, or migration.

ownership_and_change_routing:
  shared_site_shell: "Use the owners declared by global_shell."
  shared_ui_foundations: "docs/ARKIVE_UI_FOUNDATIONS_SPEC.yaml"
  shared_color_system: "docs/ARKIVE_SITE_COLOR_SYSTEM.yaml"
  home_page_composition: "frontend/apps/meta/src"
  game_route_configuration: "Each game application"
  rule: >-
    Change shared code first for cross-site behavior. Per-game code may provide
    content and configuration but must not override shared geometry, type,
    colors, icons, or interaction semantics.

localization_and_accessibility:
  localization:
    - "Brand copy uses the localized values in brand_identity."
    - "No shared user-visible string is hard-coded in a component."
    - "Every shared action ships for every locale supported by its host app."
  accessibility:
    - "Interactive elements use native buttons or links."
    - "Toggle state uses aria-pressed or aria-expanded."
    - "Keyboard focus uses the shared focus token."
    - "Text and state differences never rely on color alone."

maintenance:
  rules:
    - "Keep each rule in exactly one canonical specification."
    - "Reference an owning specification instead of copying its values."
    - "Update last_reviewed when a contract is intentionally reviewed."
    - "When implementation and a canonical rule disagree, resolve the mismatch rather than documenting both."

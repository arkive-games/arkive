schema_version: "2.0.0"
spec_id: "arkive.interactive-map.desktop-ui"
title: "Arkive Interactive Map Desktop UI Specification"
status: "canonical"
last_reviewed: "2026-08-08"

references:
  parent: "docs/ARKIVE_SITE_SPEC.yaml"
  color_system: "docs/ARKIVE_SITE_COLOR_SYSTEM.yaml"
  repository_contract: "CLAUDE.md"
  reading_rule: >-
    Read the parent site specification first. Read this file only for desktop
    interactive-map work, and read the color specification only when colors or
    themes are in scope.

purpose:
  summary: >-
    Define one reusable desktop layout and interaction contract for every
    Arkive game map. Games supply content, data, routes, languages, and artwork;
    they do not create another shell.
  outcomes:
    - "A new game can reuse the same navigation, sidebar, search, map controls, and marker details."
    - "A shared change is implemented once and reaches every map application."
    - "Humans and automated agents can locate the owning component without searching every game."

scope:
  included:
    - "Desktop interactive maps at the md breakpoint and above"
    - "Map shell, game sidebar, map selector, filters, search, controls, marker details, and site-info rail"
    - "Map-specific localization, accessibility, and verification"
  excluded:
    - "Phone and tablet redesign below the md breakpoint"
    - "Home-page composition and encyclopedia content layouts"
    - "Color values, global typography, and global icon policy owned by the parent specifications"
    - "Game data, tile generation, coordinate calibration, and backend behavior"

governance:
  shared_first_rule: >-
    A cross-game change belongs in map-shell or a shared primitive. If a shared
    owner does not exist, create it before adding a third implementation.
  per_game_override_rule: >-
    A game may override only the fields listed under game_owned. It may not
    change shared geometry, typography hierarchy, colors, icons, or interaction
    semantics.
  review_rule: >-
    Shared chrome must render consistently in every current map app unless an
    explicit exception is added to this file.

component_registry:
  root: "frontend/packages/map-shell/src"
  components:
    - name: "ShellLayout"
      file: "frontend/packages/map-shell/src/ShellLayout.tsx"
      owns: "Viewport layout and left, center, and optional right columns"
    - name: "ArkiveMapTopBar"
      file: "frontend/packages/map-shell/src/ArkiveMapTopBar.tsx"
      owns: "Shared brand block, top-nav composition, theme options, and login control"
      host_supplies: "Game routes, localized route labels, supported languages, and theme state adapter"
    - name: "ShellTopBar"
      file: "frontend/packages/map-shell/src/ShellTopBar.tsx"
      owns: "Navigation geometry, hover or focus dropdowns, and active-indicator routing"
    - name: "ShellSidebar"
      file: "frontend/packages/map-shell/src/ShellSidebar.tsx"
      owns: "Sidebar width, scrolling, collapse behavior, and collapse control"
    - name: "ShellGameHeader"
      file: "frontend/packages/map-shell/src/ShellGameHeader.tsx"
      owns: "Game-art header geometry and logo or title composition"
    - name: "ShellMapSelect"
      file: "frontend/packages/map-shell/src/ShellMapSelect.tsx"
      owns: "Map-picker geometry, selection, and clipped-label marquee"
    - name: "FilterPanel"
      file: "frontend/packages/map-shell/src/FilterPanel.tsx"
      owns: "Bulk controls, categories, visibility semantics, subtype states, and density"
    - name: "SearchPanel"
      file: "frontend/packages/map-shell/src/SearchPanel.tsx"
      owns: "Floating search geometry, full-field search, results, and selection callbacks"
    - name: "MarkerPopupCard"
      file: "frontend/packages/map-shell/src/MarkerPopupCard.tsx"
      owns: "Marker-detail hierarchy, coordinates, copy feedback, descriptions, images, and extension slot"
    - name: "SiteInfoPanel"
      file: "frontend/packages/map-shell/src/SiteInfoPanel.tsx"
      owns: "Optional site information and feedback rail"
  shared_style_owner: "frontend/packages/map-shell/src/arkive-map-theme.css"
  shared_primitives: "frontend/packages/ui/src"

game_owned:
  allowed:
    - "Game name and localized copy"
    - "Game logo and header artwork"
    - "Artwork focal position and legibility shade"
    - "Navigation labels, routes, dropdown information architecture, and language inventory"
    - "Maps, tiles, regions, coordinate transforms, and map void color"
    - "Marker taxonomy, icons, counts, descriptions, images, and detail extensions"
  forbidden:
    - "Alternative top-bar, sidebar, header, search, or popup geometry"
    - "Alternative shared font hierarchy or icon style"
    - "Replacement of Arkive semantic colors with a game palette"
    - "Different active, inactive, hover, copy, collapse, or visibility semantics"

layout:
  viewport:
    model: "Full viewport without document-level scrolling"
    root_classes: "flex h-dvh w-screen flex-col overflow-hidden"
    desktop_breakpoint: "md"
  top_bar:
    contract: "Use the global shell contract in docs/ARKIVE_SITE_SPEC.yaml."
    height: "3.5rem"
    horizontal_padding: "1rem"
  content_row:
    columns:
      - "Left game and filter sidebar"
      - "Flexible map canvas"
      - "Optional right site-info sidebar"
    overflow: "hidden"
    map_min_width: "0"
  left_sidebar:
    expanded_width: "20rem"
    collapsed_width: "0"
    transition_duration: "300ms"
    collapse_control:
      width: "2rem"
      height: "3rem"
      label_size: "text-xs"
      expanded_key: "collapse"
      collapsed_key: "expand"
  right_sidebar:
    role: "Optional site information and feedback"
    behavior: "Independently collapsible and visually subordinate to the map"

game_sidebar:
  game_header:
    minimum_height: "8rem"
    background_fit: "cover"
    content_padding: "1rem"
    logo_box_height: "3rem"
    game_line_margin_top: "0.5rem"
    game_line_size: "text-sm"
    game_name_weight: 700
    subtitle_weight: 600
    separator: "Middle dot rendered as its own span"
    rules:
      - "Use real game artwork, never a flat color or unrelated decoration."
      - "Keep the game logo readable and use identical header dimensions across games."
  map_selector:
    width: "Full sidebar content width"
    minimum_height: "2.75rem"
    title_size: "text-sm"
    value_size: "text-base"
    overflow: "Start a marquee on pointer hover only when the value is clipped."
    icon_rule: "Do not add a game-specific leading shape unless it conveys real meaning."
  bulk_controls:
    columns: 2
    gap: "0.5rem"
    minimum_height: "2.25rem"
    label_size: "text-xs"
    weight: 600
  categories:
    heading_size: "text-sm"
    heading_weight: 500
    minimum_height: "2.5rem"
    spacing: "Reference-dense but never cramped"
    disclosure: "Use the shared accordion chevron at the far right."
    visibility:
      all_or_partial_visible: "Eye"
      none_visible: "Eye off"
      rule: "The eye closes only when every subtype in the category is hidden."
  subtype_buttons:
    columns: 2
    minimum_height: "2.25rem"
    gap_x: "0.5rem"
    gap_y: "0.375rem"
    label_size: "text-xs"
    inactive: "Medium weight, muted foreground, 65 percent opacity, transparent border"
    active: "Semibold, full opacity, selected surface, subtle border, and amber inset indicator"
    overflow: "Start a marquee on pointer hover only when the label is clipped."

map_search:
  component: "SearchPanel"
  placement: "Top center of the map canvas, 0.75rem below the top edge"
  width:
    preferred: "Available map width minus 2rem"
    minimum: "18rem"
    maximum: "34rem"
    behavior: "Shrink with the map column before reaching the minimum."
  input_row:
    minimum_height: "3rem"
    radius: "radius-lg"
    surface: "Shared popover surface with backdrop blur"
    input_size: "text-sm"
    submit_size: "text-sm"
    scope: "Search every field configured by the game; never render a scope selector."
  placeholder_scope:
    - "Tasks"
    - "NPCs"
    - "Items"
    - "Map markers"
  results:
    count_size: "text-xs"
    title_size: "text-sm"
    title_weight: 600
    metadata_size: "text-xs"
    empty_description: "The localized no-description label is permitted in search results only."

marker_details:
  component: "MarkerPopupCard"
  width: "20rem"
  radius: "radius-xl"
  top_accent: "0.25rem using the shared navigation-accent token"
  header:
    icon_box: "2.5rem square"
    title_size: "text-base"
    title_weight: 700
    metadata_size: "text-xs"
  coordinates:
    value_font: "Shared monospace stack"
    value_weight: 600
    display: "Use the exact localized value supplied by the game."
    copy:
      enabled: true
      copied_value: "Exactly the visible coordinate string"
      states:
        idle: "Copy icon"
        success: "Check icon and localized success label for 2000ms"
        failure: "Alert-circle icon and localized failure label for 2000ms"
      transport: "navigator.clipboard.writeText on secure origins"
  description:
    size: "text-sm"
    line_height: "leading-relaxed"
    empty_behavior: "Render neither a row nor placeholder text."
  images:
    columns: 2
    aspect_ratio: "4:3"
    radius: "radius-lg"
  extensions: >-
    Rewards, completion controls, entity links, and other game content use the
    shared children slot. They may not replace the shared header, coordinate,
    description, or image structure.

interaction_contracts:
  individual_filter: "Active combines strong text, full opacity, tint, border, and amber indicator; inactive is lighter and muted."
  category_visibility: "Eye off appears only when every subtype is hidden."
  sidebar_collapse: "Use localized collapse or expand labels and the shared chevron."
  marker_selection: "Open MarkerPopupCard through the map-engine shared popup path."
  engine_consistency: "Leaflet and WebGL render the same popup content and states."
  arbitrary_coordinate_copy: "Desktop secondary click opens the shared copy-position menu."
  nav_dropdown: "Pointer hover or keyboard focus opens; no visible dropdown chevron."
  overflow_text: "Start a marquee only when clipping is detected."

localization_and_accessibility:
  localization:
    - "No shared user-visible string is hard-coded."
    - "A shared action ships in every locale supported by its host game."
    - "Copy success and failure states have localized visible and accessible labels."
  accessibility:
    - "Use native buttons and links."
    - "Icon-only controls have accessible labels."
    - "Toggles expose aria-pressed or aria-expanded."
    - "Copy feedback uses an aria-live polite status."
    - "Dropdowns work with keyboard focus and Escape."
    - "State differences never rely on color alone."

new_game_checklist:
  required_composition:
    - "ShellLayout"
    - "ArkiveMapTopBar"
    - "ShellSidebar"
    - "ShellGameHeader"
    - "ShellMapSelect"
    - "FilterPanel"
    - "SearchPanel"
    - "MarkerPopupCard"
    - "SiteInfoPanel when site information is available"
  required_configuration:
    - "Game id, localized name, logo, and header artwork"
    - "Navigation routes and supported languages"
    - "Map metadata, selector labels, filters, and marker icons"
    - "Coordinate display transform and marker popup extensions"
  forbidden_shortcuts:
    - "Copying a shared component into a game app"
    - "Adding another popup or icon implementation"
    - "Changing shared colors or font sizes to match game artwork"

verification:
  viewports:
    standard_desktop: "1440x900"
    narrow_desktop: "780x700"
  themes:
    - "light"
    - "dark"
  current_map_apps:
    - "aion2"
    - "palworld"
    - "sts2"
    - "vrising"
  rule: "Verify every affected map app; shared engine work must cover at least one Leaflet and one WebGL consumer."
  interaction_checks:
    - "The Arkive home link remains visible on narrow desktop."
    - "The active nav indicator follows hover and returns to the active route."
    - "Sidebar scrolling reaches the final category."
    - "Search shrinks to 18rem, has no scope selector, and still returns results."
    - "Filter, popup, copy, and no-description states match across games and engines."
  automated_checks:
    - "Run focused map-shell tests while editing."
    - "Type-check and build every affected app."
    - "Run the complete frontend test suite once before handoff."

ai_change_protocol:
  - "Read the parent site specification, then classify the request as shared or game-owned."
  - "Inspect the owning component in component_registry before editing an app."
  - "Change shared code first and avoid mirrored app-local rules."
  - "Do not introduce mobile work unless the user expands the scope."
  - "Update this file only when the map contract or component ownership changes."

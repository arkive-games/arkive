schema_version: "3.0.0"
spec_id: "arkive.interactive-map.desktop-ui"
title: "Arkive Interactive Map Desktop UI Specification"
status: "canonical"
last_reviewed: "2026-08-12"

references:
  parent: "docs/ARKIVE_SITE_SPEC.yaml"
  ui_foundations: "docs/ARKIVE_UI_FOUNDATIONS_SPEC.yaml"
  color_system: "docs/ARKIVE_SITE_COLOR_SYSTEM.yaml"
  state_memory: "docs/ARKIVE_STATE_MEMORY_SPEC.yaml"
  repository_contract: "CLAUDE.md"
  reading_rule: >-
    Read the parent and UI-foundations specifications first. Read this file
    only for interactive-map composition and behavior at md and above.

purpose:
  summary: >-
    Define one reusable desktop map workspace. Games supply content, routes,
    data, localization, and artwork; they do not create another shell.
  outcomes:
    - "A new map reuses navigation, sidebars, search, controls, and marker details."
    - "A shared change is implemented once for every map and rendering engine."
    - "Each map surface has one discoverable owner."

scope:
  included:
    - "Interactive maps at md and above"
    - "Map shell, game sidebar, map selector, filters, search, controls, marker details, and optional information rail"
    - "Map-specific localization, accessibility, state memory, and verification"
  excluded:
    - "Below-md composition owned by the mobile specification"
    - "Portal and encyclopedia page layouts"
    - "Global framework, typography, spacing, shape, color, and motion foundations"
    - "Game data, tile generation, coordinate calibration, and backend behavior"

governance:
  shared_first: "A cross-game change belongs in map-shell or a shared primitive."
  promotion: "Create a shared owner before a third implementation of the same map pattern."
  override: "A game may override only values listed under game_owned."
  consistency: "All registered map applications use the same geometry and interaction semantics unless this file records an exception."

component_registry:
  root: "frontend/packages/map-shell/src"
  components:
    ShellLayout:
      file: "frontend/packages/map-shell/src/ShellLayout.tsx"
      owns: "Viewport layout and left, center, and optional right columns"
    ArkiveMapTopBar:
      file: "frontend/packages/map-shell/src/ArkiveMapTopBar.tsx"
      owns: "Brand, top navigation, language, theme, and account composition"
      host_supplies: "Routes, localized labels, supported languages, and adapters"
    ShellTopBar:
      file: "frontend/packages/map-shell/src/ShellTopBar.tsx"
      owns: "Navigation geometry, dropdown behavior, and active indicator"
    ShellSidebar:
      file: "frontend/packages/map-shell/src/ShellSidebar.tsx"
      owns: "Sidebar geometry, scroll, collapse, and collapse control"
    ShellGameHeader:
      file: "frontend/packages/map-shell/src/ShellGameHeader.tsx"
      owns: "Game artwork and logo composition"
    ShellMapSelect:
      file: "frontend/packages/map-shell/src/ShellMapSelect.tsx"
      owns: "Map selection and clipped-label handling"
    FilterPanel:
      file: "frontend/packages/map-shell/src/FilterPanel.tsx"
      owns: "Bulk controls, categories, subtype visibility, and density"
    SearchPanel:
      file: "frontend/packages/map-shell/src/SearchPanel.tsx"
      owns: "Search input, results, geometry, and selection callbacks"
    MarkerDetailDrawer:
      file: "frontend/packages/map-shell/src/MarkerDetailDrawer.tsx"
      owns: "Responsive marker-detail geometry, identity, tabs, scrolling, disclosures, gallery, comments, and contextual footer"
    MarkerPopupCard:
      file: "frontend/packages/map-shell/src/MarkerPopupCard.tsx"
      owns: "Legacy compact marker popup during per-game migration to MarkerDetailDrawer"
    SiteInfoPanel:
      file: "frontend/packages/map-shell/src/SiteInfoPanel.tsx"
      owns: "Optional site information and feedback rail"
  style_owner: "frontend/packages/map-shell/src/arkive-map-theme.css"
  primitives: "frontend/packages/ui/src"

game_owned:
  allowed:
    - "Localized game name and copy"
    - "Game logo, header artwork, focal position, and legibility shade"
    - "Navigation labels, routes, dropdown information architecture, and supported languages"
    - "Maps, tiles, regions, transforms, and map void color"
    - "Marker taxonomy, artwork, counts, descriptions, images, and detail extensions"
  forbidden:
    - "Alternative shared top bar, sidebar, search, filter, or marker-detail geometry"
    - "Alternative shared typography, radius, icon, motion, or color system"
    - "Different active, inactive, hover, copy, collapse, or visibility semantics"

desktop_workspace:
  viewport:
    model: "Full available viewport with no document-level scrolling"
    height: "Use dvh from the UI-foundations specification."
  footer:
    page_footer: "Omit it from the full-screen map workspace."
    status_overlay: "Show coordinates and essential map status only; do not show filing records or legal text."
    filing_record: >-
      The record moves to the About panel, which every map route already has.
      It must never be absent from a site: a map workspace has no page footer,
      and for palworld the map is the root route, so removing it from the status
      overlay without that replacement would leave the landing page with none.
  top_bar:
    contract: "Use the parent global-shell contract and shared header height."
    padding: "Use desktop page gutter from the UI-foundations specification."
  content_row:
    columns:
      - "Left game and filter sidebar"
      - "Flexible map canvas"
      - "Optional right information rail"
    map_min_width: "0"
    overflow: "hidden"
  left_sidebar:
    expanded_width: "20rem"
    collapsed_width: "0"
    transition: "Use panel motion from the UI-foundations specification."
    collapse_control:
      width: "2rem"
      height: "3rem"
      label_role: "metadata"
      labels: "Localized collapse and expand"
  right_rail:
    role: "Optional site information and feedback"
    behavior: "Independently collapsible and visually subordinate to the map"
    narrow_rule: "Hide or collapse before reducing the map below its usable width."

game_sidebar:
  game_header:
    minimum_height: "8rem"
    background_fit: "cover"
    content_padding: "Use space-4 from the UI-foundations specification."
    logo_box_height: "3rem"
    game_line_gap: "Use space-2."
    game_line_role: "dense_body"
    game_name_weight: 700
    subtitle_weight: 600
    separator: "At most one middle dot rendered as its own span"
    rules:
      - "Use real game artwork, never a flat decorative replacement."
      - "Keep logo and title readable in identical shared geometry across games."
  map_selector:
    width: "Full sidebar content width"
    minimum_height: "Use touch_target_standard from the UI-foundations specification."
    title_role: "dense_body"
    value_role: "subsection_title"
    overflow: "Wrap when possible; otherwise reveal the complete clipped value on focus or pointer hover."
  bulk_controls:
    columns: 2
    gap: "Use space-2."
    minimum_height: "Use desktop_compact_height."
    label_role: "metadata"
  categories:
    heading_role: "dense_body"
    heading_weight: 500
    minimum_height: "2.5rem"
    disclosure: "Use the shared chevron at the far edge."
    visibility:
      some_or_all_visible: "Eye"
      none_visible: "Eye off"
      rule: "Eye off appears only when every subtype is hidden."
  subtype_controls:
    columns: 2
    minimum_height: "Use desktop_compact_height."
    gap: "Use space-2 horizontally and space-1 vertically."
    label_role: "metadata"
    inactive: "Medium weight, muted foreground, reduced emphasis, transparent border"
    active: "Semibold, full opacity, selected surface, border, and amber inset indicator"
    overflow: >-
      Wrap onto as many lines as the label needs. minimum_height is a minimum and a
      chip may exceed it; chips in one grid row stay equal height. This replaced
      "reveal on focus or pointer hover without moving the surrounding layout", which
      required a pointer the phone does not have -- so on touch the clipped remainder
      was unreachable, and the animated variant of it failed WCAG 2.2.2. Holding the
      layout still was the constraint that made the control inaccessible, so it is the
      one that gave way.

map_search:
  component: "SearchPanel"
  placement: "Top center of the map canvas, space-3 below the edge"
  width:
    preferred: "Available map width minus space-8"
    minimum: "18rem"
    maximum: "34rem"
    behavior: "Shrink with the map column until the minimum, then preserve canvas usability by collapsing optional rails."
  input_row:
    minimum_height: "Use isolated_map_target."
    radius: "Use standard_radius."
    surface: "Shared popover token with an opaque fallback"
    input_role: "control_label"
    submit_role: "control_label"
    scope: "Search every game-configured field; do not render a scope selector."
  results:
    count_role: "metadata"
    title_role: "dense_body"
    title_weight: 600
    metadata_role: "metadata"
    empty_description: "The localized no-description label is allowed only in search results."

marker_detail:
  component: "MarkerDetailDrawer"
  surface:
    desktop: "A right-side drawer, 29rem maximum width, inset by space-4 from the map's top and right edges."
    mobile: "A full-width bottom sheet approximately 78dvh high, capped at 46rem, leaving selected-marker map context visible."
    radius: "Use standard_radius; mobile rounds only the top corners."
    overflow: "The outer surface clips overflow and never scrolls."
    elevation: "Use the shared elevated-surface shadow without obscuring the remaining map."
  regions:
    - "Fixed identity header with close action and coordinate copy"
    - "Fixed Details and Comments tab list"
    - "One focusable, independently scrollable middle viewport"
    - "Fixed contextual footer"
  scrolling:
    owner: "Only the middle content viewport."
    input: "Preserve wheel, touch, trackpad, and keyboard scrolling."
    scrollbar: "Visually hide both the track and thumb without disabling scrolling."
    overscroll: "Contain within the detail surface."
  radius: "Use standard_radius."
  accent: "Use navigation plus shape, never color alone."
  identity:
    icon_box: "2.5rem square"
    # The role supplies the SIZE (text-base); title_weight deliberately overrides the
    # role's default weight of 600, because a popup title is the only heading in a
    # surface that has no page context around it to establish hierarchy. Stated
    # explicitly because the pair read as a contradiction otherwise, and the code
    # followed the role rather than the override.
    title_role: "subsection_title"
    title_weight: 700
    metadata_role: "metadata"
  coordinates:
    role: "coordinate_or_id"
    display: "Use the exact localized value supplied by the game."
    copy:
      copied_value: "Exactly the visible coordinate string"
      idle: "Copy icon"
      success: "Check icon and localized success label for 2000ms"
      failure: "Alert icon and localized failure label for 2000ms"
      transport: "navigator.clipboard.writeText on secure origins"
  description:
    role: "dense_body"
    line_height: "relaxed"
    disclosure: "Use the shared upper-right chevron disclosure, expanded by default."
    empty: "Omit the entire section, including heading and separators."
  data_driven_sections:
    rule: "Omit every section whose backing data is absent; never render empty headings, placeholder copy, or orphan separators."
    disclosures: "Description, game-owned drops, and player images use the same upper-right Tabler chevron control and accessibility semantics."
  gallery:
    ownership: "Each image belongs to a marker and carries an explicit moderation status."
    moderation_states: ["uploading", "processing", "awaiting-review", "published", "rejected", "failed"]
    columns: "Two by default; one at 350px and below."
    upload: "A marker-gallery upload is distinct from comment attachments and is capped at three selected files."
  comments:
    capabilities: ["optional images", "likes", "replies", "popular sorting", "latest sorting"]
    attachments: "Each attachment belongs only to its comment and carries a comment id, never marker-gallery ownership."
    composer: "Lives in the comments footer and accepts up to three image attachments."
  footer:
    details: "Show only the persistent Mark as completed action when the marker supports completion."
    comments: "Show the comment composer only when the host supplies a submission adapter."
  narrow_behavior:
    at_350px: "Hide drop probability before item name or quantity, use a one-column gallery, and keep footer commands on one row."
  extensions: >-
    Games supply structured sections such as Palworld drops, rewards, and links
    without replacing shared identity, coordinate, disclosure, gallery,
    comment, scrolling, or footer behavior.

interaction_contracts:
  individual_filter: "Active combines text, opacity, surface, border, and indicator; inactive is visibly quieter."
  category_visibility: "Eye off appears only when all child subtypes are hidden."
  sidebar_collapse: "Use localized labels and the shared chevron."
  marker_selection: "Keep map-engine selection and highlighting as the source of truth, then open MarkerDetailDrawer above the map canvas."
  engine_consistency: "Leaflet and WebGL expose the same content, controls, and states."
  coordinate_copy: "Desktop secondary click opens the shared copy-position menu."
  navigation_dropdown: "Pointer hover or keyboard focus opens; no decorative dropdown chevron."
  overflow_text: "Reveal complete clipped content only when clipping is detected."
  memory: "Use the map classifications and restore behavior from the state-memory specification."

localization_and_accessibility:
  localization:
    - "No shared visible string is hard-coded."
    - "Every shared action ships for every locale supported by the host game."
    - "Copy success and failure have localized visible and accessible labels."
  map_specific_accessibility:
    - "Keyboard users can reach the map selector, filters, search, controls, markers, detail tabs, scroll viewport, disclosures, and actions."
    - "Dropdowns open on focus and close with Escape."
    - "Copy feedback uses an aria-live polite status."
    - "Both engines expose equivalent accessible names and selected states."
    - "State does not rely on marker or control color alone."

new_map_contract:
  - "Use every required owner in component_registry; optional SiteInfoPanel may be omitted."
  - "Provide game-owned configuration without copying shared source."
  - "Configure localized routes, languages, map data, filters, icons, coordinate display, and popup extensions."
  - "Verify at least one Leaflet and one WebGL consumer for shared engine changes."

verification:
  viewports:
    standard: "1440x900"
    narrow: "780x700"
  themes:
    - "light"
    - "dark"
  application_scope: >-
    Verify against every app that mounts ShellLayout: aion2, palworld, vrising. There
    is no registry to discover them from -- the previous wording deferred to one that
    does not exist, which made the scope unverifiable. `git grep -l ShellLayout` is
    the check; update this list when an app gains or loses a map. (The list this
    replaced also named sts2, which has no map.)
  interaction_checks:
    - "Arkive home remains reachable on narrow desktop."
    - "Active navigation returns after hover or focus leaves."
    - "Sidebar scrolling reaches the final category."
    - "Search preserves its minimum width and returns results without a scope selector."
    - "Filter, popup, copy, empty-description, and memory states match across engines."
    - "Optional rails collapse before the map becomes unusable."
  automated:
    - "Run focused map-shell and engine tests."
    - "Type-check and build every affected registered map application."
    - "Run the complete frontend suite once before handoff."

migration_from_2_0:
  - "Read typography, spacing, shape, header height, control size, and motion from the UI-foundations specification."
  - "Replace radius-lg and radius-xl map surfaces with standard_radius."
  - "Replace the handwritten current-game list with registered-app discovery."
  - "Use the state-memory specification for map restoration instead of repeating persistence behavior."

maintenance:
  rules:
    - "This file owns only desktop map composition and interaction."
    - "Component registry paths are authoritative and update with ownership changes."
    - "Do not copy global foundation or color values into this file."
    - "Update last_reviewed when the desktop map contract is intentionally reviewed."

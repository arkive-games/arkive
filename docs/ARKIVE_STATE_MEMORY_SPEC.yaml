schema_version: "2.0.0"
spec_id: "arkive.state-memory"
title: "Arkive State Memory Specification"
status: "canonical"
last_reviewed: "2026-08-10"

references:
  parent: "docs/ARKIVE_SITE_SPEC.yaml"
  mobile_experience: "docs/ARKIVE_MOBILE_EXPERIENCE_SPEC.yaml"
  repository_contract: "CLAUDE.md"
  reading_rule: >-
    Read the parent site specification first. Read this file whenever a task
    creates, restores, synchronizes, expires, clears, or migrates user-facing
    state. Viewport-specific layout remains owned by the mobile or desktop
    specialist specification.

purpose:
  summary: >-
    Define one understandable memory contract for the portal, every game, and
    every viewport so users can resume meaningful work without inheriting stale
    interface state.
  outcomes:
    - "The same user intent is classified the same way in every current and future game."
    - "State meaning, storage location, identity scope, and viewport scope are separate decisions."
    - "Every remembered value has a clear lifetime, validation rule, and user-controlled reset."
    - "Credentials, secrets, payment data, and other prohibited data never enter the state-memory system."

scope:
  included:
    - "Portal discovery and recent activity"
    - "Game maps, encyclopedias, catalogs, detail pages, databases, and tools"
    - "Drafts, favorites, collections, completion, and other user-owned progress"
    - "Current and future desktop and mobile web experiences"
  excluded:
    - "Credentials, authorization tokens, passwords, one-time codes, payment data, and file bytes"
    - "Server caches, extracted game data, build artifacts, analytics, and telemetry"
    - "Native application state that never enters the web experience"

decision_model:
  rule: >-
    Classify why a value is remembered before choosing where it is stored. A
    state class describes user intent and lifetime; a persistence scope
    describes transport and ownership. They are not interchangeable.
  classification_order:
    - question: "Must another person be able to open the same state?"
      result: "shareable_route"
    - question: "Is it user-owned progress expected to survive devices and upgrades?"
      result: "durable_progress"
    - question: "Is it unfinished authored or calculation work that is costly to recreate?"
      result: "task_draft"
    - question: "Does it help the user return to a recently visited place or view?"
      result: "recent_activity"
    - question: "Is it a deliberate, repeatable way the user wants the interface to behave?"
      result: "user_preference"
    - question: "Is it useful only while completing the current browsing task?"
      result: "session_context"
    - question: "Is it only an open, hover, focus, loading, or temporary visual state?"
      result: "transient_ui; do not persist"
  rules:
    - "Default to no persistence when the correct class is unclear."
    - "One record has one state class. Split a composite value when its fields need different lifetimes or clearing behavior."
    - "Classify each representation of a domain object separately: a saved build may be durable progress while its exported share link is shareable route state."
    - "Do not classify a value as a preference merely because it currently lives in localStorage."
    - "Do not promote session context to a durable preference without an explicit product decision."

state_classes:
  shareable_route:
    meaning: "State whose meaning belongs in a link."
    examples:
      - "Selected game, map, entity, tool target, or detail record"
      - "A deliberate search, filter set, or calculator configuration exposed through Share"
    retention: "As long as the route contract remains valid"
    normal_scope: "url"
    clear: "Remove the relevant path or query value"
    exclusions:
      - "Private drafts"
      - "Unsettled camera movement or scroll position"
  session_context:
    meaning: "State needed to continue the current browsing task."
    examples:
      - "Catalog query, facets, page, incremental reveal depth, and scroll position"
      - "The list context behind a detail page"
      - "An active picker query or temporary map search"
    retention: "Until the tab closes or validation_migration_and_limits.defaults.session_expiry_hours elapses, whichever happens first"
    normal_scope: "history first, then tab storage when multiple history entries share the context"
    clear: "Clear with the active task, result scope, or owning tab"
    exclusions:
      - "A permanent default filter"
      - "State another user must receive through a link"
  user_preference:
    meaning: "A deliberate and repeatable interface choice."
    examples:
      - "Language, theme, sort direction, grid or list mode, and map display toggles"
      - "Desktop sidebar density and an explicitly offered mobile disclosure default by entity type"
    retention: "Until reset, replaced, or migrated"
    normal_scope: "device; account only when the product explicitly promises cross-device preference sync"
    clear: "Reset the owning control or reset interface preferences"
    exclusions:
      - "Search queries, catalog facets, selected entities, and incidental navigation"
      - "Open sheets, dialogs, menus, or popovers"
  task_draft:
    meaning: "Unfinished authored or calculation work that is costly to recreate."
    examples:
      - "Replies, feedback, profile edits, and other explicitly supported drafts not yet submitted"
      - "Loadouts, builds, breeding chains, route plans, comparisons, and calculator inputs"
    retention: "Local drafts use validation_migration_and_limits.defaults.local_draft_expiry_days; account drafts follow the owning product policy"
    normal_scope: "device for anonymous users; account when authenticated and supported"
    clear: "Confirmed submission, explicit Discard, Clear, or New calculation"
    rules:
      - "Clear after submission only when the server confirms success."
      - "Partition by account and destination."
      - "Declare an allowlist of persisted fields. Identity, security, contact, payment, upload, and file fields are never inferred from a whole form object."
      - "Show one quiet saved-state label only when losing the draft would be consequential."
  recent_activity:
    meaning: "A bounded history used to return to meaningful work."
    examples:
      - "Recent game destinations shown by Continue exploring"
      - "Last map and per-map camera needed to resume exploration"
    retention: "Use validation_migration_and_limits.defaults.recent_activity_expiry_days"
    normal_scope: "device; account only when cross-device history is an explicit feature"
    clear: "Clear recent activity or remove one history entry"
    rules:
      - "Enforce validation_migration_and_limits.defaults.portal_recent_destination_limit and deduplicate by canonical destination id."
      - "Do not present popularity or recommendations as personal history."
      - "Do not treat recent activity as progress."
      - "Save a settled, debounced map camera for resumption; do not treat every movement event as history."
  durable_progress:
    meaning: "User-owned records expected to survive sessions, devices, and product upgrades."
    examples:
      - "Favorites, completed markers, defeated bosses, collections, saved builds, and followed content"
    retention: "Until the user removes it or the owning record is retired"
    normal_scope: "account; validated device fallback for anonymous or offline use"
    clear: "Use the domain action, with separate confirmation for destructive bulk reset"
    rules:
      - "Use stable game-facing ids, never array positions or rendered labels."
      - "Declare a merge strategy; never silently replace newer or larger progress with stale data."
  transient_ui:
    meaning: "Short-lived interface state that always starts clean."
    examples:
      - "Open sheets, dialogs, popovers, menus, and language drill-down panes"
      - "Hover, focus, pressed state, loading, errors, toasts, and destructive confirmations"
      - "Hovered markers, temporary highlights, cursor coordinates, and popup scroll positions"
    retention: "None"
    normal_scope: "component memory only"
    clear: "Close, navigate, reload, or cross an incompatible breakpoint"
    rule: "Transient UI is not a registered memory record and is never persisted or synchronized."

persistence_scopes:
  url:
    use_for: "Shareable state and explicit state supplied for the current visit"
    rules:
      - "Keep URLs concise and omit defaults."
      - "Never place private, sensitive, or oversized values in a URL."
  history:
    use_for: "Back and Forward restoration for one route entry"
    rules:
      - "Preserve router-owned history fields."
      - "Do not copy history state into durable storage automatically."
  tab:
    use_for: "Session context that spans route entries inside one tab"
    implementation: "Validated sessionStorage envelope"
  device:
    use_for: "Anonymous fallback, device preferences, local drafts, and recent activity"
    implementation: "Validated localStorage envelope through the shared adapter"
  account:
    use_for: "Cross-device progress and explicitly supported account drafts or preferences"
    rules:
      - "The account service is canonical only for records that declare account scope."
      - "Account support is not complete until server read, write, conflict handling, and logout behavior are implemented."
  rules:
    - "Every record declares one canonical scope and only the fallbacks it actually supports."
    - "Do not read every scope for every record."
    - "Do not use localStorage, document.domain, or broad postMessage listeners as cross-subdomain transport. Use the account service, or a separately reviewed first-party storage broker with an exact origin allowlist and typed message protocol."
    - "Unavailable storage degrades to current component or session state without repeated errors."

identity_and_viewport_scope:
  shared_between_desktop_and_mobile:
    - "Selected entity or map, semantic sort meaning, drafts, recent activity, favorites, and progress"
    - "Session query and filters while the same tab crosses the breakpoint"
  viewport_scoped:
    - "A presentation mode that does not have the same meaning on both viewports"
    - "Mobile detail disclosure when desktop always renders complete sections"
    - "Presentation density explicitly offered as a preference"
  never_transfer:
    - "Open mobile sheets or desktop dropdowns"
    - "Scroll offsets between layouts with different content geometry"
  account_partitioning:
    - "Account drafts and browser snapshots use a stable opaque account id."
    - "Anonymous records use an explicit anonymous partition, not an empty account id."
    - "Switching accounts must never expose another account's browser snapshot."
  sign_in_adoption:
    rule: "Every account-capable record declares one adoption strategy before anonymous data can enter an account."
    strategies:
      keep_anonymous: "Leave the anonymous record on the device and start the account record from its canonical source."
      confirm_merge: "Show one explicit merge choice before attaching anonymous data to the account."
      automatic_union: "Allowed only for non-sensitive additive progress with an idempotent union strategy declared by the record."
    restrictions:
      - "Private drafts and recent activity never attach to an account automatically."
      - "A rejected or failed adoption leaves both sources unchanged."
  sign_out_and_deletion:
    - "Sign-out and account switching remove every browser record in the departing account partition, including drafts, snapshots, preferences, recent activity, and offline progress."
    - "Successful account deletion removes every browser record in that account partition before the anonymous experience resumes."
    - "Anonymous records and non-account device preferences remain separate and are not deleted by account sign-out."
  breakpoint_rule: "Close transient overlays and preserve semantic task state when crossing a breakpoint."

restore_and_conflict_rules:
  restore_order:
    - "Valid explicit URL state, when the record supports URL input"
    - "Valid state on the current history entry"
    - "The record's declared canonical persisted scope"
    - "Only the declared fallback scope"
    - "Product default"
  rules:
    - "A source participates only when the record declares it; this is not a universal read from every store."
    - "Records restore atomically by default. Field-level fallback is allowed only when the record declares a validated merge function and compatible field ownership."
    - "An explicit URL overrides the current visit but never rewrites a personal preference or progress record until the user changes that value."
    - "Validate data version and value shape before a restored value reaches the component."
    - "A failed restore never blocks navigation or leaves the page blank."
  synchronization:
    user_preference: "Device is canonical by default. Account sync requires an explicit product promise and conflict rule."
    task_draft: "For account drafts, compare server-issued revisions or server timestamps; device clocks never decide a cross-device conflict. For local-only drafts, choose the newest valid local revision."
    recent_activity: "Merge by canonical destination id, keep the newest timestamp, then enforce the count and age limits."
    durable_progress: "Declare union, latest-revision, server-authoritative, or another domain-specific strategy per record."
    cross_tab: "Synchronize compatible device records without write loops; session and transient state remain tab-local."

surface_contracts:
  portal:
    recent_activity:
      - "Store the canonical destination id, game, route, and timestamp. Resolve the current localized title and progress summary from current data; a cached title is fallback text only."
      - "Continue exploring uses the newest valid record inside the configured recent-activity retention."
      - "Do not show unavailable destinations."
  catalogs_and_databases:
    session_context:
      - "Query, facets, page, incremental reveal depth, scroll position, and list-to-detail return context"
    user_preference:
      - "Sort direction, grid or list mode, and explicitly offered density"
    clear_action: >-
      Clear filters resets query, facets, page, and the active result scope. It
      does not reset sort or presentation preferences unless the label says so.
    rule: "A filter is not durable merely because the user clicked it."
  detail_pages:
    shareable_route: "The selected entity belongs in the route."
    session_context:
      - "Restore reading position only when returning to the same entry in the same task."
      - "Ordinary expand and collapse actions remain in the current task."
    user_preference: "Persist disclosure by entity type and section id only when the product exposes an explicit Remember disclosure choice."
    desktop_rule: "Stored mobile disclosure never hides desktop content."
  maps:
    shareable_route:
      - "Selected map and marker when they are linkable"
    recent_activity:
      - "Last map and per-map camera for resuming exploration"
    user_preference:
      - "Deliberate label or boundary toggles, renderer choice where exposed, and desktop sidebar density"
    session_context:
      - "Content layer and category filters, active search, and a selected marker that has no route representation"
    saved_default_exception: "Content layers become a preference only through an explicit Save as default action."
    durable_progress:
      - "Completion and collection progress"
    excluded:
      - "Open search or filter sheet, hovered marker, cursor coordinates, temporary highlight, and popup scroll position"
  tools_and_calculators:
    task_draft:
      - "Mode, target entities, selections, numeric inputs, and route needed to resume the calculation"
    shareable_route: "Create an explicit Share action when another user can meaningfully reuse the configuration."
    clear_action: "Clear or New calculation removes the whole draft and returns to defaults."
    exclusion: "Picker search text is session context, not part of the durable draft."
    result_rule: "Recompute derived results from validated inputs and current data. Cache an expensive result separately only when it declares a data-version dependency and invalidation rule."
  forms_and_editors:
    task_draft:
      - "Replies, feedback, profile edits, and other multi-field authored content when the owning product explicitly supports drafts"
    rules:
      - "Clear only after confirmed submission or explicit discard."
      - "Never persist passwords, one-time codes, access tokens, payment data, or file bytes."
      - "Persist only fields explicitly allowlisted by the record; never serialize an entire form object."
    forum_composer_exception:
      persistence: "Forum post composer content is session-only and is never written to local or account storage."
      exit: "When the composer contains unpublished changes, every route exit requires explicit confirmation before discarding them."
      submission: "A refused submission keeps the composer mounted and unchanged; a confirmed submission clears the exit guard before closing it."
  account_and_progress:
    durable_progress:
      - "Favorites, follows, completion, collections, and saved builds"
    user_preference:
      - "Notification preferences and other account-synchronized settings"
    logout: >-
      Apply identity_and_viewport_scope.sign_out_and_deletion. Server-owned data
      remains on the account service after sign-out.

global_clear_controls:
  rule: "Use the clear action owned by each state class; labels must describe the exact scope removed."
  availability: "Local-data controls are available to anonymous and authenticated users; they are not hidden behind account creation."
  device_settings:
    - "Clear recent activity on this device"
    - "Clear drafts on this device"
    - "Reset interface preferences on this device"
    - "Clear all Arkive data on this device behind one destructive confirmation"
  account_settings:
    - "Clear synchronized recent activity on all devices, only when that feature exists"
    - "Clear synchronized drafts on all devices, only when account drafts exist"
    - "Reset synchronized interface preferences on all devices, only when preference sync exists"
    - "Reset synchronized game progress behind a separate destructive confirmation"
  feedback: "Confirm an explicit destructive bulk clear once. Automatic expiry and invalid-data cleanup stay silent."

shared_implementation_contract:
  owner: "frontend/packages/state-memory"
  rule: >-
    New persistence flows through the shared package. Applications declare
    typed records and do not call localStorage or sessionStorage directly,
    except for separately owned authentication, language, and theme adapters.
    Language and theme adapters still register their records and conform to
    validation, retention, migration, and clear behavior in this specification.
  record_definition:
    required_fields:
      - "id"
      - "namespace"
      - "surface"
      - "stateClass"
      - "schemaVersion"
      - "canonicalScope"
      - "defaultValue"
      - "validate"
      - "retention"
      - "clearAction"
      - "migrate"
    optional_fields:
      - "fallbackScope"
      - "viewportScope"
      - "partition"
      - "dataVersion"
      - "merge"
      - "signInAdoption"
      - "maximumBytes"
  key_contract:
    format: "arkive.memory.<namespace>.<surface>.<record>[.<scope-segments>]"
    segment_format: "Static segments use lowercase ASCII [a-z0-9-]+. Dynamic partitions use the shared opaque-segment encoder and never raw user text."
    rule: >-
      Keep the storage key stable across schema updates. Store schemaVersion in
      the envelope so the current key can be migrated in place. Use explicit
      legacy keys only for pre-contract formats.
  envelope:
    required_fields:
      - "schemaVersion"
      - "writtenAt"
      - "value"
    optional_fields:
      - "revision"
      - "dataVersion"
    conditional_fields:
      expiresAt: "Required for every time-limited record."
      revision: "Required for every account-synchronized record and issued by the server."
  lifecycle:
    - "Restore once before the owning interactive surface becomes usable."
    - "Debounce map movement, sliders, text drafts, and other high-frequency writes."
    - "Flush consequential drafts when the document becomes hidden and on pagehide; component unmount is best effort only and never the sole flush path."
    - "Automatic saving is quiet; do not toast every write."
    - "Show a saved-state label only after the adapter confirms the write; remove or downgrade the label after a write failure."
  inventory_rule: >-
    The current record inventory belongs in typed application declarations or
    a generated registry. Do not duplicate an app-by-app inventory in this
    canonical policy file because handwritten copies drift.

validation_migration_and_limits:
  defaults:
    maximum_record_bytes: 100000
    maximum_namespace_bytes: 3000000
    session_expiry_hours: 24
    local_draft_expiry_days: 30
    recent_activity_expiry_days: 30
    portal_recent_destination_limit: 10
  rules:
    - "Parse stored values as unknown and validate before use."
    - "Bound arrays, strings, and object depth before writing and restoring."
    - "Migrate known older schemas explicitly and discard unknown future or incompatible schemas."
    - "Remove ids absent from the current game-data version while preserving valid siblings."
    - "Delete malformed, expired, oversized, and incompatible records silently."
    - "A record may override a default limit only with a documented product reason."
    - "Measure limits from the UTF-8 byte length of the serialized envelope."
    - "Enforce the namespace budget before writing. On quota failure, preserve usable in-memory state, report failure to the caller once, and never evict drafts or progress implicitly."

privacy_and_security:
  rules:
    - "Treat drafts, recent activity, and account snapshots as private data."
    - "Never record memory values in analytics, console logs, error messages, or URLs unless the record is explicitly shareable."
    - "Never use a rendered label, email address, or other personal text as a storage-key segment."
    - "Respect browser storage restrictions and private browsing without prompting the user to weaken them."
    - "Account-bound browser records follow identity_and_viewport_scope.sign_out_and_deletion."
    - "Draft records use explicit field allowlists and exclude identity, security, contact, payment, upload, file, and secret fields."

new_game_contract:
  required_inventory:
    - "Declare every remembered record in typed code."
    - "Provide every required field defined by shared_implementation_contract.record_definition."
    - "Mark account, viewport, partition, data-version, and merge requirements where applicable."
    - "Keep semantic records shared across desktop and mobile."
  adoption_rule: "A game is not memory-complete while it persists product state through app-local storage helpers."

verification:
  required_cases:
    - "Reload, Back, Forward, direct URL, new tab, tab close, and browser restart"
    - "Desktop-to-mobile and mobile-to-desktop breakpoint transitions"
    - "Anonymous use, sign-in adoption, logout, account deletion, and account switching"
    - "Expired, malformed, oversized, old-schema, future-schema, and changed-data-version records"
    - "Unavailable storage and private browsing"
    - "Two tabs changing one compatible device record"
    - "Explicit URL state overriding stored state without rewriting it"
    - "Clear, discard, submit success, submit failure, and destructive bulk reset"
    - "Offline local changes followed by account reconnection for synchronized records"
    - "Namespace budget exhaustion and a failed consequential-draft write"
    - "Device-only clear and all-device clear use visibly different labels and affect only their named scope"
  acceptance:
    - "The user resumes meaningful work without a stale overlay or unexpectedly hidden result set."
    - "The restored semantic state remains equivalent across desktop and mobile."
    - "Each clear action removes exactly the records named by its label."
    - "No prohibited credential, secret, token, payment value, or file byte appears in browser storage, logs, analytics, or URLs."
    - "A failed restore or synchronization request never blocks the page."

migration_from_1_1:
  breaking_changes:
    - "Rename device_preference to user_preference; storage scope is now declared separately."
    - "Reclassify recent destinations and resumable map views from durable_progress or device_preference to recent_activity."
    - "Reclassify catalog facets and ordinary semantic filters as session_context unless the product explicitly offers a saved default."
    - "Reclassify selected entities and markers as shareable_route or session_context, never as a durable preference."
    - "Remove the schema version from new canonical storage keys and migrate existing versioned keys explicitly."
    - "Replace the handwritten implementation inventory with typed declarations or a generated registry."
  implementation_gate: >-
    Version 2.0 is the normative target. The shared package and application
    records are not conformant until these migrations are implemented and the
    verification matrix passes.

maintenance:
  rules:
    - "Keep each policy in exactly one canonical section."
    - "A game may declare owned records but cannot redefine classes, scope semantics, restore rules, or default retention."
    - "Update this contract before introducing a new class, persistence scope, retention default, or conflict strategy."
    - "Update last_reviewed whenever the contract is intentionally reviewed."

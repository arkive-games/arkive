  <script>
    const locale = JSON.parse(document.getElementById('locale-zh-CN').textContent);
    const t = key => locale[key];
    document.title = 'Arkive · ' + t('title');
    document.querySelectorAll('.rail-link').forEach(el => { el.setAttribute('role', 'img'); el.setAttribute('aria-label', el.querySelector('span').dataset.i18n ? t(el.querySelector('span').dataset.i18n) : el.textContent.trim()); el.title = el.getAttribute('aria-label'); });
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    for (const [attribute, target] of [['data-i18n-aria', 'aria-label'], ['data-i18n-placeholder', 'placeholder'], ['data-i18n-alt', 'alt']]) {
      document.querySelectorAll('[' + attribute + ']').forEach(el => el.setAttribute(target, t(el.getAttribute(attribute))));
    }
    document.querySelectorAll('[data-i18n-value]').forEach(el => { el.value = t(el.dataset.i18nValue); });
    const root = document.documentElement;
    const context = document.getElementById('context-frame');
    const contextInput = document.getElementById('context-search');
    const referenceDialog = document.getElementById('reference-dialog');
    function setGeometry(geometry) {
      root.dataset.geometry = geometry;
      document.querySelectorAll('.variant').forEach(el => { el.dataset.picked = String(el.dataset.variant === geometry); });
      document.querySelectorAll('[data-pick]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.pick === geometry)));
      document.getElementById('current-geometry').textContent = t(geometry === 'compact' ? 'compactChoice' : 'pillChoice');
    }
    document.querySelectorAll('[data-pick]').forEach(button => button.addEventListener('click', () => setGeometry(button.dataset.pick)));
    function toggleTheme() {
      root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
      document.querySelectorAll('#theme-toggle use, #context-theme-toggle use').forEach(el => el.setAttribute('href', root.dataset.theme === 'light' ? '#i-moon' : '#i-sun'));

    }
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('context-theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('collapse-rail').addEventListener('click', event => {
      const collapsed = context.dataset.collapsed !== 'true';
      context.dataset.collapsed = String(collapsed);
      event.currentTarget.setAttribute('aria-expanded', String(!collapsed));
      event.currentTarget.setAttribute('aria-label', t(collapsed ? 'expand' : 'collapse'));
    });
    document.querySelectorAll('[data-sample-filters]').forEach(group => group.addEventListener('click', event => {
      const button = event.target.closest('.chip');
      if (button) group.querySelectorAll('.chip').forEach(el => el.setAttribute('aria-pressed', String(el === button)));
    }));
    let contextFilter = 'all';
    function updateFilterSummary() {
      const query = contextInput.value.trim();
      document.getElementById('filter-summary').textContent = contextFilter === 'all' && !query ? t('scopeNote') : t('filterPrefix') + t(contextFilter) + (query ? t('queryPrefix') + query : '');
      document.getElementById('reset-filters').hidden = contextFilter === 'all' && !query;
    }
    document.getElementById('context-filters').addEventListener('click', event => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      contextFilter = button.dataset.filter;
      document.querySelectorAll('#context-filters .chip').forEach(el => el.setAttribute('aria-pressed', String(el === button)));
      updateFilterSummary();
    });
    document.querySelectorAll('.catalog-search').forEach(form => form.addEventListener('submit', event => event.preventDefault()));
    document.querySelectorAll('input[type="search"]').forEach(input => input.addEventListener('input', () => {
      const clear = document.querySelector('[data-clear="' + input.id + '"]');
      if (clear) clear.hidden = !input.value;
      if (input === contextInput) updateFilterSummary();
    }));
    document.querySelectorAll('[data-clear]').forEach(button => button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.clear);
      input.value = '';
      input.dispatchEvent(new Event('input'));
      input.focus();
    }));
    document.getElementById('reset-filters').addEventListener('click', () => {
      contextFilter = 'all'; contextInput.value = '';
      document.querySelectorAll('#context-filters .chip').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.filter === 'all')));
      contextInput.dispatchEvent(new Event('input'));
      updateFilterSummary();
    });
    let noticeTimer;
    document.querySelectorAll('[data-demo]').forEach(button => button.addEventListener('click', () => {
      const notice = document.getElementById('demo-notice');
      notice.textContent = t(button.dataset.demo === 'login' ? 'loginDemo' : button.dataset.demo);
      notice.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { notice.hidden = true; }, 2400);
    }));
    document.getElementById('open-reference').addEventListener('click', () => referenceDialog.showModal());
    document.getElementById('close-reference').addEventListener('click', () => referenceDialog.close());
    referenceDialog.addEventListener('click', event => { if (event.target === referenceDialog) { const rect = referenceDialog.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) referenceDialog.close(); } });
    document.getElementById('catalog-study-search-form').addEventListener('submit', event => event.preventDefault());
    const catalogGrid = document.getElementById('catalog-study-grid');
    const catalogStatus = document.getElementById('catalog-study-status');
    let catalogFilter = 'all';
    function updateCatalogStudy() {
      const query = document.getElementById('catalog-card-search').value.trim().toLowerCase();
      let visibleCount = 0;
      catalogGrid.querySelectorAll('.catalog-study-card').forEach(card => {
        const matchesFilter = catalogFilter === 'all' || card.dataset.types.split(' ').includes(catalogFilter);
        const matchesQuery = !query || card.textContent.toLowerCase().includes(query);
        const visible = matchesFilter && matchesQuery;
        card.hidden = !visible;
        if (visible) visibleCount += 1;
      });
      catalogStatus.textContent = visibleCount + ' / 6 款游戏';
    }
    document.getElementById('catalog-study-filters').addEventListener('click', event => {
      const button = event.target.closest('[data-catalog-filter]');
      if (!button) return;
      catalogFilter = button.dataset.catalogFilter;
      document.querySelectorAll('[data-catalog-filter]').forEach(el => el.setAttribute('aria-pressed', String(el === button)));
      updateCatalogStudy();
    });
    document.getElementById('catalog-card-search').addEventListener('input', updateCatalogStudy);
    document.querySelectorAll('.catalog-study-favorite').forEach(button => button.addEventListener('click', event => {
      event.preventDefault();
      button.setAttribute('aria-pressed', String(button.getAttribute('aria-pressed') !== 'true'));
    }));
    setGeometry('compact'); updateFilterSummary(); updateCatalogStudy();
    addEventListener('message', event => {
      const frame = document.querySelector('.portal-footer-copy');
      if (event.origin === location.origin && event.source === frame.contentWindow && event.data?.type === 'arkive-footer-copy-height') frame.style.height = `${event.data.height}px`;
    });
  </script>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>诡秘之主 · 铁路大亨推演台</title>
    <meta name="description" content="挑战路线铁路大亨站点概率推演工具" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark">舟</div>
          <div>
            <h1>藏舟游戏攻略网 <span>万千攻略，藏于一舟</span></h1>
          </div>
        </div>
        <div class="topbar-tools"><button type="button">语言</button><button type="button">主题</button><button class="icon-tool" type="button" title="设置">⚙</button></div>
      </header>

      <section class="station-strip" aria-label="站点确认状态"><div class="station-strip-label"><span>站点状态</span><strong>已百分百确认的站点</strong></div><div class="station-track" id="confirmed-stations"></div></section>

      <section class="workspace-grid" id="planner">
        <aside class="control-column">
          <section class="panel route-panel">
            <div class="panel-heading compact"><div><h3>路线</h3></div></div>
            <label class="route-select-wrap" for="difficulty-select"><select id="difficulty-select" aria-label="路线"><option value="">请选择</option></select></label>
          </section>
          <section class="panel totals-panel">
            <div class="panel-heading">
              <div><h3>总站点配额</h3></div>
            </div>
            <form id="totals-form" class="totals-form">
              <label class="quota-field winery"><span>酒庄</span><small>酒庄站点</small><input id="winery-total" name="winery" type="number" min="0" max="15" value="5" /></label>
              <label class="quota-field food"><span>食铺</span><small>食铺站点</small><input id="food-total" name="food" type="number" min="0" max="15" value="5" /></label>
              <label class="quota-field trade"><span>商行</span><small>商行站点</small><input id="trade-total" name="trade" type="number" min="0" max="15" value="5" /></label>
            </form>
            <div class="quota-total"><span>已配置</span><strong id="quota-total-value">15</strong><span>/ 15 站</span></div>
            <div class="quota-message" id="quota-message" role="status"></div>
            <button class="secondary-button" id="quota-confirm-button" type="button" disabled>确认总站点配额</button>
          </section>
        </aside>

        <section class="panel forecast-panel" aria-live="polite">
          <div class="panel-heading forecast-heading">
            <div class="forecast-heading-main"><span class="section-kicker">挑战路线</span><h3>铁路大亨推演</h3></div>
            <div class="progress-readout"><strong id="progress-count">0</strong><span>/ 13 次信息解锁</span></div>
          </div>
          <div class="forecast-intro" id="forecast-intro">
            <div><strong>确认配额后开始</strong></div>
          </div>
          <div id="forecast-content" class="forecast-content is-hidden"></div>
        </section>
        <aside class="history-column">
          <section class="history-panel" aria-label="过往未来三站提示">
            <div class="history-heading"><strong>过往未来三站提示</strong><span id="history-count">0 条</span></div>
            <ol class="history-list" id="history-list"><li class="history-empty">暂无已确认提示</li></ol>
          </section>
        </aside>
      </section>

      <footer class="footer-note"><span>诡秘之主 · 铁路大亨</span><span>仅作路线决策辅助，最终结果以游戏内状态为准</span></footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>

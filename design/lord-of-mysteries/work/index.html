<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>诡秘之主 · Train Trade 推演台</title>
    <meta name="description" content="诡秘之主 Train Trade 站点概率推演工具" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark">舟</div>
          <div>
            <h1>藏舟攻略 <span>诡秘之主 · Train Trade</span></h1>
          </div>
        </div>
        <nav class="topbar-nav" aria-label="主导航"><a class="is-active" href="#planner" aria-current="page">工具库</a></nav>
      </header>

      <section class="workspace-grid" id="planner">
        <aside class="control-column">
          <section class="panel route-panel">
            <div class="panel-heading compact"><div><h3><span class="step-number">1</span>难度选择</h3></div></div>
            <label class="route-select-wrap" for="difficulty-select"><select id="difficulty-select" aria-label="难度选择"><option value="">请选择</option></select></label>
          </section>
          <section class="panel totals-panel">
            <div class="panel-heading">
              <div><h3><span class="step-number">2</span>总站点配额</h3></div>
            </div>
            <form id="totals-form" class="totals-form">
              <label class="quota-field winery"><span>酒庄</span><input id="winery-total" name="winery" type="number" min="0" max="15" value="5" /></label>
              <label class="quota-field food"><span>食铺</span><input id="food-total" name="food" type="number" min="0" max="15" value="5" /></label>
              <label class="quota-field trade"><span>商行</span><input id="trade-total" name="trade" type="number" min="0" max="15" value="5" /></label>
            </form>
            <div class="quota-message" id="quota-message" role="status"></div>
            <button class="secondary-button" id="quota-confirm-button" type="button" disabled>确认总站点配额</button>
          </section>
        </aside>

        <section class="panel forecast-panel" aria-live="polite">
          <div class="panel-heading forecast-heading">
            <div class="forecast-heading-main"><h2>诡秘之主 · Train Trade 推演工具</h2></div>
            <div class="progress-readout" aria-label="当前站与剩余站"><strong id="current-station">0</strong><span>/</span><span id="remaining-stations">15</span></div>
          </div>
          <section class="station-strip" aria-label="站点进度"><button class="station-nav" id="station-prev" type="button" aria-label="预览前面站点">←</button><div class="station-track" id="confirmed-stations"></div><button class="station-nav" id="station-next" type="button" aria-label="预览后面站点">→</button></section>
          <div class="forecast-intro" id="forecast-intro">
            <div><strong>确认配额后开始</strong></div>
          </div>
          <div id="forecast-content" class="forecast-content is-hidden"></div>
        </section>
        <aside class="history-column">
          <section class="remaining-panel" aria-label="剩余站点">
            <div class="remaining-heading"><strong>剩余站点</strong></div>
            <div class="remaining-value"><strong id="remaining-count">15</strong><span>站</span></div>
          </section>
          <section class="history-panel" aria-label="过往未来三站提示">
            <div class="history-heading"><strong>过往未来三站提示</strong><span id="history-count">0 条</span></div>
            <ol class="history-list" id="history-list"><li class="history-empty">暂无已确认提示</li></ol>
          </section>
        </aside>
      </section>

      <footer class="footer-note"><span>诡秘之主 · Train Trade</span><span>仅作路线决策辅助，最终结果以游戏内状态为准</span></footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>

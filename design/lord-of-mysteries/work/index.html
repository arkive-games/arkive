<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>诡秘之主 · 铁路大亨推演台</title>
    <meta name="description" content="诡秘之主铁路大亨站点概率推演工具" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace-grid" id="planner">
        <aside class="control-column">
          <div class="sidebar-title"><span>诡秘之主</span><h1>铁路大亨推演工具</h1></div>
          <section class="panel route-panel">
            <div class="panel-heading compact"><div><h3>难度选择</h3></div></div>
            <label class="route-select-wrap" for="difficulty-select"><select id="difficulty-select" aria-label="难度选择"><option value="" hidden></option></select></label>
            <p class="difficulty-description" id="difficulty-description">选择路线后查看该难度的规则摘要。</p>
          </section>
          <section class="station-summary-section">
            <div class="right-heading"><h2>站点统计</h2></div>
            <div class="station-table" role="table" aria-label="站点统计">
              <div class="station-table-header" role="row"><span role="columnheader">站点名</span><span role="columnheader">总站点数</span><span role="columnheader">剩余站点</span></div>
              <form id="totals-form">
                <label class="station-table-row quota-field winery" role="row"><span class="station-name" role="cell"><strong>酒庄</strong></span><span class="station-total-input"><input id="winery-total" name="winery" type="number" min="0" max="15" value="0" aria-label="酒庄总站点数" /></span><strong class="station-remaining" role="cell"><span id="remaining-winery">0</span><small>站</small></strong></label>
                <label class="station-table-row quota-field food" role="row"><span class="station-name" role="cell"><strong>食铺</strong></span><span class="station-total-input"><input id="food-total" name="food" type="number" min="0" max="15" value="0" aria-label="食铺总站点数" /></span><strong class="station-remaining" role="cell"><span id="remaining-food">0</span><small>站</small></strong></label>
                <label class="station-table-row quota-field trade" role="row"><span class="station-name" role="cell"><strong>商行</strong></span><span class="station-total-input"><input id="trade-total" name="trade" type="number" min="0" max="15" value="0" aria-label="商行总站点数" /></span><strong class="station-remaining" role="cell"><span id="remaining-trade">0</span><small>站</small></strong></label>
              </form>
            </div>
          </section>
          <section class="history-panel" aria-label="站点提示记录">
            <div class="history-heading"><strong>站点提示记录</strong><span id="history-count">0 条</span></div>
            <ol class="history-list" id="history-list"><li class="history-empty">暂无站点提示记录</li></ol>
          </section>
        </aside>

        <section class="forecast-panel" aria-live="polite">
          <section class="progress-section">
            <div class="station-strip" aria-label="站点进度"><button class="station-nav" id="station-prev" type="button" aria-label="预览前面站点">←</button><div class="station-track" id="confirmed-stations"></div><button class="station-nav" id="station-next" type="button" aria-label="预览后面站点">→</button></div>
          </section>
          <div class="forecast-intro" id="forecast-intro">
            <div><strong>确认配额后开始</strong></div>
          </div>
          <div id="forecast-content" class="forecast-content is-hidden"></div>
          <div class="decision-toolbar" id="decision-toolbar"></div>
        </section>
      </section>

    </main>
    <dialog class="goods-picker-dialog strategy-picker-dialog" id="strategy-picker-dialog" aria-labelledby="strategy-picker-title">
      <div class="goods-picker-header"><h2 id="strategy-picker-title">策略卡池</h2><button type="button" id="strategy-picker-close" aria-label="关闭策略卡选择">×</button></div>
      <label class="strategy-search" for="strategy-search"><input id="strategy-search" type="search" autocomplete="off" aria-label="搜索策略卡" placeholder="搜索策略卡" /><svg class="strategy-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></label>
      <div class="strategy-filter-bar"><span>按词条前缀</span><div class="strategy-filter-options" id="strategy-prefix-options" role="group" aria-label="按策略卡词条前缀筛选"></div></div>
      <div class="goods-picker-grid strategy-picker-grid" id="strategy-picker-grid"></div>
    </dialog>
    <script src="./strategy-data.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>

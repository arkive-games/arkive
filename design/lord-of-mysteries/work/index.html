<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>诡秘之主 · 铁路大亨推演台</title>
    <meta name="description" content="诡秘之主铁路大亨站点概率推演工具" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace-grid" id="planner">
        <aside class="control-column">
          <div class="sidebar-title"><span>诡秘之主</span><h1>铁路大亨推演工具</h1></div>
          <section class="panel route-panel">
            <div class="panel-heading compact"><div><h3>难度选择</h3></div></div>
            <label class="route-select-wrap" for="difficulty-select"><select id="difficulty-select" aria-label="难度选择"><option value="" hidden></option></select></label>
            <p class="difficulty-description" id="difficulty-description">选择路线后查看该难度的规则摘要。</p>
          </section>
          <section class="station-summary-section">
            <div class="right-heading"><h2>站点统计</h2></div>
            <div class="station-table" role="table" aria-label="站点统计">
              <div class="station-table-header" role="row"><span role="columnheader">站点名</span><span role="columnheader">总站点数</span><span role="columnheader">剩余站点</span></div>
              <form id="totals-form">
                <label class="station-table-row quota-field winery" role="row"><span class="station-name" role="cell"><strong>酒庄</strong></span><span class="station-total-input"><input id="winery-total" name="winery" type="number" min="0" max="15" value="5" aria-label="酒庄总站点数" /></span><strong class="station-remaining" role="cell"><span id="remaining-winery">5</span><small>站</small></strong></label>
                <label class="station-table-row quota-field food" role="row"><span class="station-name" role="cell"><strong>食铺</strong></span><span class="station-total-input"><input id="food-total" name="food" type="number" min="0" max="15" value="5" aria-label="食铺总站点数" /></span><strong class="station-remaining" role="cell"><span id="remaining-food">5</span><small>站</small></strong></label>
                <label class="station-table-row quota-field trade" role="row"><span class="station-name" role="cell"><strong>商行</strong></span><span class="station-total-input"><input id="trade-total" name="trade" type="number" min="0" max="15" value="5" aria-label="商行总站点数" /></span><strong class="station-remaining" role="cell"><span id="remaining-trade">4</span><small>站</small></strong></label>
              </form>
              <div class="station-table-footer" role="row"><strong role="cell">合计</strong><strong id="quota-total" role="cell">15</strong><strong id="quota-remaining" role="cell">15<small>站</small></strong></div>
            </div>
            <div class="quota-message" id="quota-message" role="status"></div>
            <button class="secondary-button" id="quota-confirm-button" type="button" disabled>确认总站点配额</button>
          </section>
          <section class="history-panel" aria-label="过往提示">
            <div class="history-heading"><strong>过往提示</strong><span id="history-count">0 条</span></div>
            <ol class="history-list" id="history-list"><li class="history-empty">暂无已确认提示</li></ol>
          </section>
        </aside>

        <section class="forecast-panel" aria-live="polite">
          <section class="progress-section">
            <div class="station-strip" aria-label="站点进度"><button class="station-nav" id="station-prev" type="button" aria-label="预览前面站点">←</button><div class="station-track" id="confirmed-stations"></div><button class="station-nav" id="station-next" type="button" aria-label="预览后面站点">→</button></div>
          </section>
          <div class="decision-toolbar" id="decision-toolbar"><div class="decision-block decision-back"><label for="undo-step">返回上一步</label><button class="back-step-button" id="undo-step" type="button" aria-label="返回上一步" disabled>←</button></div></div>
          <div class="forecast-intro" id="forecast-intro">
            <div><strong>确认配额后开始</strong></div>
          </div>
          <div id="forecast-content" class="forecast-content is-hidden"></div>
        </section>
        <aside class="utility-column" aria-label="推演辅助工具">
          <section class="utility-panel multiplier-panel">
            <div class="utility-heading"><h2>本周高倍</h2></div>
            <div class="recommendation-copy">本周推荐物资（选择两种）</div>
            <div class="recommendation-selects">
              <label class="utility-select-wrap" for="recommend-category-1"><span>推荐物资 1</span><select id="recommend-category-1" aria-label="推荐物资 1"></select></label>
              <label class="utility-select-wrap" for="recommend-category-2"><span>推荐物资 2</span><select id="recommend-category-2" aria-label="推荐物资 2"></select></label>
            </div>
          </section>
          <section class="utility-panel supplies-panel">
            <div class="utility-heading"><h2>初始物资</h2></div>
            <div class="supply-list" id="supply-list">
              <div class="supply-entry"><button class="supply-picker" type="button" data-supply-slot="0" aria-label="选择初始物资 1"><span class="supply-placeholder">＋</span><span>选择物资</span></button><span class="supply-quantity-label">数量</span><input type="number" min="0" max="999" value="0" data-supply-quantity aria-label="初始物资 1 数量" /></div>
              <div class="supply-entry"><button class="supply-picker" type="button" data-supply-slot="1" aria-label="选择初始物资 2"><span class="supply-placeholder">＋</span><span>选择物资</span></button><span class="supply-quantity-label">数量</span><input type="number" min="0" max="999" value="0" data-supply-quantity aria-label="初始物资 2 数量" /></div>
              <div class="supply-entry"><button class="supply-picker" type="button" data-supply-slot="2" aria-label="选择初始物资 3"><span class="supply-placeholder">＋</span><span>选择物资</span></button><span class="supply-quantity-label">数量</span><input type="number" min="0" max="999" value="0" data-supply-quantity aria-label="初始物资 3 数量" /></div>
            </div>
          </section>
          <section class="utility-panel rules-panel" aria-label="包体规则">
            <div class="utility-heading"><h2>包体规则</h2><span>客户端配置</span></div>
            <div class="rule-stats">
              <div class="rule-stat"><span>合同检查</span><strong id="rule-contract-interval">4 站 / 区域</strong></div>
              <div class="rule-stat"><span>当前路线</span><strong id="rule-area-count">4 + 4 + 4 + 4（共 16 站）</strong></div>
              <div class="rule-stat"><span>策略卡刷新</span><strong id="rule-refresh-base">3 槽位 · 基础 1 次</strong></div>
              <div class="rule-stat"><span>价格范围</span><strong id="rule-price-range">买入 0.7–1.4 倍 · 卖出 0.6–1.5 倍</strong></div>
            </div>
            <div class="rule-subheading">驾驶舱升级</div>
            <div class="rule-driver-list" id="rule-driver-list"></div>
            <label class="utility-select-wrap rule-control" for="rule-pool-select"><span>站点池权重（包体）</span><select id="rule-pool-select" aria-label="站点池权重"></select></label>
            <div class="rule-pool-summary" id="rule-pool-summary"></div>
            <label class="utility-select-wrap rule-control" for="rule-goods-type"><span>站点候选货品</span><select id="rule-goods-type" aria-label="站点候选货品"><option value="winery">酒庄</option><option value="food">食铺</option><option value="trade">商行</option></select></label>
            <div class="rule-goods-reference" id="rule-goods-reference"></div>
            <div class="rule-subheading">价格倍率表</div>
            <div class="rule-price-ranges" id="rule-price-ranges"></div>
          </section>
        </aside>
      </section>

    </main>
    <dialog class="goods-picker-dialog" id="goods-picker-dialog" aria-labelledby="goods-picker-title">
      <div class="goods-picker-header"><h2 id="goods-picker-title">铁路大亨货物</h2><button type="button" id="goods-picker-close" aria-label="关闭物资选择">×</button></div>
      <p class="goods-picker-note">从货物清单中选择初始物资，可全部留空。</p>
      <div class="goods-picker-grid" id="goods-picker-grid"></div>
    </dialog>
    <script src="./app.js" defer></script>
  </body>
</html>
